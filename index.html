<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="School" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-light.svg?v=2" type="image/svg+xml" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="./icon-dark.svg?v=2" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <link id="school-touch-icon" rel="apple-touch-icon" href="./icon-light.svg?v=2" />
    <script>
      (() => {
        const scheme = window.matchMedia('(prefers-color-scheme: dark)')
        const touchIcon = document.getElementById('school-touch-icon')
        const applyTouchIcon = () => {
          touchIcon.href = scheme.matches ? './icon-dark.svg?v=2' : './icon-light.svg?v=2'
        }
        applyTouchIcon()
        if (scheme.addEventListener) scheme.addEventListener('change', applyTouchIcon)
        else if (scheme.addListener) scheme.addListener(applyTouchIcon)
      })()
    </script>
    <link rel="stylesheet" href="./school-sheet.css" />
    <link rel="stylesheet" href="./reminder-sheet.css" />
    <link rel="stylesheet" href="./school-refinements.css" />
    <link rel="stylesheet" href="./stage3-polish.css" />
    <link rel="stylesheet" href="./school-page-motion.css" />
    <link rel="stylesheet" href="./reminder-list-motion.css" />
    <link rel="stylesheet" href="./school-home-live.css" />
    <link rel="stylesheet" href="./first-run-notice.css" />
    <title>School</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="./school-academic-supplement.js"></script>
    <script defer src="./reminder-sheet.js"></script>
    <script defer src="./school-sheet.js"></script>
    <script defer src="./school-timetable-motion.js"></script>
    <script defer src="./school-home-nav.js"></script>
    <script defer src="./school-home-live.js"></script>
    <script defer src="./first-run-notice.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
