    <style>
      :root {
        --shub-launch-bg: #000000;
        --shub-launch-fg: #f5f5f7;
        --shub-launch-track: rgba(255, 255, 255, .14);
        --shub-launch-shadow: rgba(0, 0, 0, .34);
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background-color: #000000;
      }

      #shub-launch-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding:
          max(24px, env(safe-area-inset-top))
          24px
          max(24px, env(safe-area-inset-bottom));
        background: var(--shub-launch-bg);
        color: var(--shub-launch-fg);
        opacity: 1;
        visibility: visible;
        transition:
          opacity 160ms cubic-bezier(.22, 1, .36, 1),
          visibility 0s linear 160ms;
        -webkit-tap-highlight-color: transparent;
      }

      #shub-launch-splash.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .shub-launch-center {
        display: grid;
        justify-items: center;
        gap: 24px;
        transform: translateY(-2vh);
      }

      .shub-launch-logo {
        width: 78px;
        height: 78px;
        overflow: hidden;
        border-radius: 22px;
        box-shadow:
          0 18px 46px var(--shub-launch-shadow),
          inset 0 0 0 .5px rgba(255, 255, 255, .1);
        animation: shub-launch-logo-in 440ms cubic-bezier(.22, 1, .36, 1) both;
      }

      .shub-launch-logo img {
        display: block;
        width: 100%;
        height: 100%;
      }

      .shub-launch-progress {
        width: 138px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--shub-launch-track);
      }

      .shub-launch-progress > span {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: var(--shub-launch-fg);
        transform: translateZ(0) scaleX(.08);
        transform-origin: 0 50%;
        will-change: transform;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }

      @keyframes shub-launch-logo-in {
        from {
          opacity: 0;
          transform: translate3d(0, 8px, 0) scale(.9);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #shub-launch-splash {
          transition-duration: .01ms;
        }

        .shub-launch-logo {
          animation-duration: .01ms;
        }

        .shub-launch-progress > span {
          transition-duration: .01ms;
        }
      }
    </style>
    <script>
      (() => {
        const root = document.documentElement

        // Theme transitions are useful after launch, but the stored theme must own the first paint.
        root.style.setProperty('transition', 'none', 'important')
        try {
          const stored = JSON.parse(localStorage.getItem('school.themePreferences.v1') || 'null')
          const firstPaintModes = new Set(['light', 'dark'])
          const firstPaintAccents = new Set([
            'gray',
            'pink',
            'blue',
            'lavender',
            'mint',
            'peach',
            'avocado',
            'cream',
            'ivory',
          ])
          const mode = stored?.mode
          const accent = stored?.accent === 'sand' ? 'cream' : stored?.accent

          if (firstPaintModes.has(mode)) root.dataset.themeMode = mode
          if (firstPaintAccents.has(accent)) root.dataset.themeAccent = accent
        } catch {
          // The canonical theme owner will fall back to system/default after module startup.
        }

        const ua = navigator.userAgent
        const mobileBrowser = /iPhone|iPod|Android|SamsungBrowser/i.test(ua)
        const samsungBrowser = /SamsungBrowser/i.test(ua)
        const iPadDesktopUA = /Macintosh/i.test(ua) && navigator.maxTouchPoints > 1
        const finePointer = window.matchMedia?.('(hover: hover) and (pointer: fine)').matches
        if (samsungBrowser) {
          root.classList.add('school-samsung')
        }
        if (!mobileBrowser && !iPadDesktopUA && finePointer) {
          root.classList.add('school-desktop-laptop')
        }

        const launchState = {
          progressTarget: 0.08,
          progressPainted: 0.08,
          progressFrame: 0,
          progressFrameAt: 0,
          leaving: false,
          removeTimer: null,
          themed: false,
          targetBg: '#f5f5f7',
          targetFg: '#161617',
          dark: false,
          lastThemeColorMix: -1,
        }

        function resolveLaunchTheme() {
          if (launchState.themed) return
          const styles = getComputedStyle(root)
          const explicitMode = root.dataset.themeMode
          launchState.dark = explicitMode === 'dark'
            || (!explicitMode && window.matchMedia?.('(prefers-color-scheme: dark)').matches)
          launchState.targetBg = styles.getPropertyValue('--bg').trim() || (launchState.dark ? '#000000' : '#f5f5f7')
          launchState.targetFg = launchState.dark ? '#f5f5f7' : '#161617'
          launchState.themed = true
        }

        function launchThemeMix(progress) {
          const normalized = Math.max(0, Math.min(1, (progress - .14) / .84))
          return normalized * normalized * (3 - 2 * normalized)
        }

        function paintLaunchTheme(progress, force = false) {
          resolveLaunchTheme()
          const splash = document.getElementById('shub-launch-splash')
          if (!splash) return

          const mix = force ? 1 : launchThemeMix(progress)
          const targetPercent = Math.round(mix * 1000) / 10
          const blackPercent = Math.max(0, 100 - targetPercent)
          const mixedBg = `color-mix(in srgb, #000000 ${blackPercent}%, ${launchState.targetBg} ${targetPercent}%)`
          const mixedFg = `color-mix(in srgb, #f5f5f7 ${blackPercent}%, ${launchState.targetFg} ${targetPercent}%)`
          const mixedTrack = launchState.dark
            ? 'rgba(255, 255, 255, .14)'
            : `color-mix(in srgb, rgba(255,255,255,.14) ${blackPercent}%, rgba(22,22,23,.09) ${targetPercent}%)`

          splash.style.backgroundColor = mixedBg
          splash.style.color = mixedFg
          root.style.backgroundColor = mixedBg
          if (document.body) document.body.style.backgroundColor = mixedBg
          root.style.setProperty('--shub-launch-fg', mixedFg)
          root.style.setProperty('--shub-launch-track', mixedTrack)
          root.style.setProperty('--shub-launch-shadow', launchState.dark ? 'rgba(0, 0, 0, .44)' : 'rgba(0, 0, 0, .14)')

          // Keep browser/system chrome paced with the same launch phase instead of
          // jumping to the final theme while the splash is still mostly black.
          if (force || Math.abs(mix - launchState.lastThemeColorMix) >= .08) {
            launchState.lastThemeColorMix = mix
            const themeColor = document.getElementById('shub-theme-color')
            const resolvedMixedBg = getComputedStyle(splash).backgroundColor || mixedBg
            if (themeColor) themeColor.setAttribute('content', force ? launchState.targetBg : resolvedMixedBg)
          }
        }

        function animateLaunchProgress(frameAt) {
          launchState.progressFrame = 0
          const fill = document.getElementById('shub-launch-progress-fill')
          if (!fill) {
            launchState.progressFrame = requestAnimationFrame(animateLaunchProgress)
            return
          }

          const previousAt = launchState.progressFrameAt || frameAt
          const delta = Math.min(48, Math.max(0, frameAt - previousAt))
          launchState.progressFrameAt = frameAt
          const distance = launchState.progressTarget - launchState.progressPainted
          const blend = 1 - Math.exp(-delta / 135)

          if (Math.abs(distance) <= .0006) {
            launchState.progressPainted = launchState.progressTarget
          } else {
            launchState.progressPainted += distance * blend
          }

          fill.style.transform = `translateZ(0) scaleX(${launchState.progressPainted})`
          paintLaunchTheme(launchState.progressPainted)

          if (Math.abs(launchState.progressTarget - launchState.progressPainted) > .0006) {
            launchState.progressFrame = requestAnimationFrame(animateLaunchProgress)
          } else {
            launchState.progressFrameAt = 0
          }
        }

        function paintLaunchProgress(value) {
          const next = Math.max(launchState.progressTarget, Math.min(1, Number(value) || 0))
          launchState.progressTarget = next
          if (!launchState.progressFrame) {
            launchState.progressFrame = requestAnimationFrame(animateLaunchProgress)
          }
        }

        function refreshLaunchTheme() {
          launchState.themed = false
          launchState.lastThemeColorMix = -1
          paintLaunchTheme(launchState.progressPainted)
        }

        function finishLaunch({ settleMs = 60 } = {}) {
          if (launchState.leaving) return
          paintLaunchProgress(1)
          window.clearTimeout(launchState.removeTimer)
          launchState.removeTimer = window.setTimeout(() => {
            const splash = document.getElementById('shub-launch-splash')
            if (!splash || launchState.leaving) return

            paintLaunchTheme(1, true)
            launchState.leaving = true
            splash.classList.add('is-leaving')
            window.setTimeout(() => {
              splash.remove()
              root.style.removeProperty('background-color')
              document.body?.style.removeProperty('background-color')
            }, 220)
          }, Math.max(0, Math.min(320, Number(settleMs) || 0)))
        }

        window.__shubLaunch = {
          version: 20,
          progress: paintLaunchProgress,
          refreshTheme: refreshLaunchTheme,
          ready: finishLaunch,
        }

        document.addEventListener('DOMContentLoaded', () => {
          paintLaunchProgress(.14)
          requestAnimationFrame(() => requestAnimationFrame(() => paintLaunchTheme(launchState.progressPainted)))
        }, { once: true })

        requestAnimationFrame(() => {
          requestAnimationFrame(() => root.style.removeProperty('transition'))
        })
      })()
    </script>
