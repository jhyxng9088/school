<!doctype html>
<html lang="ko">
  <head>

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest?v=10" />
    <link rel="icon" sizes="any" href="./icon.svg?v=9" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg?v=9" />
    <link rel="stylesheet" href="./school-refinements.css" />
    <link rel="stylesheet" href="./stage3-polish.css" />

    <link rel="stylesheet" href="./samsung-nav-icon-fixes.css?v=4" />
    <style>
      /* The reminder page must use the exact same page transition as the other tabs.
         This intentionally overrides the old reminder-only `animation: none !important`. */
      html body .app-content:has(> .todo-page) {
        animation: content-in 980ms cubic-bezier(0.16, 1, 0.3, 1) both !important;
      }
      html.school-mobile-compat body .app-content:has(> .todo-page) {
        animation-duration: 760ms !important;
      }
      @media (prefers-reduced-motion: reduce) {
        html body .app-content:has(> .todo-page) {
          animation-duration: 0.01ms !important;
        }
      }
    </style>
    <title>S-Hub</title>
  </head>

    <script defer src="./school-timetable-motion.js"></script>
    <script defer src="./school-home-nav.js"></script>

    <script defer src="./first-run-notice.js"></script>
    <script defer src="./notification-routing.js"></script>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module" src="/src/push-client.js"></script>

  </body>
