<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="School">
  <defs>
    <linearGradient id="lightBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#eceff3"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34383c"/>
      <stop offset="1" stop-color="#292d30"/>
    </linearGradient>
    <filter id="lightShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#6f7780" flood-opacity="0.24"/>
    </filter>
    <filter id="darkShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <style>
      .light { display: block; }
      .dark { display: none; }
      @media (prefers-color-scheme: dark) {
        .light { display: none; }
        .dark { display: block; }
      }
    </style>
  </defs>

  <g class="light">
    <rect x="26" y="26" width="460" height="460" rx="92" fill="url(#lightBg)" stroke="#ffffff" stroke-width="3" filter="url(#lightShadow)"/>
    <g fill="none" stroke="#151515" stroke-width="29" stroke-linecap="round" stroke-linejoin="round">
      <path d="M171 191H311"/>
      <path d="M171 191V349Q171 371 193 371H350V237"/>
      <path d="M193 402H350"/>
      <path d="M220 254L268 309L383 181" stroke-width="37"/>
    </g>
  </g>

  <g class="dark">
    <rect x="26" y="26" width="460" height="460" rx="92" fill="url(#darkBg)" stroke="#555a5e" stroke-width="3" filter="url(#darkShadow)"/>
    <g fill="none" stroke="#ffffff" stroke-width="29" stroke-linecap="round" stroke-linejoin="round">
      <path d="M171 191H311"/>
      <path d="M171 191V349Q171 371 193 371H350V237"/>
      <path d="M193 402H350"/>
      <path d="M220 254L268 309L383 181" stroke-width="37"/>
    </g>
  </g>
</svg>
