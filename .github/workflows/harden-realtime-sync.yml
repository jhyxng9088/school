name: Harden realtime sync
on:
  push:
    paths:
      - '.github/workflows/harden-realtime-sync.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/harden-realtime-sync.mjs
      - run: npm install
      - run: npm run build
      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/school-sync.js src/class-activity.js public/sw.js
          git commit -m 'Harden realtime class sync across mobile browsers'
          git push
