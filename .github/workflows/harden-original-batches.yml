name: Harden original batches

on:
  push:
    paths:
      - '.github/workflows/harden-original-batches.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded hardening
        run: node scripts/harden-original-batches.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit verified hardening
        run: |
          git config user.name "jhyxng9088"
          git config user.email "j.hyxng9088@gmail.com"
          git add src/school-sync.js
          git commit -m "Harden original reminder uploads"
          git push
