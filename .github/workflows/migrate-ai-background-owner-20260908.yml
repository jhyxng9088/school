name: Migrate AI background owner 20260908

on:
  push:
    branches:
      - work/ai-background-owner-retire-20260908
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrate-ai-background-owner-20260908
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: work/ai-background-owner-retire-20260908
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Capture current production build
        run: |
          npm run build
          rm -rf /tmp/s-hub-dist-before
          cp -a dist /tmp/s-hub-dist-before

      - name: Migrate AI background ownership
        run: python scripts/migrate-ai-background-owner-20260908.py

      - name: Remove retired and temporary owners
        run: |
          rm src/preview-ai-background-patch.js
          rm scripts/migrate-ai-background-owner-20260908.py
          rm .github/workflows/migrate-ai-background-owner-20260908.yml

      - name: Verify changed-file boundary
        run: |
          git diff --check
          git diff --name-only | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          .github/workflows/migrate-ai-background-owner-20260908.yml
          scripts/migrate-ai-background-owner-20260908.py
          src/preview-ai-background-patch.js
          src/preview-ai-stage-motion-patch.js
          tests/build-patch-effect.test.js
          tests/final-runtime-owner.test.js
          tests/preview-ai-background.test.js
          tests/preview-ai-vertical-center.test.js
          vite.config.js
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Verify final production build equivalence
        run: |
          rm -rf dist
          npm run build
          diff -qr /tmp/s-hub-dist-before dist

      - name: Test production app
        run: npm test

      - name: Test production backend
        working-directory: push-backend-v2
        run: |
          npm ci
          npm test

      - name: Commit clean migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: retire AI background build owner'
          git push origin HEAD:work/ai-background-owner-retire-20260908
