name: Validate S-Hub V2 Production Candidate

on:
  push:
    branches: [release/s-hub-v2-production-20260902]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4

      - name: Stage final production repository shape
        run: |
          rm -f .github/workflows/preview-pages-deploy.yml
          rm -f .github/workflows/preview-runtime-qa.yml
          rm -f .github/workflows/release-v2-validation.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Test production app
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Verify production build is not preview-isolated
        run: |
          test -f dist/v2-update-notice.js
          test -f dist/v2-update-audience.js
          python - <<'PY'
          from pathlib import Path
          bad = False
          for needle in ('school.preview.', 'preview-class-'):
              for p in Path('dist').rglob('*'):
                  if not p.is_file():
                      continue
                  try:
                      text = p.read_text()
                  except Exception:
                      continue
                  start = 0
                  while True:
                      i = text.find(needle, start)
                      if i < 0:
                          break
                      bad = True
                      left = max(0, i - 180)
                      right = min(len(text), i + len(needle) + 260)
                      print(f'FOUND {needle!r} in {p}: {text[left:right]!r}')
                      start = i + len(needle)
          if bad:
              raise SystemExit('preview identity/storage marker leaked into production build')
          PY

      - name: Install backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Test production backend
        working-directory: push-backend-v2
        run: npm test
