name: Verify S-Hub AI hybrid answer and cache v152

on:
  push:
    branches:
      - fix/s-hub-ai-hybrid-answer-import-v152

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded hybrid patch
        run: |
          python3 tools/apply_s_hub_hybrid_cache_v152.py
          python3 tools/extend_s_hub_hybrid_cache_v152.py

      - name: Remove temporary verification machinery
        run: |
          rm .github/workflows/verify-s-hub-ai-hybrid-cache-v152.yml
          rm tools/apply_s_hub_hybrid_cache_v152.py
          rm tools/extend_s_hub_hybrid_cache_v152.py
          rmdir tools

      - name: Verify final repository shape
        run: |
          git diff --check
          test ! -d tools
          test ! -e .github/workflows/verify-s-hub-ai-hybrid-cache-v152.yml
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          grep -q "ATTACHMENT_QUESTION_SCHEMA" src/s-hub-ai.js
          grep -q "mode: 'hybrid'" src/s-hub-ai-sheet.jsx
          grep -q "AI_CACHE_TTL_MS = 10 \* 60 \* 1000" push-backend-v2/api/s-hub-ai.js
          grep -q "createHash('sha256')" push-backend-v2/api/s-hub-ai.js
          grep -q "school-shell-v152" public/sw.js

      - name: Install app dependencies
        run: npm ci

      - name: Test app
        run: npm test

      - name: Build app
        run: npm run build

      - name: Install backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Test backend
        working-directory: push-backend-v2
        run: npm test

      - name: Commit verified clean tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Show answer and import candidates together with safe AI cache [skip ci]"
          git push origin HEAD:fix/s-hub-ai-hybrid-answer-import-v152
