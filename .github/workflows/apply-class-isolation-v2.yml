name: Retry class isolation patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-class-isolation-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reuse guarded patch script
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-class-isolation.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          Path('/tmp/apply-class-isolation.py').write_text(script)
          PY
          python3 /tmp/apply-class-isolation.py

      - name: Remove one-shot workflow files before repository tests
        run: rm .github/workflows/apply-class-isolation.yml .github/workflows/apply-class-isolation-v2.yml

      - name: Install app dependencies
        run: npm ci

      - name: Test app
        run: npm test

      - name: Build app
        run: npm run build

      - name: Check cleanup module syntax
        run: node --check src/academic-expiry-cleanup.js

      - name: Install reminder backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Test reminder backend
        working-directory: push-backend-v2
        run: npm test

      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Isolate class data and prune expired academic events"
          git push origin HEAD:main
