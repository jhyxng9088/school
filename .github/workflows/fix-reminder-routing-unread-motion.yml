name: Fix reminder routing unread and motion

on:
  push:
    paths:
      - '.github/workflows/fix-reminder-routing-unread-motion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch reminder routing unread state and motion
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1))

          # 1) Canonical visible name: Reminder everywhere in the React nav.
          replace_once(
              'src/main.jsx',
              "  { id: 'todo', label: '투두' },",
              "  { id: 'todo', label: '리마인더' },",
              'main nav reminder label',
          )

          # 2) Use the same page-level entrance animation as timetable/academic.
          replace_once(
              'src/todo-stage5.css',
              """/* Reminder owns its entrance rhythm. Disable the parent app-content entrance only
   while it contains the reminder page so the same copy is not animated twice. */
html body .app-content:has(> .todo-page) {
  animation: none !important;
}

""",
              "",
              'remove reminder-only page animation override',
          )

          # 3) Canonical routing label: no runtime alias dance.
          replace_once(
              'public/notification-routing.js',
              "    todo: ['리마인더', '투두'],",
              "    todo: ['리마인더'],",
              'notification reminder label',
          )

          # Remove the old DOM label-rewrite shim now that React owns the correct label.
          replace_once(
              'public/school-home-nav.js',
              """  function syncReminderLabel() {
    const label = document.querySelector('.bottom-nav .nav-button:nth-of-type(2) span')
    if (label && label.textContent !== '리마인더') label.textContent = '리마인더'
  }

  function sync() {
    syncReminderLabel()
    enhanceHome()
  }
""",
              """  function sync() {
    enhanceHome()
  }
""",
              'remove reminder label rewrite shim',
          )

          p = Path('src/unread-indicators.js')
          text = p.read_text()

          def one(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          one(
              """const NAV_STATE_IDS = {
  todo: `${INTERNAL_PREFIX}nav_todo`,
  timetable: `${INTERNAL_PREFIX}nav_timetable`,
  academic: `${INTERNAL_PREFIX}nav_academic`,
  meal: `${INTERNAL_PREFIX}nav_meal`,
}
""",
              """const NAV_STATE_IDS = {
  todo: `${INTERNAL_PREFIX}nav_todo`,
  timetable: `${INTERNAL_PREFIX}nav_timetable`,
  academic: `${INTERNAL_PREFIX}nav_academic`,
  meal: `${INTERNAL_PREFIX}nav_meal`,
}
const REMINDER_ROW_BASELINE_ID = `${INTERNAL_PREFIX}reminder_rows_v2`
""",
              'add reminder row baseline id',
          )

          one(
              """const LABEL_TO_TAB = {
  '투두': 'todo',
  '리마인더': 'todo',
  '시간표': 'timetable',
  '급식': 'meal',
  '학사일정': 'academic',
}
""",
              """const LABEL_TO_TAB = {
  '리마인더': 'todo',
  '시간표': 'timetable',
  '급식': 'meal',
  '학사일정': 'academic',
}
""",
              'canonical unread reminder label',
          )

          one(
              """    seen: new Map(),
    mealAvailable: hasTodayMealInCache(),
    stopped: false,
""",
              """    seen: new Map(),
    activityReady: false,
    seenReady: false,
    mealAvailable: hasTodayMealInCache(),
    stopped: false,
""",
              'add unread readiness flags',
          )

          one(
              """  function reminderActivityVersion(todo) {
    if (!todo?.id) return 0
    const activity = state.activity.get(`reminder:${todo.id}`)
    if (!activity) return 0
    if (activity.actorStudentKey && activity.actorStudentKey === studentKey) return 0
    return Number(activity.updatedAt || 0)
  }

  function summaryUnread(todo) {
    if (!todo || !readableSummary(todo.summary)) return false
    const version = reminderActivityVersion(todo)
    if (version <= 0) return false
    return version > seenVersion(safeReminderStateId(todo.id))
  }
""",
              """  function reminderActivityVersion(todo) {
    if (!todo?.id) return 0
    const activity = state.activity.get(`reminder:${todo.id}`)
    if (!activity || activity.action !== 'edited') return 0
    if (activity.actorStudentKey && activity.actorStudentKey === studentKey) return 0
    return Number(activity.updatedAt || 0)
  }

  function summaryUnread(todo) {
    if (!state.activityReady || !state.seenReady) return false
    if (!todo || !readableSummary(todo.summary)) return false
    const baseline = seenVersion(REMINDER_ROW_BASELINE_ID)
    if (baseline <= 0) return false
    const version = reminderActivityVersion(todo)
    if (version <= 0) return false
    return version > Math.max(baseline, seenVersion(safeReminderStateId(todo.id)))
  }
""",
              'make reminder dots edit-specific and baseline-aware',
          )

          one(
              """  function navUnread(tab) {
    if (tab === 'todo') {
      return otherActivityVersion('reminder') > seenVersion(NAV_STATE_IDS.todo) || hasUnreadSummary()
    }
""",
              """  function navUnread(tab) {
    if (tab === 'todo') {
      const baseline = seenVersion(REMINDER_ROW_BASELINE_ID)
      return otherActivityVersion('reminder') > Math.max(seenVersion(NAV_STATE_IDS.todo), baseline) || hasUnreadSummary()
    }
""",
              'tie reminder nav dot to baseline and per-row unread',
          )

          one(
              """  function render() {
    state.mealAvailable = hasTodayMealInCache()
    renderReminderRows()
    renderNav()
    const tab = activeTab()
    if (tab) markTabSeen(tab)
  }
""",
              """  function ensureReminderRowBaseline() {
    if (!state.activityReady || !state.seenReady) return
    if (seenVersion(REMINDER_ROW_BASELINE_ID) > 0) return
    writeSeen(REMINDER_ROW_BASELINE_ID, Math.max(1, otherActivityVersion('reminder')))
  }

  function render() {
    state.mealAvailable = hasTodayMealInCache()
    ensureReminderRowBaseline()
    renderReminderRows()
    renderNav()
    const tab = activeTab()
    if (tab) markTabSeen(tab)
  }
""",
              'initialize reminder row baseline before rendering dots',
          )

          one(
              """      next.set(`${value.entityType}:${value.entityId}`, {
        entityType: String(value.entityType),
        entityId: String(value.entityId),
        actorStudentKey: String(value.actorStudentKey || ''),
        updatedAt: Number(value.updatedAt || 0),
      })
    })
    state.activity = next
    scheduleRender()
""",
              """      next.set(`${value.entityType}:${value.entityId}`, {
        entityType: String(value.entityType),
        entityId: String(value.entityId),
        actorStudentKey: String(value.actorStudentKey || ''),
        action: value.action === 'added' ? 'added' : 'edited',
        updatedAt: Number(value.updatedAt || 0),
      })
    })
    state.activity = next
    state.activityReady = true
    scheduleRender()
""",
              'preserve reminder activity action and readiness',
          )

          one(
              """    snapshot.docs.forEach((item) => {
      if (!item.id.startsWith(INTERNAL_PREFIX)) return
      next.set(item.id, { updatedAt: Number(item.data()?.updatedAt || 0) })
    })
    state.seen = next
    scheduleRender()
""",
              """    snapshot.docs.forEach((item) => {
      if (!item.id.startsWith(INTERNAL_PREFIX)) return
      next.set(item.id, { updatedAt: Number(item.data()?.updatedAt || 0) })
    })
    pendingWrites.forEach((version, id) => {
      if (Number(version || 0) > Number(next.get(id)?.updatedAt || 0)) {
        next.set(id, { updatedAt: Number(version || 0) })
      }
    })
    state.seen = next
    state.seenReady = true
    scheduleRender()
""",
              'keep optimistic unread writes and mark seen snapshot ready',
          )

          p.write_text(text)

          # Force installed PWAs to take the new shell/router instead of stale JS.
          replace_once(
              'public/sw.js',
              "const CACHE_NAME = 'school-shell-v132'",
              "const CACHE_NAME = 'school-shell-v133'",
              'service worker cache bump',
          )

          # Remove this one-shot workflow after the patch is applied.
          Path('.github/workflows/fix-reminder-routing-unread-motion.yml').unlink()
          PY

      - name: Commit exact fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/todo-stage5.css src/unread-indicators.js public/notification-routing.js public/school-home-nav.js public/sw.js .github/workflows/fix-reminder-routing-unread-motion.yml
          git commit -m "Fix reminder motion routing and unread dots"
          git push
