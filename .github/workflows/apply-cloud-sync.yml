name: Apply cloud sync migration

on:
  push:
    paths:
      - 'scripts/apply-cloud-sync.mjs'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-cloud-sync.mjs
      - run: npm install
      - run: npm run build
      - name: Commit verified migration
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/todo.jsx public/sw.js
          git commit -m "Connect class data and student state to cloud sync"
          git push
