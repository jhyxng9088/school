name: One-off presence source migration

on:
  push:
    branches:
      - stability/presence-source-owner
    paths:
      - .github/workflows/migrate-presence-source-owner.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: stability/presence-source-owner
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Migrate presence ownership into raw source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          import { patchPresenceSplitSource } from './src/presence-split-patch.js'

          function replaceOnce(file, from, to) {
            const current = fs.readFileSync(file, 'utf8')
            const count = current.split(from).length - 1
            if (count !== 1) throw new Error(`${file}: expected one marker, found ${count}: ${from.slice(0, 100)}`)
            fs.writeFileSync(file, current.replace(from, to))
          }

          const schoolSyncPath = path.resolve('src/school-sync.js')
          const schoolSync = fs.readFileSync(schoolSyncPath, 'utf8')
          const migratedSchoolSync = patchPresenceSplitSource(schoolSync, schoolSyncPath)
          if (migratedSchoolSync === schoolSync) throw new Error('presence patch did not change raw school-sync source')
          fs.writeFileSync(
            schoolSyncPath,
            migratedSchoolSync.replace("const PRESENCE_REFRESH_MS = 15 * 1000\n", ''),
          )

          replaceOnce(
            'vite.config.js',
            "import { patchPresenceSplitSource } from './src/presence-split-patch.js'\n",
            '',
          )
          replaceOnce(
            'vite.config.js',
            '  next = patchPresenceSplitSource(next, cleanId)\n',
            '',
          )
          replaceOnce(
            'vite.config.js',
            "        || cleanId.endsWith('/presence-split-patch.js')\n",
            '',
          )

          replaceOnce(
            'tests/build-patch-effect.test.js',
            "  ['patchPresenceSplitSource', 'presence-split-patch.js'],\n",
            '',
          )
          replaceOnce(
            'tests/single-owner-architecture.test.js',
            "  'presence-split-patch.js',\n",
            '',
          )

          let presenceTest = fs.readFileSync('tests/presence-split.test.js', 'utf8')
          presenceTest = presenceTest.replace("import { patchPresenceSplitSource } from '../src/presence-split-patch.js'\n", '')
          presenceTest = presenceTest.replace(
            /\nfunction transformedSchoolSync\(\) \{[\s\S]*?\n\}\n\n/,
            '\n',
          )
          presenceTest = presenceTest.split('transformedSchoolSync()').join("read('../src/school-sync.js')")
          const oldViteTest = `test('Vite applies the presence transport patch after source-owned live-data setup', () => {\n  const vite = read('../vite.config.js')\n  const liveDataIndex = vite.indexOf('next = patchPreviewAILiveContextSource(next, cleanId)')\n  const presenceIndex = vite.indexOf('next = patchPresenceSplitSource(next, cleanId)')\n  assert.ok(liveDataIndex >= 0)\n  assert.ok(presenceIndex > liveDataIndex)\n  assert.doesNotMatch(vite, /patchDataSplitV1Source|data-split-v1-patch/)\n})\n`
          const newViteTest = `test('presence transport is raw-source-owned without a Vite build patch', () => {\n  const source = read('../src/school-sync.js')\n  const vite = read('../vite.config.js')\n  assert.match(source, /import \\{ realtimePresenceConfigured, startRealtimePresence \\} from '\\.\\/presence-rtdb\\.js'/)\n  assert.match(source, /import \\{ startSupabasePresence \\} from '\\.\\/supabase-presence\\.js'/)\n  assert.doesNotMatch(vite, /patchPresenceSplitSource|presence-split-patch/)\n  assert.equal(fs.existsSync(new URL('../src/presence-split-patch.js', import.meta.url)), false)\n})\n`
          if (!presenceTest.includes(oldViteTest)) throw new Error('presence Vite ownership test marker drifted')
          presenceTest = presenceTest.replace(oldViteTest, newViteTest)
          fs.writeFileSync('tests/presence-split.test.js', presenceTest)

          const oldStudyOrderTest = `test('study visual polish remains downstream of study data and UI transforms after recovery retirement', () => {\n  const vite = read('vite.config.js')\n  const studyUi = vite.indexOf('patchPreviewStudyUnifiedUISource(next, cleanId)')\n  const presence = vite.indexOf('patchPresenceSplitSource(next, cleanId)')\n  const visual = vite.indexOf('patchStudyVisualPolishSource(next, cleanId)')\n  assert.ok(studyUi >= 0)\n  assert.ok(presence > studyUi)\n  assert.ok(visual > presence)\n  assert.doesNotMatch(vite, /patchProductionRecoverySource/)\n  assert.doesNotMatch(vite, /production-recovery-patch\\.js/)\n})\n`
          const newStudyOrderTest = `test('study visual polish remains downstream of study UI transforms after presence source migration', () => {\n  const vite = read('vite.config.js')\n  const studyUi = vite.indexOf('patchPreviewStudyUnifiedUISource(next, cleanId)')\n  const visual = vite.indexOf('patchStudyVisualPolishSource(next, cleanId)')\n  assert.ok(studyUi >= 0)\n  assert.ok(visual > studyUi)\n  assert.doesNotMatch(vite, /patchPresenceSplitSource|presence-split-patch/)\n  assert.doesNotMatch(vite, /patchProductionRecoverySource/)\n  assert.doesNotMatch(vite, /production-recovery-patch\\.js/)\n})\n`
          replaceOnce('tests/study-visual-polish.test.js', oldStudyOrderTest, newStudyOrderTest)

          replaceOnce(
            'tests/repository-structure.test.js',
            "    'src/class-roster-ui.js',\n",
            "    'src/class-roster-ui.js',\n    'src/presence-split-patch.js',\n",
          )

          fs.rmSync('src/presence-split-patch.js')

          const textFiles = []
          function walk(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (entry.name === '.git' || entry.name === 'node_modules' || entry.name === 'dist') continue
              const full = path.join(directory, entry.name)
              if (entry.isDirectory()) walk(full)
              else if (/\.(?:js|jsx|mjs|cjs|json|md|yml|yaml)$/.test(entry.name)) textFiles.push(full)
            }
          }
          walk('.')
          const intentionalRetiredRefs = new Set([
            'tests/presence-split.test.js',
            'tests/repository-structure.test.js',
          ])
          const stale = []
          for (const file of textFiles) {
            if (file.endsWith('migrate-presence-source-owner.yml') || intentionalRetiredRefs.has(file)) continue
            const source = fs.readFileSync(file, 'utf8')
            if (/patchPresenceSplitSource|presence-split-patch/.test(source)) stale.push(file)
          }
          if (stale.length) throw new Error(`stale presence patch references remain: ${stale.join(', ')}`)
          NODE

          rm .github/workflows/migrate-presence-source-owner.yml

      - name: Install app dependencies
        run: npm ci

      - name: Test app source
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Install backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Test backend
        working-directory: push-backend-v2
        run: npm test

      - name: Check diff integrity
        run: git diff --check

      - name: Commit migrated source ownership
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "refactor: source-own presence transport"
          git push origin HEAD:stability/presence-source-owner
