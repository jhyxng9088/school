name: Verify S-Hub AI attachment intent v151

on:
  push:
    branches:
      - fix/s-hub-ai-attachment-intent-v151

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded attachment intent patch
        run: python3 .github/scripts/apply_attachment_intent_v151.py

      - name: Remove temporary verification machinery
        run: |
          rm .github/workflows/verify-s-hub-ai-attachment-intent-v151.yml
          rm .github/scripts/apply_attachment_intent_v151.py
          rmdir .github/scripts 2>/dev/null || true

      - name: Verify final repository shape and intent invariants
        run: |
          git diff --check
          test ! -e .github/workflows/verify-s-hub-ai-attachment-intent-v151.yml
          test ! -d .github/scripts
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          grep -q "askSchoolHubWithAttachments" src/s-hub-ai.js
          grep -q "classifyAttachmentTextIntent" src/s-hub-ai-sheet.jsx
          grep -q "오늘 할 것을 알려줘" tests/s-hub-ai-attachment-intent.test.js
          grep -q "primaryActionLabel" src/s-hub-ai-sheet.jsx
          grep -q "school-shell-v151" public/sw.js

      - name: Install app dependencies
        run: npm ci

      - name: Test app
        run: npm test

      - name: Build app
        run: npm run build

      - name: Install backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Test backend
        working-directory: push-backend-v2
        run: npm test

      - name: Commit verified clean tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Route attachment questions through S-Hub AI [skip ci]"
          git push origin HEAD:fix/s-hub-ai-attachment-intent-v151
