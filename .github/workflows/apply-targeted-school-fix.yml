name: Apply targeted school fix

on:
  push:
    paths:
      - '.github/workflows/apply-targeted-school-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch timetable override replacement
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/school-sync.js')
          text = path.read_text()
          old = """async function writeOverridesCloud(profile, overrides) {
            await ensureSignedIn()
            await setDoc(timetableRef(profile), {
              overrides: pruneExpiredOverrides(overrides || {}),
              updatedAt: Date.now(),
            }, { merge: true })
          }"""
          new = """async function writeOverridesCloud(profile, overrides) {
            await ensureSignedIn()
            await setDoc(timetableRef(profile), {
              overrides: pruneExpiredOverrides(overrides || {}),
              updatedAt: Date.now(),
            }, { mergeFields: ['overrides', 'updatedAt'] })
          }"""
          if text.count(old) != 1:
              raise SystemExit('Expected timetable override writer was not found exactly once')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/apply-targeted-school-fix.yml').unlink()
          PY
      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/school-sync.js .github/workflows/apply-targeted-school-fix.yml
          git commit -m "Fix timetable override rollback persistence"
          git push
