name: Hotfix Reminder Section Check

on:
  push:
    branches: [hotfix/reminder-section-quota-fallback]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm ci
      - name: Test app
        run: npm test
      - name: Build app
        run: npm run build
      - name: Install backend dependencies
        working-directory: push-backend-v2
        run: npm ci
      - name: Test backend
        working-directory: push-backend-v2
        run: npm test
