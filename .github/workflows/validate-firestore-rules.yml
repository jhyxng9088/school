name: Validate Firestore rules

on:
  push:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/validate-firestore-rules.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-school-sync "echo rules-ok"
