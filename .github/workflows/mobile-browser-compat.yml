name: Mobile browser compatibility

on:
  push:
    paths:
      - '.github/workflows/mobile-browser-compat.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply compatibility fixes
        run: |
          node <<'NODE'
          const fs = require('fs')

          function replaceOnce(text, before, after, label) {
            const count = text.split(before).length - 1
            if (count !== 1) throw new Error(`${label}: expected 1 match, got ${count}`)
            return text.replace(before, after)
          }

          function replaceRegexOnce(text, regex, after, label) {
            const matches = [...text.matchAll(new RegExp(regex.source, regex.flags.includes('g') ? regex.flags : regex.flags + 'g'))]
            if (matches.length !== 1) throw new Error(`${label}: expected 1 match, got ${matches.length}`)
            return text.replace(regex, after)
          }

          // 1) Firestore is the first-render source too: never paint stale local reminder tests.
          let todo = fs.readFileSync('src/todo.jsx', 'utf8')
          todo = replaceOnce(todo, "const TODO_STORAGE_KEY = 'school.todos.v1'\n\n", '', 'remove todo storage key')
          todo = replaceRegexOnce(
            todo,
            /function safeTodos\(value\) \{[\s\S]*?function persistTodos\(todos\) \{[\s\S]*?\n\}\n\n/,
            '',
            'remove legacy todo storage helpers',
          )
          todo = replaceRegexOnce(
            todo,
            /function initialPersonalState\(todos\) \{[\s\S]*?\n\}\n\n/,
            '',
            'remove legacy personal state initializer',
          )
          todo = replaceOnce(
            todo,
            `export function useTodos(profile) {\n  const legacyTodosRef = useRef(null)\n  if (legacyTodosRef.current === null) legacyTodosRef.current = loadTodos()\n\n  const [sharedTodos, setSharedTodos] = useState(() => legacyTodosRef.current.map(sharedTodoShape))\n  const [personalState, setPersonalState] = useState(() => initialPersonalState(legacyTodosRef.current))\n  const signature = profileSignature(profile)\n  const todos = useMemo(() => mergeSharedTodos(sharedTodos, personalState), [sharedTodos, personalState])\n\n  useEffect(() => {\n    persistTodos(todos)\n  }, [todos])`,
            `export function useTodos(profile) {\n  const [sharedTodos, setSharedTodos] = useState([])\n  const [personalState, setPersonalState] = useState({})\n  const signature = profileSignature(profile)\n  const todos = useMemo(() => mergeSharedTodos(sharedTodos, personalState), [sharedTodos, personalState])\n\n  useEffect(() => {\n    try { localStorage.removeItem('school.todos.v1') } catch { /* stale cache cleanup is best-effort */ }\n  }, [])`,
            'make reminder first render cloud authoritative',
          )
          fs.writeFileSync('src/todo.jsx', todo)

          // 2) Keep the iPad spring. iPhone/Android/Samsung use compositor-native CSS movement.
          let main = fs.readFileSync('src/main.jsx', 'utf8')
          main = replaceOnce(
            main,
            "const USER_NAME_KEY = 'school.userName'\n",
            "const USER_NAME_KEY = 'school.userName'\nconst MOBILE_BROWSER_COMPAT = /iPhone|iPod|Android|SamsungBrowser/i.test(navigator.userAgent)\nif (MOBILE_BROWSER_COMPAT) document.documentElement.classList.add('school-mobile-compat')\n",
            'insert mobile browser compatibility flag',
          )
          main = replaceOnce(
            main,
            "    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches\n",
            "    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches\n    const compatibilityMotion = MOBILE_BROWSER_COMPAT\n    const compatibilityTransition = 'transform 420ms cubic-bezier(0.16, 1, 0.3, 1), width 420ms cubic-bezier(0.16, 1, 0.3, 1), border-radius 420ms cubic-bezier(0.16, 1, 0.3, 1)'\n",
            'prepare compatibility nav motion',
          )
          main = replaceOnce(
            main,
            `    stopAnimation()\n    measure(!physics.initialized)\n\n    if (!reduceMotion && Math.abs(physics.x - physics.targetX) > 0.01) {\n      physics.lastTime = 0\n      physics.frame = requestAnimationFrame(animate)\n    }\n\n    const handleViewportChange = () => {\n      stopAnimation()\n      physics.lastTime = 0\n      measure(true)\n    }\n\n    window.addEventListener('resize', handleViewportChange)\n    window.addEventListener('orientationchange', handleViewportChange)\n\n    return () => {\n      stopAnimation()\n      window.removeEventListener('resize', handleViewportChange)\n      window.removeEventListener('orientationchange', handleViewportChange)\n    }`,
            `    stopAnimation()\n    const wasInitialized = physics.initialized\n    measure(!physics.initialized)\n\n    if (compatibilityMotion) {\n      indicator.style.transition = reduceMotion || !wasInitialized ? 'none' : compatibilityTransition\n      physics.x = physics.targetX\n      physics.velocity = 0\n      physics.lastTime = 0\n      paint()\n      if (!reduceMotion && !wasInitialized) {\n        requestAnimationFrame(() => {\n          if (indicator.isConnected) indicator.style.transition = compatibilityTransition\n        })\n      }\n    } else if (!reduceMotion && Math.abs(physics.x - physics.targetX) > 0.01) {\n      physics.lastTime = 0\n      physics.frame = requestAnimationFrame(animate)\n    }\n\n    const handleViewportChange = () => {\n      stopAnimation()\n      physics.lastTime = 0\n      if (compatibilityMotion) indicator.style.transition = 'none'\n      measure(true)\n      if (compatibilityMotion && !reduceMotion) {\n        requestAnimationFrame(() => {\n          if (indicator.isConnected) indicator.style.transition = compatibilityTransition\n        })\n      }\n    }\n\n    window.addEventListener('resize', handleViewportChange)\n    window.addEventListener('orientationchange', handleViewportChange)\n    window.visualViewport?.addEventListener('resize', handleViewportChange)\n\n    return () => {\n      stopAnimation()\n      window.removeEventListener('resize', handleViewportChange)\n      window.removeEventListener('orientationchange', handleViewportChange)\n      window.visualViewport?.removeEventListener('resize', handleViewportChange)\n    }`,
            'replace mobile nav spring with compositor transition',
          )
          fs.writeFileSync('src/main.jsx', main)

          // 3) Browser-specific bottom-sheet viewport/scroll locking.
          let sheet = fs.readFileSync('public/school-sheet.js', 'utf8')
          sheet = replaceOnce(
            sheet,
            "  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)')\n",
            "  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)')\n  const androidBrowser = /Android|SamsungBrowser/i.test(navigator.userAgent)\n",
            'detect android sheet behavior',
          )
          sheet = replaceOnce(
            sheet,
            `  function lockBackground() {\n    const body = document.body\n    const scrollY = window.scrollY || document.documentElement.scrollTop || 0\n    body.dataset.schoolSheetScrollY = String(scrollY)\n    body.style.position = 'fixed'\n    body.style.top = \`-\${scrollY}px\`\n    body.style.left = '0'\n    body.style.right = '0'\n    body.style.width = '100%'\n    body.style.overflow = 'hidden'\n  }\n\n  function unlockBackground() {\n    const body = document.body\n    const scrollY = Number(body.dataset.schoolSheetScrollY || 0)\n    body.style.position = ''\n    body.style.top = ''\n    body.style.left = ''\n    body.style.right = ''\n    body.style.width = ''\n    body.style.overflow = ''\n    delete body.dataset.schoolSheetScrollY\n    window.scrollTo(0, scrollY)\n  }`,
            `  function lockBackground() {\n    const body = document.body\n    const scrollY = window.scrollY || document.documentElement.scrollTop || 0\n    body.dataset.schoolSheetScrollY = String(scrollY)\n\n    if (androidBrowser) {\n      body.dataset.schoolSheetLockMode = 'overflow'\n      document.documentElement.style.overflow = 'hidden'\n      body.style.overflow = 'hidden'\n      body.style.overscrollBehavior = 'none'\n      return\n    }\n\n    body.dataset.schoolSheetLockMode = 'fixed'\n    body.style.position = 'fixed'\n    body.style.top = \`-\${scrollY}px\`\n    body.style.left = '0'\n    body.style.right = '0'\n    body.style.width = '100%'\n    body.style.overflow = 'hidden'\n  }\n\n  function unlockBackground() {\n    const body = document.body\n    const scrollY = Number(body.dataset.schoolSheetScrollY || 0)\n    const lockMode = body.dataset.schoolSheetLockMode\n\n    if (lockMode === 'overflow') {\n      document.documentElement.style.overflow = ''\n      body.style.overflow = ''\n      body.style.overscrollBehavior = ''\n    } else {\n      body.style.position = ''\n      body.style.top = ''\n      body.style.left = ''\n      body.style.right = ''\n      body.style.width = ''\n      body.style.overflow = ''\n      window.scrollTo(0, scrollY)\n    }\n\n    delete body.dataset.schoolSheetScrollY\n    delete body.dataset.schoolSheetLockMode\n  }`,
            'use browser-safe sheet background lock',
          )
          sheet = replaceOnce(
            sheet,
            "      return Math.max(sheet.offsetHeight + 24, window.innerHeight * 0.42)\n",
            "      const viewportHeight = window.visualViewport?.height || window.innerHeight\n      return Math.max(sheet.offsetHeight + 24, viewportHeight * 0.42)\n",
            'use visual viewport for sheet travel',
          )
          fs.writeFileSync('public/school-sheet.js', sheet)

          // 4) Same design, shorter engine-sensitive staging on phone browsers only.
          let motion = fs.readFileSync('src/motion.css', 'utf8')
          const compatMotionCss = `\n\n/* iPhone/Android browser compatibility: preserve the motion language while letting the browser compositor own the timing. */\nhtml.school-mobile-compat .app-content {\n  animation-duration: 760ms;\n}\n\nhtml.school-mobile-compat .home-stack > * {\n  animation-duration: 820ms;\n}\n\nhtml.school-mobile-compat .nav-button {\n  transition: color 460ms cubic-bezier(0.16, 1, 0.3, 1), transform 280ms cubic-bezier(0.16, 1, 0.3, 1);\n}\n`
          if (motion.includes('iPhone/Android browser compatibility')) throw new Error('motion compatibility css already exists')
          motion += compatMotionCss
          fs.writeFileSync('src/motion.css', motion)

          let pageMotion = fs.readFileSync('public/school-page-motion.css', 'utf8')
          const pageCompatCss = `\n\n/* Mobile WebKit / Samsung Internet timing compatibility. iPad keeps the original slower staging. */\nhtml.school-mobile-compat .app-content > .page-header,\nhtml.school-mobile-compat .app-content > .empty-panel,\nhtml.school-mobile-compat .todo-page.is-page-entering > .todo-header,\nhtml.school-mobile-compat .todo-page.is-page-entering > .todo-summary,\nhtml.school-mobile-compat .todo-page.is-page-entering > .todo-list-section,\nhtml.school-mobile-compat .timetable-page > .timetable-header,\nhtml.school-mobile-compat .timetable-page > .week-summary,\nhtml.school-mobile-compat .timetable-page > .week-table-wrap,\nhtml.school-mobile-compat .timetable-page > .editor-actions,\nhtml.school-mobile-compat .timetable-page > .week-changes,\nhtml.school-mobile-compat .stage3-page > .stage3-page-header,\nhtml.school-mobile-compat .meal-page > .stage3-week-nav,\nhtml.school-mobile-compat .meal-page > .stage3-day-strip,\nhtml.school-mobile-compat .meal-page > .stage3-detail,\nhtml.school-mobile-compat .academic-page > .academic-focus-card,\nhtml.school-mobile-compat .academic-page > .academic-list-head {\n  animation-duration: 760ms;\n}\n\nhtml.school-mobile-compat .timetable-actions > button,\nhtml.school-mobile-compat .stage3-day-strip > .stage3-day-button,\nhtml.school-mobile-compat .academic-list > .academic-list-item,\nhtml.school-mobile-compat .change-list > .change-item {\n  animation-duration: 700ms;\n}\n`
          if (pageMotion.includes('Mobile WebKit / Samsung Internet timing compatibility')) throw new Error('page compatibility css already exists')
          pageMotion += pageCompatCss
          fs.writeFileSync('public/school-page-motion.css', pageMotion)

          // Hard guards.
          const verifyTodo = fs.readFileSync('src/todo.jsx', 'utf8')
          const verifyMain = fs.readFileSync('src/main.jsx', 'utf8')
          const verifySheet = fs.readFileSync('public/school-sheet.js', 'utf8')
          if (verifyTodo.includes('loadTodos()') || verifyTodo.includes('persistTodos(')) throw new Error('stale reminder local storage still active')
          if (!verifyTodo.includes("localStorage.removeItem('school.todos.v1')")) throw new Error('stale reminder cache cleanup missing')
          if (!verifyMain.includes('MOBILE_BROWSER_COMPAT')) throw new Error('mobile compatibility flag missing')
          if (!verifyMain.includes("window.visualViewport?.addEventListener('resize'")) throw new Error('visual viewport nav listener missing')
          if (!verifySheet.includes("body.dataset.schoolSheetLockMode = 'overflow'")) throw new Error('android sheet lock fallback missing')
          if (!verifySheet.includes('window.visualViewport?.height || window.innerHeight')) throw new Error('visual viewport sheet sizing missing')
          NODE
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/todo.jsx src/main.jsx src/motion.css public/school-sheet.js public/school-page-motion.css
          git diff --cached --quiet && exit 0
          git commit -m "Improve iPhone and Samsung browser compatibility"
          git push
