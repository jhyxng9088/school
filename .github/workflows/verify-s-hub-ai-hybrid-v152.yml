name: Verify S-Hub AI hybrid attachment v152

on:
  push:
    branches:
      - fix/s-hub-ai-hybrid-v152

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded hybrid attachment patch
        run: python3 tools/apply_s_hub_hybrid_attachment.py

      - name: Remove temporary verification machinery
        run: |
          rm .github/workflows/verify-s-hub-ai-hybrid-v152.yml
          rm tools/apply_s_hub_hybrid_attachment.py
          rmdir tools || true

      - name: Verify final repository shape and hybrid invariants
        run: |
          git diff --check
          test ! -e .github/workflows/verify-s-hub-ai-hybrid-v152.yml
          test ! -e tools/apply_s_hub_hybrid_attachment.py
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          grep -q "ATTACHMENT_HYBRID_SCHEMA" src/s-hub-ai.js
          grep -q "answerAndAnalyzeSchoolAttachments" src/s-hub-ai.js
          grep -q "answerAndAnalyzeSchoolAttachments" src/s-hub-ai-sheet.jsx
          grep -q "추가할 수 있는 항목" src/s-hub-ai-sheet.jsx
          grep -q "school-shell-v152" public/sw.js

      - name: Install app dependencies
        run: npm ci

      - name: Test app
        run: npm test

      - name: Build app
        run: npm run build

      - name: Install backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Test backend
        working-directory: push-backend-v2
        run: npm test

      - name: Commit verified clean tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Keep S-Hub answers and import suggestions together [skip ci]"
          git push origin HEAD:fix/s-hub-ai-hybrid-v152
