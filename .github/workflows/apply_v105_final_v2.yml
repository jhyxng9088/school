name: Apply final v105 timetable and AI patch v2

on:
  push:
    paths:
      - '.github/workflows/apply_v105_final_v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix patch marker
        run: python3 .github/scripts/fix_v105_final_script.py
      - name: Apply guarded v105 patch
        run: python3 .github/scripts/apply_v105_final.py
      - name: Verify diff
        run: git diff --check
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Verify required markers
        run: |
          grep -q "timetable-control-shell" src/main.jsx
          grep -q "title={showTomorrowTimetable ? '내일 시간표' : '오늘 시간표'}" src/main.jsx
          grep -q "MODEL_BACKOFF_MS" src/firebase-ai-direct.js
          grep -q "markModelQuotaFailure" src/firebase-ai-direct.js
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/timetable.css src/firebase-ai-direct.js
          git commit -m "Fix timetable controls and adaptive AI recovery" || exit 0
          git push
