name: Verify S-Hub AI working stage v149

on:
  push:
    branches:
      - fix/s-hub-ai-working-stage-v149

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded working-stage refinement
        run: |
          python3 .github/scripts/refine_s_hub_ai_working_v149.py
          python3 .github/scripts/refine_s_hub_ai_result_transition_v149.py
          python3 .github/scripts/align_s_hub_ai_working_test_v149.py

      - name: Remove temporary verification machinery
        run: |
          rm .github/workflows/verify-s-hub-ai-working-v149.yml
          rm .github/scripts/refine_s_hub_ai_working_v149.py
          rm .github/scripts/refine_s_hub_ai_result_transition_v149.py
          rm .github/scripts/align_s_hub_ai_working_test_v149.py
          rmdir .github/scripts 2>/dev/null || true

      - name: Verify final repository shape and working UI invariants
        run: |
          git diff --check
          test ! -e .github/workflows/verify-s-hub-ai-working-v149.yml
          test ! -d .github/scripts
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          grep -q "<SHubAIOrb size={48} active" src/s-hub-ai-sheet.jsx
          grep -q "사진을 분석하는 중" src/s-hub-ai-sheet.jsx
          grep -q "파일을 분석하는 중" src/s-hub-ai-sheet.jsx
          grep -q "기존 일정과 겹치는지 확인하는 중" src/s-hub-ai-sheet.jsx
          grep -q "finishWorkingStage" src/s-hub-ai-sheet.jsx
          grep -q "s-hub-ai-result-reveal" src/s-hub-ai.css
          grep -q "school-shell-v149" public/sw.js

      - name: Install app dependencies
        run: npm ci

      - name: Test app
        run: npm test

      - name: Build app
        run: npm run build

      - name: Install backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Test backend
        working-directory: push-backend-v2
        run: npm test

      - name: Commit verified clean tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refine S-Hub AI working stage and result handoff [skip ci]"
          git push origin HEAD:fix/s-hub-ai-working-stage-v149
