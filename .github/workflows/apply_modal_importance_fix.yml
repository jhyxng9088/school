name: Apply modal and academic importance fix

on:
  push:
    paths:
      - '.github/workflows/apply_modal_importance_fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded modal patch
        run: python3 .github/scripts/apply_modal_importance_fix.py
      - name: Finalize compatible academic storage
        run: python3 .github/scripts/finalize_academic_importance_storage.py
      - name: Verify diff
        run: git diff --check
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Commit verified fix
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/unified-sheet.jsx src/academic-shared.jsx src/academic-shared.css src/class-activity.js
          git commit -m "Fix unified sheet gestures and add important academic events"
          git push
