name: Migrate shared segment owner

on:
  push:
    branches:
      - work/shared-segment-owner-retire-20260906

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: work/shared-segment-owner-retire-20260906
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate shared segment ownership upstream
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          class_path = Path('src/preview-class-top-segment-patch.js')
          class_source = class_path.read_text()
          physics_start = 'export const PREVIEW_CLASS_SEGMENT_PHYSICS = Object.freeze({'
          physics_end = '})\n\nconst CLASS_TOP_SEGMENT_CSS'
          start = class_source.find(physics_start)
          end = class_source.find(physics_end, start)
          if start != 0 or end < 0:
              raise SystemExit('class physics block boundary missing')
          end += len('})\n\n')
          class_source = (
              "import { S_HUB_SEGMENT_SPRING_PHYSICS } from './s-hub-segment-spring.js'\n\n"
              "export const PREVIEW_CLASS_SEGMENT_PHYSICS = S_HUB_SEGMENT_SPRING_PHYSICS\n\n"
              + class_source[end:]
          )

          class_runtime_start = 'function useClassTopSegmentSpring(activeIndex) {'
          class_runtime_end = 'function ClassTopSegment({ section, onSectionChange }) {'
          start = class_source.find(class_runtime_start)
          end = class_source.find(class_runtime_end, start)
          if start < 0 or end < 0:
              raise SystemExit('class spring runtime boundary missing')
          class_wrapper = """function useClassTopSegmentSpring(activeIndex) {
  return useSHubSegmentSpring(activeIndex, {
    paddingProperty: '--segment-padding',
    shellScaleProperty: '--segment-shell-scale-x',
    shellShiftProperty: '--segment-shell-shift-x',
    fallbackPadding: 5,
  })
}

"""
          class_source = class_source[:start] + class_wrapper + class_source[end:]
          class_source = replace_once(
              class_source,
              "          key={item.id}\n          type=\"button\"\n          className={'class-top-segment-button ' + (section === item.id ? 'is-active' : '')}",
              "          key={item.id}\n          type=\"button\"\n          data-unread-key={item.id}\n          className={'class-top-segment-button ' + (section === item.id ? 'is-active' : '')}",
              'class unread semantic key',
          )
          class_source = replace_once(
              class_source,
              "function patchMainSource(source) {\n  let next = String(source || '')\n\n",
              "function patchMainSource(source) {\n  let next = String(source || '')\n  const sharedSpringImport = \"import { useSHubSegmentSpring } from './s-hub-segment-spring.js'\\n\"\n  if (!next.includes(sharedSpringImport)) {\n    if (!next.startsWith('import React')) throw new Error('Preview class top segment marker missing: React import')\n    const lineEnd = next.indexOf('\\n')\n    if (lineEnd < 0) throw new Error('Preview class top segment marker missing: React import line')\n    next = `${next.slice(0, lineEnd + 1)}${sharedSpringImport}${next.slice(lineEnd + 1)}`\n  }\n\n",
              'class shared spring import ownership',
          )
          class_path.write_text(class_source)

          study_path = Path('src/preview-study-patch.js')
          study_source = study_path.read_text()
          study_source = replace_once(
              study_source,
              "import { PREVIEW_CLASS_SEGMENT_PHYSICS } from './preview-class-top-segment-patch.js'\n\n",
              '',
              'study duplicate physics import',
          )
          runtime_start = 'const STUDY_RANKING_SPRING_RUNTIME = String.raw`\n'
          runtime_end = 'const STUDY_RANKING_SPRING_CSS = String.raw`'
          start = study_source.find(runtime_start)
          end = study_source.find(runtime_end, start)
          if start < 0 or end < 0:
              raise SystemExit('study spring runtime boundary missing')
          study_runtime = """const STUDY_RANKING_SPRING_RUNTIME = String.raw`
function useStudyRankingScopeSpring(activeIndex) {
  return useSHubSegmentSpring(activeIndex, {
    paddingProperty: '--study-ranking-padding',
    shellScaleProperty: '--study-ranking-shell-scale-x',
    shellShiftProperty: '--study-ranking-shell-shift-x',
    fallbackPadding: 4,
  })
}

`

"""
          study_source = study_source[:start] + study_runtime + study_source[end:]
          study_source = replace_once(
              study_source,
              "  next = replaceRequired(\n    next,\n    \"import React, { useCallback, useEffect, useMemo, useRef, useState } from 'react'\",\n    \"import React, { useCallback, useEffect, useLayoutEffect, useMemo, useRef, useState } from 'react'\",\n    'study ranking layout effect import',\n  )",
              "  next = replaceRequired(\n    next,\n    \"import React, { useCallback, useEffect, useMemo, useRef, useState } from 'react'\",\n    \"import React, { useCallback, useEffect, useMemo, useRef, useState } from 'react'\\nimport { useSHubSegmentSpring } from './s-hub-segment-spring.js'\",\n    'study ranking shared spring import',\n  )",
              'study shared spring import ownership',
          )
          study_path.write_text(study_source)

          vite_path = Path('vite.config.js')
          vite = vite_path.read_text()
          vite = replace_once(
              vite,
              "import { patchSharedSegmentSpringOwnerSource } from './src/shared-segment-spring-owner-patch.js'\n",
              '',
              'vite shared segment owner import',
          )
          vite = replace_once(
              vite,
              '  next = patchSharedSegmentSpringOwnerSource(next, cleanId)\n',
              '',
              'vite shared segment owner call',
          )
          vite = replace_once(
              vite,
              "        || cleanId.endsWith('/shared-segment-spring-owner-patch.js')\n",
              '',
              'vite shared segment owner polite exclusion',
          )
          vite_path.write_text(vite)

          shared_test = '''import fs from 'node:fs'\nimport test from 'node:test'\nimport assert from 'node:assert/strict'\nimport { PREVIEW_CLASS_SEGMENT_PHYSICS } from '../src/preview-class-top-segment-patch.js'\nimport { S_HUB_SEGMENT_SPRING_PHYSICS } from '../src/s-hub-segment-spring.js'\nimport { patchPreviewStudySource } from '../src/preview-study-patch.js'\n\nconst read = (path) => fs.readFileSync(new URL(`../${path}`, import.meta.url), 'utf8')\n\ntest('preview segment generators share the canonical spring physics object', () => {\n  assert.equal(PREVIEW_CLASS_SEGMENT_PHYSICS, S_HUB_SEGMENT_SPRING_PHYSICS)\n})\n\ntest('class segment generator owns the shared spring wrapper and unread semantic key directly', () => {\n  const source = read('src/preview-class-top-segment-patch.js')\n  assert.match(source, /import \\{ S_HUB_SEGMENT_SPRING_PHYSICS \\} from '\\.\\/s-hub-segment-spring\\.js'/)\n  assert.match(source, /return useSHubSegmentSpring\\(activeIndex, \\{/)\n  assert.match(source, /paddingProperty: '--segment-padding'/)\n  assert.match(source, /data-unread-key=\\{item\\.id\\}/)\n  assert.doesNotMatch(source, /physics\\.velocity \\+= acceleration \\* dt/)\n})\n\ntest('study generator emits the same shared spring wrapper without a duplicate physics runtime', () => {\n  const page = patchPreviewStudySource(read('src/preview-study.jsx'), '/workspace/src/preview-study.jsx')\n  assert.match(page, /import \\{ useSHubSegmentSpring \\} from '\\.\\/s-hub-segment-spring\\.js'/)\n  assert.match(page, /function useStudyRankingScopeSpring\\(activeIndex\\) \\{\\n  return useSHubSegmentSpring/)\n  assert.match(page, /paddingProperty: '--study-ranking-padding'/)\n  assert.match(page, /fallbackPadding: 4/)\n  assert.doesNotMatch(page, /const springForce =/)\n  assert.doesNotMatch(page, /physics\\.velocity \\+=/)\n})\n\ntest('schedule continues to reuse the class segment spring wrapper', () => {\n  const schedulePatch = read('src/preview-schedule-top-segment-patch.js')\n  assert.match(schedulePatch, /const spring = useClassTopSegmentSpring\\(activeIndex\\)/)\n  assert.doesNotMatch(schedulePatch, /function useScheduleTopSegmentSpring/)\n})\n\ntest('late shared segment build owner is fully retired from Vite', () => {\n  const vite = read('vite.config.js')\n  assert.doesNotMatch(vite, /patchSharedSegmentSpringOwnerSource/)\n  assert.doesNotMatch(vite, /shared-segment-spring-owner-patch\\.js/)\n  assert.equal(fs.existsSync(new URL('../src/shared-segment-spring-owner-patch.js', import.meta.url)), false)\n})\n'''
          Path('tests/shared-segment-spring-owner.test.js').write_text(shared_test)

          class_test_path = Path('tests/preview-class-top-segment.test.js')
          class_test = class_test_path.read_text()
          old_class_test = '''test('top segment uses the same canonical spring law as the bottom nav', () => {\n  assert.deepEqual(PREVIEW_CLASS_SEGMENT_PHYSICS, {\n    stiffness: 56,\n    damping: 10.5,\n    mass: 1,\n    maxDt: 0.032,\n    stretchPerVelocity: 0.032,\n    maxStretch: 18,\n    compressionVelocity: 18000,\n    maxCompression: 0.028,\n    radiusShrinkPerStretch: 0.08,\n    settleDistancePx: 0.06,\n    settleVelocityPx: 0.06,\n  })\n  const source = buildFinalMain()\n  assert.match(source, /physics\\.velocity \\+= acceleration \\* dt/)\n  assert.match(source, /physics\\.x \\+= physics\\.velocity \\* dt/)\n  assert.match(source, /const visualX = movingLeft \\? physics\\.x - stretch : physics\\.x/)\n})'''
          new_class_test = '''test('top segment emits the canonical shared spring wrapper directly', () => {\n  assert.deepEqual(PREVIEW_CLASS_SEGMENT_PHYSICS, {\n    stiffness: 56,\n    damping: 10.5,\n    mass: 1,\n    maxDt: 0.032,\n    stretchPerVelocity: 0.032,\n    maxStretch: 18,\n    compressionVelocity: 18000,\n    maxCompression: 0.028,\n    radiusShrinkPerStretch: 0.08,\n    settleDistancePx: 0.06,\n    settleVelocityPx: 0.06,\n  })\n  const source = buildFinalMain()\n  assert.match(source, /import \\{ useSHubSegmentSpring \\} from '\\.\\/s-hub-segment-spring\\.js'/)\n  assert.match(source, /function useClassTopSegmentSpring\\(activeIndex\\) \\{\\n  return useSHubSegmentSpring/)\n  assert.match(source, /paddingProperty: '--segment-padding'/)\n  assert.match(source, /data-unread-key=\\{item\\.id\\}/)\n  assert.doesNotMatch(source, /physics\\.velocity \\+= acceleration \\* dt/)\n})'''
          class_test = replace_once(class_test, old_class_test, new_class_test, 'class shared spring test')
          class_test_path.write_text(class_test)

          study_test_path = Path('tests/preview-study-ranking-motion.test.js')
          study_test = study_test_path.read_text()
          study_test = replace_once(
              study_test,
              "import { PREVIEW_CLASS_SEGMENT_PHYSICS } from '../src/preview-class-top-segment-patch.js'\n",
              '',
              'study motion duplicate physics test import',
          )
          old_study_test = '''test('study ranking reuses the class top-segment spring constants and stretch law', () => {\n  const page = patchPreviewStudySource(read('src/preview-study.jsx'), '/workspace/src/preview-study.jsx')\n\n  assert.match(page, /function useStudyRankingScopeSpring\\(activeIndex\\)/)\n  assert.match(page, /useLayoutEffect/)\n  assert.match(page, new RegExp(`const springForce = -${PREVIEW_CLASS_SEGMENT_PHYSICS.stiffness} \\\\* displacement`))\n  assert.match(page, new RegExp(`const dampingForce = -${PREVIEW_CLASS_SEGMENT_PHYSICS.damping} \\\\* physics\\\\.velocity`))\n  assert.match(page, new RegExp(`speed \\\\* ${PREVIEW_CLASS_SEGMENT_PHYSICS.stretchPerVelocity}, ${PREVIEW_CLASS_SEGMENT_PHYSICS.maxStretch}`))\n  assert.match(page, /const visualX = movingLeft \\? physics\\.x - stretch : physics\\.x/)\n  assert.match(page, /--study-ranking-shell-scale-x/)\n  assert.match(page, /--study-ranking-shell-shift-x/)\n})'''
          new_study_test = '''test('study ranking emits the canonical shared segment spring wrapper directly', () => {\n  const page = patchPreviewStudySource(read('src/preview-study.jsx'), '/workspace/src/preview-study.jsx')\n\n  assert.match(page, /import \\{ useSHubSegmentSpring \\} from '\\.\\/s-hub-segment-spring\\.js'/)\n  assert.match(page, /function useStudyRankingScopeSpring\\(activeIndex\\) \\{\\n  return useSHubSegmentSpring/)\n  assert.match(page, /paddingProperty: '--study-ranking-padding'/)\n  assert.match(page, /shellScaleProperty: '--study-ranking-shell-scale-x'/)\n  assert.match(page, /shellShiftProperty: '--study-ranking-shell-shift-x'/)\n  assert.match(page, /fallbackPadding: 4/)\n  assert.doesNotMatch(page, /const springForce =/)\n  assert.doesNotMatch(page, /physics\\.velocity \\+=/)\n})'''
          study_test = replace_once(study_test, old_study_test, new_study_test, 'study shared spring motion test')
          study_test_path.write_text(study_test)

          final_test_path = Path('tests/final-runtime-owner.test.js')
          final_test = final_test_path.read_text()
          final_test = replace_once(
              final_test,
              "test('retired runtime cleanup and shared icon build owners stay out of the patch chain', () => {",
              "test('retired runtime cleanup, icon, and segment spring build owners stay out of the patch chain', () => {",
              'final runtime owner test title',
          )
          final_test = replace_once(
              final_test,
              "  assert.equal(exists('src/shared-icon-owner-patch.js'), false)\n  assert.match(main, /import \\{ SHubIcon \\} from '\\.\\/s-hub-icon\\.jsx'/)\n  assert.match(main, /return <SHubIcon name=\\{type\\} size=\\{size\\} \\/>/)\n  assert.equal((vite.match(/patchSharedSegmentSpringOwnerSource\\(next, cleanId\\)/g) || []).length, 1)\n  assert.doesNotMatch(vite, /patchSharedIconOwnerSource/)",
              "  assert.equal(exists('src/shared-icon-owner-patch.js'), false)\n  assert.equal(exists('src/shared-segment-spring-owner-patch.js'), false)\n  assert.match(main, /import \\{ SHubIcon \\} from '\\.\\/s-hub-icon\\.jsx'/)\n  assert.match(main, /return <SHubIcon name=\\{type\\} size=\\{size\\} \\/>/)\n  assert.doesNotMatch(vite, /patchSharedSegmentSpringOwnerSource/)\n  assert.doesNotMatch(vite, /shared-segment-spring-owner-patch\\.js/)\n  assert.doesNotMatch(vite, /patchSharedIconOwnerSource/)",
              'final runtime shared segment retirement contract',
          )
          final_test_path.write_text(final_test)
          PY

          git rm src/shared-segment-spring-owner-patch.js
          git rm .github/workflows/migrate-shared-segment-owner.yml

          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/migrate-shared-segment-owner.yml',
              'src/preview-class-top-segment-patch.js',
              'src/preview-study-patch.js',
              'src/shared-segment-spring-owner-patch.js',
              'tests/final-runtime-owner.test.js',
              'tests/preview-class-top-segment.test.js',
              'tests/preview-study-ranking-motion.test.js',
              'tests/shared-segment-spring-owner.test.js',
              'vite.config.js',
          }
          changed = set(subprocess.check_output(['git', 'diff', 'HEAD', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected migration paths: {sorted(changed)}')
          PY

          git diff --check

      - name: Test production app
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Commit clean migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: retire shared segment spring build owner'
          git push origin HEAD:work/shared-segment-owner-retire-20260906
