name: Fix moving timetable scope

on:
  push:
    paths:
      - .github/workflows/fix-moving-timetable-scope.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scope safety patch
        run: python .github/scripts/fix-moving-timetable-scope.py
      - name: Remove one-time patch files
        run: |
          rm .github/workflows/fix-moving-timetable-scope.yml
          rm .github/scripts/fix-moving-timetable-scope.py
          rmdir .github/scripts
      - name: Validate app
        run: |
          npm ci
          npm test
          npm run build
      - name: Validate backend
        working-directory: push-backend-v2
        run: |
          npm ci
          npm test
          node --check api/personal-timetable.js
      - name: Commit validated scope fix
        run: |
          git config user.name jhyxng9088
          git config user.email j.hyxng9088@gmail.com
          git add -A src/main.jsx .github/workflows/fix-moving-timetable-scope.yml .github/scripts
          git diff --cached --check
          git commit -m 'Keep moving-class timetable scopes isolated'
          git push
