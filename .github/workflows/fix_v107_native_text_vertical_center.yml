name: Fix v107 native control text centering

on:
  push:
    paths:
      - '.github/workflows/fix_v107_native_text_vertical_center.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patch
        run: python3 .github/scripts/fix_v107_native_text_vertical_center.py
      - name: Verify diff
        run: git diff --check
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Verify required markers
        run: |
          grep -F '::-webkit-date-and-time-value' src/todo.css
          grep -F '::-webkit-datetime-edit-fields-wrapper' src/timetable.css
          grep -F 'align-items: center !important;' src/todo.css
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/todo.css src/timetable.css
          git commit -m "Center native date and time text on iPad" || exit 0
          git push
