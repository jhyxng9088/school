name: Fix v106 native date time controls

on:
  push:
    paths:
      - '.github/workflows/fix_v106_native_date_time_controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patch
        run: python3 .github/scripts/fix_v106_native_date_time_controls.py
      - name: Verify diff
        run: git diff --check
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Verify required markers
        run: |
          grep -q "todo-control-shell todo-date-shell" src/todo-stage5-ai.jsx
          grep -q "todo-control-shell todo-time-shell" src/todo-stage5-ai.jsx
          grep -q "webkit-date-and-time-value" src/timetable.css
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/todo-stage5-ai.jsx src/todo.css src/timetable.css
          git commit -m "Fix reminder date time controls and timetable date centering" || exit 0
          git push
