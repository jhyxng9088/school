name: Fix timetable override sync

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-timetable-override-sync.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused timetable override repair
        run: python .github/scripts/fix-timetable-override-sync.py
      - name: Remove one-time repair files before validation
        run: |
          rm .github/workflows/fix-timetable-override-sync.yml
          rm .github/scripts/fix-timetable-override-sync.py
          rmdir .github/scripts 2>/dev/null || true
      - name: Validate focused invariants
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const sync = fs.readFileSync('src/school-sync.js', 'utf8')
          const main = fs.readFileSync('src/main.jsx', 'utf8')
          const must = (ok, message) => { if (!ok) throw new Error(message) }
          must(sync.includes('refreshSharedTimetable'), 'missing shared refresh')
          must(sync.includes('refreshPersonalTimetable'), 'missing personal refresh')
          must(sync.includes("setPersonalOverrides(pruneExpiredOverrides(normalizeOverrides(data?.overrides || normalized), now))"), 'personal override server response not applied')
          must(!sync.includes('if (stopped || snapshot.metadata?.fromCache) return'), 'shared timetable still drops cached snapshot')
          must(main.includes('mergeVisibleTimetableOverrides(sharedOverrides, personalOverrides, now)'), 'moving-class display merge missing')
          must(main.includes('<span>공동 임시</span><small>날짜별 변경</small>'), 'shared temporary label missing')
          must(main.includes('<span>개인 임시</span><small>날짜별 변경</small>'), 'personal temporary label missing')
          NODE
      - name: Install and validate app
        run: |
          npm ci
          npm test
          npm run build
      - name: Validate reminder backend
        run: |
          cd push-backend-v2
          npm ci
          npm test
      - name: Commit validated repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Repair moving timetable temporary overrides'
          git push origin main
