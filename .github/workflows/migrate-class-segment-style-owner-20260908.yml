name: Migrate class segment style owner 20260908

on:
  push:
    branches:
      - work/class-segment-style-owner-retire-20260908

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: work/class-segment-style-owner-retire-20260908
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate class segment style ownership upstream
        run: python scripts/migrate-class-segment-style-owner-20260908.py

      - name: Remove retired and temporary owners
        shell: bash
        run: |
          git rm src/preview-class-top-segment-style-patch.js
          git rm scripts/migrate-class-segment-style-owner-20260908.py
          git rm .github/workflows/migrate-class-segment-style-owner-20260908.yml
          python - <<'PY'
          import subprocess
          expected = {
            '.github/workflows/migrate-class-segment-style-owner-20260908.yml',
            'scripts/migrate-class-segment-style-owner-20260908.py',
            'src/preview-class-top-segment-patch.js',
            'src/preview-class-top-segment-style-patch.js',
            'tests/build-patch-effect.test.js',
            'tests/final-runtime-owner.test.js',
            'tests/preview-board.test.js',
            'tests/preview-class-top-segment-style.test.js',
            'tests/preview-class-top-segment.test.js',
            'tests/preview-schedule-top-segment.test.js',
            'vite.config.js',
          }
          changed = set(subprocess.check_output(['git', 'diff', 'HEAD', '--name-only'], text=True).splitlines())
          assert changed == expected, f'unexpected migration paths: {sorted(changed)}'
          PY
          git diff --check

      - name: Test production app
        id: app_tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee migration-test.log
          status=${PIPESTATUS[0]}
          grep -E "(^not ok|^# Subtest:|AssertionError|ERR_ASSERTION|actual:|expected:|operator:|tests? failed|fail [0-9]+)" migration-test.log | tail -n 180 > migration-test-summary.log || true
          exit "$status"

      - name: Upload migration failure summary
        if: failure() && steps.app_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: class-segment-style-migration-test-failure
          path: |
            migration-test-summary.log
            migration-test.log
          retention-days: 1

      - name: Build production app
        run: npm run build

      - name: Commit clean migration
        shell: bash
        run: |
          rm -f migration-test.log migration-test-summary.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: retire class segment style build owner'
          git push origin HEAD:work/class-segment-style-owner-retire-20260908
