# GitHub Pages production deployment and stability-branch validation.
# Production is gated by source tests, browser-level UI regression checks,
# the production build, and backend tests before Pages deployment.
name: Deploy School PWA

on:
  push:
    branches:
      - main
      - 'stability/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: school-pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install production app dependencies
        run: npm ci

      - name: Test production app
        run: npm test

      - name: Build board sheet E2E harness
        run: npm run build -- --config vite.e2e.config.js

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Test board sheet lifecycle in Chromium and WebKit
        run: npx playwright test

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: board-sheet-playwright-report
          path: |
            playwright-report/
            test-results/
            dist-e2e/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build production app
        run: npm run build

      - name: Install production backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Test production backend
        working-directory: push-backend-v2
        run: npm test

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  experience-state-preview:
    if: github.ref == 'refs/heads/stability/experience-state-owner-20260905'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_g4utUuOCpm0FhwXvywAgwkWP
      VERCEL_PROJECT_ID: prj_B0rEK3FcOwjTGDRIdAlPXGrUhflZ
      VERCEL_PROJECT_NAME: s-hub-preview
      STABLE_PREVIEW_URL: https://s-hub-preview.vercel.app
    steps:
      - name: Checkout Stage 1 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock current main baseline
        run: |
          set -euo pipefail
          git fetch origin main
          baseline="$(git merge-base HEAD origin/main)"
          main_sha="$(git rev-parse origin/main)"
          test "${baseline}" = "${main_sha}"
          echo "MAIN_BASELINE_SHA=${main_sha}" >> "$GITHUB_ENV"
          echo "Stage 1 baseline: ${main_sha}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Experience State smoke fixture
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { ExperienceStateOwner } from './src/experience-state.js'

          const now = new Date(2026, 8, 7, 10, 20, 0, 0)
          const timetableState = {
            kind: 'class',
            configured: true,
            current: { number: 2, subject: '정보', start: '10:10', end: '11:00' },
            next: { number: 3, subject: '역학', start: '11:10', end: '12:00' },
          }

          const scenarios = {
            normal: ExperienceStateOwner({ now, timetableState }),
            holiday: ExperienceStateOwner({
              now,
              timetableState,
              schoolData: {
                academicEvents: [{ rawDate: '20260907', name: '대체공휴일', dayOffType: '휴업일' }],
              },
            }),
            discretionary: ExperienceStateOwner({
              now,
              timetableState,
              schoolData: {
                academicEvents: [{ rawDate: '20260907', name: '학교장 재량휴업일', dayOffType: '휴업일' }],
              },
            }),
          }

          fs.writeFileSync('public/experience-state-smoke.json', JSON.stringify({
            stage: 1,
            baseline: process.env.MAIN_BASELINE_SHA,
            scenarios,
          }, null, 2))
          NODE

      - name: Isolate preview runtime from production data and caches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for root in (Path('src'), Path('public')):
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix in {'.js', '.jsx', '.mjs'}:
                      text = path.read_text()
                      text = text.replace("'school.", "'school.preview.").replace('"school.', '"school.preview.')
                      text = text.replace("'school-sync'", "'school-sync-preview'").replace('"school-sync"', '"school-sync-preview"')
                      path.write_text(text)

          sync = Path('src/school-sync.js')
          text = sync.read_text()
          identity = "return `${normalized.classNumber}|${normalized.studentNumber}|${compactName}`"
          preview_identity = "return `preview|${normalized.classNumber}|${normalized.studentNumber}|${compactName}`"
          class_key = "return normalized ? `class-${normalized.classNumber}` : ''"
          preview_class_key = "return normalized ? `preview-class-${normalized.classNumber}` : ''"
          if text.count(identity) != 1 or text.count(class_key) != 1:
              raise SystemExit('preview Firebase isolation markers changed')
          sync.write_text(text.replace(identity, preview_identity, 1).replace(class_key, preview_class_key, 1))

          sw = Path('public/sw.js')
          text = sw.read_text()
          cache_line = next((line for line in text.splitlines() if line.startswith("const CACHE_NAME = 'school-shell-")), None)
          notification_line = "const NOTIFICATION_PROFILE_CACHE = 'school-notification-profile-v1'"
          cleanup = ".filter((key) => ![CACHE_NAME, NOTIFICATION_PROFILE_CACHE].includes(key))"
          if not cache_line or notification_line not in text or cleanup not in text:
              raise SystemExit('preview service worker markers changed')
          text = text.replace(cache_line, "const CACHE_NAME = 'school-preview-shell-experience-state-v1'", 1)
          text = text.replace(notification_line, "const NOTIFICATION_PROFILE_CACHE = 'school-preview-notification-profile-experience-state-v1'", 1)
          text = text.replace(
              cleanup,
              ".filter((key) => key.startsWith('school-preview-') && ![CACHE_NAME, NOTIFICATION_PROFILE_CACHE].includes(key))",
              1,
          )
          sw.write_text(text)
          PY

      - name: Patch Vercel root base
        run: |
          python3 - <<'PY'
          from pathlib import Path
          vite = Path('vite.config.js')
          text = vite.read_text()
          marker = "base: '/school/',"
          if text.count(marker) != 1:
              raise SystemExit('Vite base marker changed')
          vite.write_text(text.replace(marker, "base: '/',", 1))
          PY

      - name: Build isolated preview
        run: npm run build

      - name: Verify preview isolation
        run: node scripts/verify-preview-isolation.mjs dist

      - name: Verify main did not advance before Vercel deploy
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${MAIN_BASELINE_SHA}"

      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"

      - name: Link dedicated preview project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s","projectName":"%s"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" "$VERCEL_PROJECT_NAME" > .vercel/project.json

      - name: Build and deploy prebuilt Vercel preview
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          cli_version="$(npm view vercel version)"
          npx --yes "vercel@${cli_version}" pull --yes --environment=production --token="${VERCEL_TOKEN}"
          npx --yes "vercel@${cli_version}" build --prod --token="${VERCEL_TOKEN}"
          node scripts/verify-preview-isolation.mjs .vercel/output/static
          deployment_url="$(npx --yes "vercel@${cli_version}" deploy --prebuilt --prod --yes --token="${VERCEL_TOKEN}" | tail -n1)"
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: ${deployment_url}"

      - name: Smoke normal, holiday, and discretionary scenarios on deployed preview
        env:
          DEPLOYMENT_URL: ${{ steps.vercel.outputs.deployment_url }}
        run: |
          set -euo pipefail
          stable="${STABLE_PREVIEW_URL}/"
          for attempt in $(seq 1 45); do
            deployed_json="$(curl -fsSL "${DEPLOYMENT_URL}/experience-state-smoke.json?sha=${GITHUB_SHA}&n=${attempt}" || true)"
            stable_json="$(curl -fsSL "${stable}experience-state-smoke.json?sha=${GITHUB_SHA}&n=${attempt}" || true)"
            stable_sw="$(curl -fsSL "${stable}sw.js?sha=${GITHUB_SHA}&n=${attempt}" || true)"

            if [ -n "$deployed_json" ] && [ -n "$stable_json" ] \
              && printf '%s' "$stable_sw" | grep -Fq "school-preview-shell-experience-state-v1"; then
              DEPLOYED_JSON="$deployed_json" STABLE_JSON="$stable_json" python3 - <<'PY'
          import json, os

          deployed = json.loads(os.environ['DEPLOYED_JSON'])
          stable = json.loads(os.environ['STABLE_JSON'])
          for payload in (deployed, stable):
              assert payload['stage'] == 1
              assert payload['scenarios']['normal']['primary'] == 'CLASS'
              assert payload['scenarios']['normal']['context']['reason'] == 'class-active'
              assert payload['scenarios']['holiday']['primary'] == 'HOLIDAY'
              assert payload['scenarios']['holiday']['context']['reason'] == 'holiday'
              assert payload['scenarios']['discretionary']['primary'] == 'HOLIDAY'
              assert payload['scenarios']['discretionary']['context']['reason'] == 'discretionary'
          assert deployed['baseline'] == stable['baseline']
          PY
              echo "Experience State preview smoke passed at ${stable}"
              exit 0
            fi
            sleep 4
          done

          echo "Preview smoke did not converge on the stable alias." >&2
          exit 1

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
