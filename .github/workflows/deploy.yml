# Preview branch validation only. Publishing is performed from main so the
# existing GitHub Pages production root always comes from main.
name: Validate S-Hub v2 Preview

on:
  push:
    branches: [preview/s-hub-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install preview dependencies
        run: npm ci

      - name: Test preview app
        run: npm test

      - name: Patch preview hosting path only for the build
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/preview-v2.js')
          source = path.read_text()
          old_path = "const PREVIEW_PATH = '/preview/'"
          old_api = "const API_URL = '/api/preview-v2'"
          assert source.count(old_path) == 1, 'preview path marker changed unexpectedly'
          assert source.count(old_api) == 1, 'preview API marker changed unexpectedly'
          source = source.replace(old_path, "const PREVIEW_PATH = '/school/preview-v2/'")
          source = source.replace(old_api, "const API_URL = 'https://school-reminder-backend.vercel.app/api/class-roster'")
          path.write_text(source)
          PY

      - name: Build isolated preview app
        run: SHUB_PREVIEW_BASE=/school/preview-v2/ npm run build

      - name: Install preview backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Test preview backend
        working-directory: push-backend-v2
        run: npm test
