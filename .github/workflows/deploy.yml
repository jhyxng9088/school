# GitHub Pages production deployment and stability-branch validation.
# Production is gated by source tests, browser-level UI regression checks,
# the production build, and backend tests before Pages deployment.
name: Deploy School PWA

on:
  push:
    branches:
      - main
      - 'stability/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: school-pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install production app dependencies
        run: npm ci

      - name: Test production app
        run: npm test

      - name: Build board sheet E2E harness
        run: npm run build -- --config vite.e2e.config.js

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Test board sheet lifecycle in Chromium and WebKit
        run: npx playwright test

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: board-sheet-playwright-report
          path: |
            playwright-report/
            test-results/
            dist-e2e/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build production app
        run: npm run build

      - name: Install production backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Test production backend
        working-directory: push-backend-v2
        run: npm test

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
