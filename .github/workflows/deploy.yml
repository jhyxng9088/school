# GitHub Pages production deployment and stability-branch validation.
# Production is gated by source tests, browser-level UI regression checks,
# the production build, and backend tests before Pages deployment.
name: Deploy School PWA

on:
  push:
    branches:
      - main
      - 'stability/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: school-pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install production app dependencies
        run: npm ci

      - name: Test production app
        run: npm test

      - name: Install production backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Diagnose backend tests group A
        continue-on-error: true
        working-directory: push-backend-v2
        run: >-
          node --test --test-concurrency=1
          test/admin-overview-v3.test.js
          test/class-roster-api.test.js
          test/class-roster-repair-api.test.js
          test/class-roster-v2-api.test.js
          test/class-roster.test.js
          test/preview-isolation.test.js
          test/reminder-original-stream.test.js
          test/reminder-section-production-access.test.js
          test/reminder-section.test.js
          test/s-hub-ai-cache.test.js
          test/s-hub-ai-mode.test.js
          test/s-hub-ai-subject.test.js

      - name: Diagnose backend tests group B
        continue-on-error: true
        working-directory: push-backend-v2
        run: >-
          node --test --test-concurrency=1
          test/scheduled-reminder-rules.test.js
          test/scheduler-read-optimization.test.js
          test/scheduler-timezone.test.js
          test/service-class-schedules.test.js
          test/service-class-tasks.test.js
          test/service-class.test.js
          test/service-classboard-cleanup.test.js
          test/service-classboard.test.js
          test/service-ranking-display.test.js
          test/service-ranking-kst.test.js
          test/service-reminder-image-ocr.test.js
          test/service-reminder-image.test.js

      - name: Diagnose backend tests group C
        continue-on-error: true
        working-directory: push-backend-v2
        shell: bash
        run: |
          mapfile -t files < <(
            find test -maxdepth 1 -name '*.test.js' -print | sort | grep -Ev '(^|/)(admin-overview-v3|class-roster-api|class-roster-repair-api|class-roster-v2-api|class-roster|preview-isolation|reminder-original-stream|reminder-section-production-access|reminder-section|s-hub-ai-cache|s-hub-ai-mode|s-hub-ai-subject|scheduled-reminder-rules|scheduler-read-optimization|scheduler-timezone|service-class-schedules|service-class-tasks|service-class|service-classboard-cleanup|service-classboard|service-ranking-display|service-ranking-kst|service-reminder-image-ocr|service-reminder-image|timetable-neis-policy)\.test\.js$'
          )
          node --test --test-concurrency=1 "${files[@]}"

      - name: Diagnose new NEIS timetable tests
        continue-on-error: true
        working-directory: push-backend-v2
        run: node --test --test-concurrency=1 test/timetable-neis-policy.test.js

      - name: Diagnose all explicit backend tests
        continue-on-error: true
        working-directory: push-backend-v2
        run: node --test --test-concurrency=1 test/*.test.js

      - name: Test production backend
        working-directory: push-backend-v2
        run: npm test

      - name: Build board sheet E2E harness
        run: npm run build -- --config vite.e2e.config.js

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Test board sheet lifecycle in Chromium and WebKit
        run: npx playwright test

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: board-sheet-playwright-report
          path: |
            playwright-report/
            test-results/
            dist-e2e/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build production app
        run: npm run build

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
