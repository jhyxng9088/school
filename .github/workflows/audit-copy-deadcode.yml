name: Audit copy and dead code

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-copy-deadcode.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit Korean copy and reachable files
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const roots = ['src','public']
          const textFiles = []
          function walk(dir) {
            for (const name of fs.readdirSync(dir)) {
              const p = path.join(dir,name)
              const st = fs.statSync(p)
              if (st.isDirectory()) walk(p)
              else if (/\.(js|jsx|css|html|webmanifest)$/.test(p)) textFiles.push(p)
            }
          }
          roots.forEach(walk)
          textFiles.push('index.html')
          console.log('===== KOREAN LINES =====')
          for (const file of textFiles) {
            const lines = fs.readFileSync(file,'utf8').split(/\r?\n/)
            lines.forEach((line,i)=>{ if (/[가-힣]/u.test(line)) console.log(`${file}:${i+1}:${line.trim()}`) })
          }

          const all = new Set(textFiles.filter(f=>f!=='index.html'))
          const reachable = new Set()
          const queue = []
          function add(file) { if (all.has(file) && !reachable.has(file)) { reachable.add(file); queue.push(file) } }
          const index = fs.readFileSync('index.html','utf8')
          for (const m of index.matchAll(/(?:src|href)=["']\.\/([^"']+)["']/g)) add(`public/${m[1]}`)
          if (index.includes('/src/main.jsx')) add('src/main.jsx')
          add('public/sw.js')
          add('public/manifest.webmanifest')
          while (queue.length) {
            const file = queue.shift()
            const text = fs.readFileSync(file,'utf8')
            if (file.startsWith('src/')) {
              for (const m of text.matchAll(/(?:from\s+|import\s*)["'](\.\/[^"']+)["']/g)) {
                const base = path.normalize(path.join(path.dirname(file),m[1]))
                const tries = [base,`${base}.js`,`${base}.jsx`,`${base}.css`]
                for (const t of tries) if (all.has(t)) add(t)
              }
              for (const m of text.matchAll(/import\s+["'](\.\/[^"']+)["']/g)) {
                const base = path.normalize(path.join(path.dirname(file),m[1]))
                const tries = [base,`${base}.js`,`${base}.jsx`,`${base}.css`]
                for (const t of tries) if (all.has(t)) add(t)
              }
            } else if (file.startsWith('public/')) {
              for (const m of text.matchAll(/["']\.\/([^"']+)["']/g)) add(`public/${m[1]}`)
              for (const m of text.matchAll(/["']([^"']+\.(?:js|css|svg|webmanifest))["']/g)) {
                const candidate = `public/${m[1].replace(/^\.\//,'')}`
                add(candidate)
              }
            }
          }
          console.log('===== UNREACHABLE TEXT FILES =====')
          ;[...all].filter(f=>!reachable.has(f)).sort().forEach(f=>console.log(f))
          console.log('===== REACHABLE COUNT =====')
          console.log(reachable.size)
          NODE
