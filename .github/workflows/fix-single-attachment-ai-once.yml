name: Fix single attachment AI once

on:
  push:
    branches: [fix-single-attachment-ai-regression]

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-single-attachment-ai-regression
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore proven one-file backend path
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/firebase-ai.js')
          text = path.read_text()
          old = """  const result = await directReminderResult(input, now, files, { titleOnly: false, smartRecovery: false })
            const attachments = files.map((file) => normalizeAttachment({
              name: String(file.name || '첨부파일').slice(0, 120),
              mimeType: inferredAttachmentType(file),
              size: Number(file.size || 0),
            })).filter(Boolean)
          """
          new = """  let result = null
            if (files.length === 1) {
              try {
                result = await parseReminderWithAISingle(input, now, files[0])
              } catch (error) {
                if (!shouldUseDirectRecovery(error)) throw error
                result = await directReminderResult(input, now, files, { titleOnly: false, smartRecovery: true })
              }
            } else {
              result = await directReminderResult(input, now, files, { titleOnly: false, smartRecovery: false })
            }

            const attachments = files.map((file) => normalizeAttachment({
              name: String(file.name || '첨부파일').slice(0, 120),
              mimeType: inferredAttachmentType(file),
              size: Number(file.size || 0),
            })).filter(Boolean)
          """
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one AI result block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify scope
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = 'src/firebase-ai.js'
      - name: Build
        run: |
          npm install
          npm run build
      - name: Commit tested fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-single-attachment-ai-once.yml
          git config user.name "jhyxng9088"
          git config user.email "j.hyxng9088@gmail.com"
          git add src/firebase-ai.js .github/workflows/fix-single-attachment-ai-once.yml
          git commit -m "Fix single attachment reminder AI regression"
          git push origin HEAD:fix-single-attachment-ai-regression
