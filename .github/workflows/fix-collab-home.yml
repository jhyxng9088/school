name: Validate collaboration runtime fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-collab-home.mjs'
      - '.github/workflows/fix-collab-home.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded runtime fix
        run: node scripts/fix-collab-home.mjs

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

      - name: Commit validated fix
        run: |
          git config user.name "school-pwa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/main.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix shared academic home data wiring"
          git push
