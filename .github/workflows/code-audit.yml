name: Full code audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/code-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count suspect symbols
        run: |
          node <<'NODE'
          const fs = require('fs')
          const files = ['src/main.jsx','public/school-sheet.js','src/stage3-core.js']
          const symbols = ['loadOverrides','loadWeeklySchedule','saveOverrides','saveWeeklySchedule','TodoPreview','EmptyPanel','StandardPage','hasOverride','saveButton']
          for (const file of files) {
            const text = fs.readFileSync(file,'utf8')
            console.log(`===== ${file} =====`)
            for (const symbol of symbols) {
              const matches = text.match(new RegExp(`\\b${symbol}\\b`, 'g')) || []
              if (matches.length) console.log(`${symbol}: ${matches.length}`)
            }
          }
          NODE
