name: S-Hub scheduled push

on:
  schedule:
    # Run every 5 minutes on weekdays. The backend uses KST and decides
    # whether a next-class or lunch notification is actually due.
    - cron: '*/5 * * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/push-scheduler.yml'

permissions:
  contents: read

concurrency:
  group: s-hub-scheduled-push
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger scheduled push dispatcher
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 25 \
            --header 'Accept: application/json' \
            'https://school-push-backend.vercel.app/api/push-scheduled'
