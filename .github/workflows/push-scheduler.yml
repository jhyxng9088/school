name: S-Hub scheduled push

on:
  schedule:
    # KST school-time windows. Each window is triggered three times so a delayed
    # or dropped GitHub scheduled run still has another chance inside the
    # backend's 10-minute notification window.
    - cron: '1,4,7 9-12 * * 1-5'
      timezone: 'Asia/Seoul'
    - cron: '1,4,7 13 * * 1-5'
      timezone: 'Asia/Seoul'
    - cron: '51,54,57 13-15 * * 1-5'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/push-scheduler.yml'

permissions:
  contents: read

concurrency:
  group: s-hub-scheduled-push
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger scheduled push dispatcher
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 25 \
            --header 'Accept: application/json' \
            'https://school-push-backend.vercel.app/api/push-scheduled'
