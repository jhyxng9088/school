name: S-Hub scheduled push

on:
  schedule:
    # KST school-time windows. GitHub Actions supports a minimum interval of 5 minutes,
    # so each notification window is checked twice, five minutes apart.
    # The backend performs due-time checks and deduplicates sends.
    - cron: '1,6 9-12 * * 1-5'
      timezone: 'Asia/Seoul'
    - cron: '1,6 13 * * 1-5'
      timezone: 'Asia/Seoul'
    - cron: '51,56 13-15 * * 1-5'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/push-scheduler.yml'

permissions:
  contents: read

concurrency:
  group: s-hub-scheduled-push
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger scheduled push dispatcher
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 25 \
            --header 'Accept: application/json' \
            'https://school-push-backend.vercel.app/api/push-scheduled'
