name: S-Hub scheduled push

on:
  schedule:
    # Run every 5 minutes during KST school hours, offset from the top of the hour.
    # The backend decides whether an alert is due and skips outside notification windows.
    - cron: '2-57/5 9-16 * * 1-5'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/push-scheduler.yml'

permissions:
  contents: read

concurrency:
  group: s-hub-scheduled-push
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger scheduled push dispatcher
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 25 \
            --header 'Accept: application/json' \
            'https://school-push-backend.vercel.app/api/push-scheduled'
