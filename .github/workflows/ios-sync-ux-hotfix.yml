name: Apply iOS sync UX hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ios-sync-ux-hotfix.yml
      - scripts/ios-sync-ux-hotfix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 scripts/ios-sync-ux-hotfix.py

      - name: Verify diff
        run: git diff --check

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

      - name: Remove temporary patch files and commit
        shell: bash
        run: |
          rm .github/workflows/ios-sync-ux-hotfix.yml scripts/ios-sync-ux-hotfix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/todo.jsx src/todo-stage5-ai.jsx src/school-sync.js src/class-activity.js src/main.jsx src/academic-shared.css public/school-sheet.css index.html .github/workflows/ios-sync-ux-hotfix.yml scripts/ios-sync-ux-hotfix.py
          git commit -m "Fix iOS reminder sync and sheet responsiveness"
          git push