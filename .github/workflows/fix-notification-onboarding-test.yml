name: Fix notification prompt compatibility

on:
  push:
    paths:
      - .github/workflows/fix-notification-onboarding-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore denied-permission copy only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/push-client.js')
          text = path.read_text()
          old = '기기 설정에서 S-Hub 알림을 허용하면 중요한 학교 소식을 놓치지 않을 수 있어.'
          new = '기기 설정에서 S-Hub 알림을 허용해줘.'
          if old not in text:
            raise SystemExit('denied copy anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate notification prompt and build
        run: |
          npm ci
          node --test tests/push-prompt-every-entry.test.js
          npm run build
      - name: Commit push prompt fix only
        run: |
          git config user.name jhyxng9088
          git config user.email j.hyxng9088@gmail.com
          git add src/push-client.js
          git diff --cached --quiet && exit 0
          git commit -m 'Keep notification prompt compatibility'
          git push
