name: One-time reminder expiry safety patch

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove one-time workflow before repository tests
        run: rm -f .github/workflows/fix-reminder-expiry.yml

      - name: Patch automatic reminder expiry cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/todo.jsx')
          source = path.read_text()
          auto_start = source.index('const expired = sourceTodos.filter')
          tombstone_token = source.index('const tombstone = {', auto_start)
          block_start = source.rfind('\n', 0, tombstone_token) + 1
          indent = source[block_start:tombstone_token]
          timeout_token = source.index(
              'window.setTimeout(() => expiryDeleteAttemptsRef.current.delete(todo.id), 60_000)',
              tombstone_token,
          )
          close_token = source.index('})', timeout_token)
          block_end = source.find('\n', close_token)
          if block_end < 0:
              block_end = len(source)
          else:
              block_end += 1

          old_block = source[block_start:block_end]
          if 'writeSharedTodo(profile, tombstone)' not in old_block or "dueDate: '1970-01-01'" not in old_block:
              raise SystemExit('Expected automatic-expiry tombstone block was not found')

          new_block = (
              f"{indent}deleteExpiredSharedTodo(profile, todo.id)\n"
              f"{indent}  .catch((error) => {{\n"
              f"{indent}    console.error('Expired shared reminder delete failed:', error)\n"
              f"{indent}    window.setTimeout(() => expiryDeleteAttemptsRef.current.delete(todo.id), 60_000)\n"
              f"{indent}  }})\n"
          )
          source = source[:block_start] + new_block + source[block_end:]
          path.write_text(source)

          test = Path('tests/reminder-expiry-server-guard.test.js')
          test.write_text("""import test from 'node:test'\nimport assert from 'node:assert/strict'\nimport fs from 'node:fs'\n\nconst source = fs.readFileSync(new URL('../src/todo.jsx', import.meta.url), 'utf8')\n\ntest('automatic reminder expiry deletes the original server document without tombstoning its due date', () => {\n  const autoStart = source.indexOf('const expired = sourceTodos.filter')\n  const autoEnd = source.indexOf('}, [signature, sourceTodos, expiryClock])', autoStart)\n  assert.ok(autoStart >= 0 && autoEnd > autoStart)\n  const block = source.slice(autoStart, autoEnd)\n  assert.match(block, /deleteExpiredSharedTodo\\(profile, todo\\.id\\)/)\n  assert.doesNotMatch(block, /1970-01-01|writeSharedTodo\\(profile, tombstone\\)/)\n})\n""")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Test app
        run: npm test

      - name: Build app
        run: npm run build

      - name: Install reminder backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Test reminder backend
        working-directory: push-backend-v2
        run: npm test

      - name: Commit safe expiry cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/todo.jsx tests/reminder-expiry-server-guard.test.js .github/workflows/fix-reminder-expiry.yml
          git commit -m "Use server rules for reminder expiry deletion"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload patched Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy patched build
        uses: actions/deploy-pages@v4
