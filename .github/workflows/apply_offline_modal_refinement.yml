name: Apply offline modal refinement

on:
  push:
    paths:
      - '.github/workflows/apply_offline_modal_refinement.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded source patch
        run: python3 .github/scripts/apply_offline_modal_refinement.py
      - name: Verify diff
        run: git diff --check
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Commit verified refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/unified-sheet.jsx src/unified-sheet.css src/class-activity.js src/school-sync.js src/academic-shared.jsx src/main.jsx
          git commit -m "Fix offline writes and unified sheet isolation" || exit 0
          git push
