name: Apply standalone install gate

on:
  push:
    paths:
      - .github/workflows/apply-standalone-install-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply standalone gate
        run: python .github/scripts/apply-standalone-install-gate.py
      - name: Remove one-time patch files
        run: |
          rm .github/workflows/apply-standalone-install-gate.yml
          rm .github/scripts/apply-standalone-install-gate.py
          rmdir .github/scripts || true
      - name: Validate install gate
        run: |
          grep -F "if (!standalone || !installDone)" src/main.jsx
          grep -F "disabled={!standalone}" src/main.jsx
          grep -F "if (!isStandalone()) return" src/main.jsx
      - name: Validate app
        run: |
          npm ci
          npm test
          npm run build
      - name: Validate reminder backend
        working-directory: push-backend-v2
        run: |
          npm ci
          npm test
      - name: Commit validated standalone gate
        run: |
          git config user.name jhyxng9088
          git config user.email j.hyxng9088@gmail.com
          git add src/main.jsx .github/workflows/apply-standalone-install-gate.yml .github/scripts/apply-standalone-install-gate.py
          git diff --cached --check
          git commit -m 'Require installed standalone PWA before app entry'
          git push
