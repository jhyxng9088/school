name: Verify S-Hub AI v152 final

on:
  push:
    branches:
      - fix/s-hub-ai-hybrid-answer-import-v152

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove temporary workflow
        run: rm .github/workflows/verify-s-hub-ai-v152-final.yml

      - name: Verify repository shape
        run: |
          git diff --check
          test ! -e .github/workflows/verify-s-hub-ai-v152-final.yml
          test ! -d tools
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          grep -q "mode: 'hybrid'" src/s-hub-ai-sheet.jsx
          grep -q "ATTACHMENT_QUESTION_SCHEMA" src/s-hub-ai.js
          grep -q "sHubAiResponseCache" push-backend-v2/api/s-hub-ai.js
          grep -q '"reference":"$1"' push-backend-v2/api/s-hub-ai.js
          grep -q "school-shell-v152" public/sw.js

      - name: Install app dependencies
        run: npm ci

      - name: Test app
        run: npm test

      - name: Build app
        run: npm run build

      - name: Install backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Test backend
        working-directory: push-backend-v2
        run: npm test

      - name: Commit final verified tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize S-Hub hybrid answers and shared cache [skip ci]"
          git push origin HEAD:fix/s-hub-ai-hybrid-answer-import-v152
