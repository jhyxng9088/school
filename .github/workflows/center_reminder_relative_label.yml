name: Center reminder relative label

on:
  push:
    paths:
      - '.github/workflows/center_reminder_relative_label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply precise patch
        run: python3 .github/scripts/center_reminder_relative_label.py
      - name: Verify diff
        run: git diff --check
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Verify exact scope
        run: |
          grep -q 'className="todo-meta-text"' src/todo-stage5-ai.jsx
          ! grep -q 'as="small" value={meta}' src/todo-stage5-ai.jsx
      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/todo-stage5-ai.jsx src/todo-stage5.css
          git commit -m "Center reminder relative date labels" || exit 0
          git push
