name: Verify S-Hub AI unified UX

on:
  push:
    branches:
      - fix/s-hub-ai-unified-ux

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/s-hub-ai-unified-ux
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded fixes
        run: python3 .github/scripts/apply_s_hub_ai_unified.py

      - name: Remove temporary verification machinery
        run: |
          rm -f .github/scripts/apply_s_hub_ai_unified.py
          rm -f .github/workflows/verify-s-hub-ai-unified.yml
          rmdir .github/scripts 2>/dev/null || true

      - name: Verify final repository shape
        run: |
          test ! -e .github/scripts/apply_s_hub_ai_unified.py
          test ! -e .github/workflows/verify-s-hub-ai-unified.yml
          grep -q "school-shell-v146" public/sw.js
          grep -q "title=\"S-Hub AI\"" src/s-hub-ai-sheet.jsx
          grep -q "purpose: 'reminder'" src/firebase-ai.js

      - name: Install app dependencies
        run: npm ci

      - name: Test app
        run: npm test

      - name: Build app
        run: npm run build

      - name: Install backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Test backend
        working-directory: push-backend-v2
        run: npm test

      - name: Commit verified final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Unify S-Hub AI UX and stabilize iPhone editing [skip ci]"
          git push origin HEAD:fix/s-hub-ai-unified-ux
