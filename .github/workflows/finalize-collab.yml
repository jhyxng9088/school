name: Finalize collaboration features

on:
  push:
    branches: [main]
    paths:
      - 'scripts/finalize-collab.mjs'
      - '.github/workflows/finalize-collab.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply guarded hardening
        run: node scripts/finalize-collab.mjs

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Validate Firestore rules
        run: npx --yes firebase-tools@latest emulators:exec --only firestore "echo firestore-rules-ok"

      - name: Commit validated changes
        run: |
          git config user.name "school-pwa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src public firestore.rules
          git diff --cached --quiet && exit 0
          git commit -m "Finalize shared schedule attribution and polish"
          git push
