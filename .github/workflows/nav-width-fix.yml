name: Apply standards-safe nav width fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nav-width-fix.yml
      - scripts/nav-width-fix.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix CSS width calculation
        run: python3 scripts/nav-width-fix.py

      - name: Verify
        run: |
          grep -q -- "100% - var(--nav-padding) - var(--nav-padding)" src/styles.css
          git diff --check

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/nav-width-fix.yml scripts/nav-width-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles.css .github/workflows/nav-width-fix.yml scripts/nav-width-fix.py
          git commit -m "Use standards-safe mobile nav sizing"
          git push
