name: Preview Runtime QA

on:
  push:
    branches:
      - preview/s-hub-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview/s-hub-v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Check deployed preview renders instead of a black screen
        env:
          V2_QA_URL: https://jhyxng9088.github.io/school/preview-v2/
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright'
          const url = process.env.V2_QA_URL
          const profile = JSON.stringify({ name: 'QA', classNumber: 1, studentNumber: 1 })
          const targets = [
            ['phone', { width: 393, height: 852 }, true],
            ['tablet', { width: 1024, height: 768 }, true],
            ['desktop', { width: 1440, height: 900 }, false],
          ]
          const browser = await chromium.launch({ headless: true })
          try {
            for (const [name, viewport, touch] of targets) {
              const context = await browser.newContext({ viewport, hasTouch: touch, colorScheme: 'dark' })
              const page = await context.newPage()
              const pageErrors = []
              const consoleErrors = []
              page.on('pageerror', error => pageErrors.push(String(error?.stack || error)))
              page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()) })
              await page.addInitScript(({ profile }) => {
                localStorage.setItem('school.preview.installGuideDone', 'true')
                localStorage.setItem('school.preview.studentProfile.v1', profile)
                localStorage.setItem('school.preview.featureTour.v1', 'done')
                localStorage.setItem('school.preview.v2UpdateTour.v1', 'done')
              }, { profile })
              const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 })
              await page.waitForTimeout(5000)
              const state = await page.evaluate(() => ({
                url: location.href,
                statusText: document.body?.innerText?.slice(0, 500) || '',
                rootLength: document.querySelector('#root')?.innerHTML?.length || 0,
                appShell: Boolean(document.querySelector('.app-shell')),
                installGuide: Boolean(document.querySelector('.onboarding-page')),
                tour: Boolean(document.querySelector('.v2-update-tour-layer.is-open')),
                bg: getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(),
                scripts: [...document.scripts].map(s => s.src).filter(Boolean),
              }))
              console.log(name, 'HTTP', response?.status(), JSON.stringify(state))
              if (!response?.ok()) throw new Error(`${name}: HTTP ${response?.status()}`)
              if (!state.rootLength || !state.appShell || !state.statusText.trim()) {
                throw new Error(`${name}: blank render; state=${JSON.stringify(state)}; pageErrors=${pageErrors.join(' | ')}; consoleErrors=${consoleErrors.join(' | ')}`)
              }
              if (pageErrors.length) throw new Error(`${name}: page errors: ${pageErrors.join(' | ')}`)
              await context.close()
            }

            const context = await browser.newContext({ viewport: { width: 1024, height: 768 }, hasTouch: true, colorScheme: 'dark' })
            const page = await context.newPage()
            const pageErrors = []
            page.on('pageerror', error => pageErrors.push(String(error?.stack || error)))
            await page.addInitScript(({ profile }) => {
              localStorage.setItem('school.preview.installGuideDone', 'true')
              localStorage.setItem('school.preview.studentProfile.v1', profile)
              localStorage.setItem('school.preview.featureTour.v1', 'done')
              localStorage.removeItem('school.preview.v2UpdateTour.v1')
            }, { profile })
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 })
            await page.waitForTimeout(3000)
            const tourState = await page.evaluate(() => ({
              rootLength: document.querySelector('#root')?.innerHTML?.length || 0,
              text: document.body?.innerText?.slice(0, 500) || '',
              tourOpen: Boolean(document.querySelector('.v2-update-tour-layer.is-open')),
              activeSlide: document.querySelector('.v2-update-slide.is-active')?.getAttribute('data-index') || null,
            }))
            console.log('tour', JSON.stringify(tourState))
            if (!tourState.rootLength || !tourState.text.trim()) throw new Error(`tour blank render: ${JSON.stringify(tourState)}; ${pageErrors.join(' | ')}`)
            await context.close()
          } finally {
            await browser.close()
          }
          NODE
