name: Migrate timetable motion semantic owner

on:
  push:
    branches:
      - work/timetable-motion-semantic-owner-20260906

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: work/timetable-motion-semantic-owner-20260906
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate timetable motion ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          main_path = Path('src/main.jsx')
          main = main_path.read_text()
          anchor = "  async function clearAllChanges() {\n"
          effect = "\n".join([
              "  useEffect(() => {",
              "    document.dispatchEvent(new Event('school:timetable-motion-sync'))",
              "  }, [",
              "    editing,",
              "    weekAnchor,",
              "    now,",
              "    weeklySchedule,",
              "    overrides,",
              "    sharedWeeklySchedule,",
              "    sharedOverrides,",
              "    personalWeeklySchedule,",
              "    personalOverrides,",
              "  ])",
              "",
          ])
          main = replace_once(main, anchor, effect + anchor, 'TimetablePage semantic motion effect')
          main_path.write_text(main)

          motion_path = Path('public/school-timetable-motion.js')
          motion = motion_path.read_text()
          start_marker = "  const observer = new MutationObserver((mutations) => {\n"
          end_marker = "  document.querySelectorAll(TIMETABLE_PAGE_SELECTOR).forEach(schedulePageReady)\n"
          start = motion.find(start_marker)
          end = motion.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit('timetable observer block boundary missing')
          end += len(end_marker)
          replacement = "\n".join([
              "  const cellSignatures = new WeakMap()",
              "  let syncFrame = null",
              "",
              "  function cellSignature(cell) {",
              "    return `${cell.className}\\n${cell.textContent || ''}`",
              "  }",
              "",
              "  function syncTimetableMotion() {",
              "    if (syncFrame !== null) return",
              "",
              "    syncFrame = requestAnimationFrame(() => {",
              "      syncFrame = null",
              "      document.querySelectorAll(TIMETABLE_PAGE_SELECTOR).forEach(schedulePageReady)",
              "      document.querySelectorAll(CELL_SELECTOR).forEach((cell) => {",
              "        const signature = cellSignature(cell)",
              "        const previous = cellSignatures.get(cell)",
              "        cellSignatures.set(cell, signature)",
              "",
              "        if (previous === undefined) {",
              "          if (isTimetableReady(cell)) queueCell(cell)",
              "          return",
              "        }",
              "        if (previous !== signature) queueCell(cell)",
              "      })",
              "    })",
              "  }",
              "",
              "  document.addEventListener('school:timetable-motion-sync', syncTimetableMotion)",
              "  syncTimetableMotion()",
              "",
          ])
          motion = motion[:start] + replacement + motion[end:]
          motion_path.write_text(motion)
          PY

          git rm .github/workflows/migrate-timetable-motion-semantic-owner.yml

          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/migrate-timetable-motion-semantic-owner.yml',
              'public/school-timetable-motion.js',
              'src/main.jsx',
          }
          changed = set(subprocess.check_output(['git', 'diff', 'HEAD', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected migration paths: {sorted(changed)}')
          PY

      - name: Test production app
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Commit clean migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: retire timetable DOM observer'
          git push origin HEAD:work/timetable-motion-semantic-owner-20260906
