name: Verify quota optimization branch

on:
  push:
    branches:
      - fix/quota-roster-supabase-20260903

permissions:
  contents: read

concurrency:
  group: quota-branch-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Hide temporary verification workflow from repository-structure test
        run: mv .github/workflows/branch-verify.yml /tmp/branch-verify.yml

      - name: Full default concurrency
        id: default_full
        continue-on-error: true
        run: node --test tests/*.test.js

      - name: Full concurrency 32
        id: c32
        continue-on-error: true
        run: node --test --test-concurrency=32 tests/*.test.js

      - name: Full concurrency 16
        id: c16
        continue-on-error: true
        run: node --test --test-concurrency=16 tests/*.test.js

      - name: Full concurrency 8
        id: c8
        continue-on-error: true
        run: node --test --test-concurrency=8 tests/*.test.js

      - name: Full concurrency 4
        id: c4
        continue-on-error: true
        run: node --test --test-concurrency=4 tests/*.test.js

      - name: First 70 default concurrency
        id: first70
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.js' -print | sort)
          node --test "${files[@]:0:70}"

      - name: First 80 default concurrency
        id: first80
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.js' -print | sort)
          node --test "${files[@]:0:80}"

      - name: First 85 default concurrency
        id: first85
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.js' -print | sort)
          node --test "${files[@]:0:85}"

      - name: Diagnostic summary
        if: always()
        run: |
          echo "default-full=${{ steps.default_full.outcome }}"
          echo "c32=${{ steps.c32.outcome }}"
          echo "c16=${{ steps.c16.outcome }}"
          echo "c8=${{ steps.c8.outcome }}"
          echo "c4=${{ steps.c4.outcome }}"
          echo "first70=${{ steps.first70.outcome }}"
          echo "first80=${{ steps.first80.outcome }}"
          echo "first85=${{ steps.first85.outcome }}"
