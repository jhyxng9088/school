name: Verify quota optimization branch

on:
  push:
    branches:
      - fix/quota-roster-supabase-20260903

permissions:
  contents: read

concurrency:
  group: quota-branch-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Hide temporary verification workflow from repository-structure test
        run: mv .github/workflows/branch-verify.yml /tmp/branch-verify.yml

      - name: Run app suite 5 times and capture TAP
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/app-test-output
          for i in 1 2 3 4 5; do
            node --test --test-reporter=tap tests/*.test.js > "/tmp/app-test-output/run-${i}.tap" 2>&1
            code=$?
            echo "$code" > "/tmp/app-test-output/run-${i}.code"
            echo "run-$i exit=$code"
          done
          exit 0

      - name: Upload app test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: app-test-diagnostics
          path: /tmp/app-test-output
          retention-days: 1
