name: Verify quota optimization branch

on:
  push:
    branches:
      - fix/quota-roster-supabase-20260903

permissions:
  contents: read

concurrency:
  group: quota-branch-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Hide temporary verification workflow from repository-structure test
        run: mv .github/workflows/branch-verify.yml /tmp/branch-verify.yml

      - name: First half 1-45
        id: first_half
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.js' -print | sort)
          node --test --test-concurrency=1 "${files[@]:0:45}"

      - name: Second half 46-91
        id: second_half
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.js' -print | sort)
          node --test --test-concurrency=1 "${files[@]:45}"

      - name: Prefix 1-60
        id: prefix_60
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.js' -print | sort)
          node --test --test-concurrency=1 "${files[@]:0:60}"

      - name: Prefix 1-70
        id: prefix_70
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.js' -print | sort)
          node --test --test-concurrency=1 "${files[@]:0:70}"

      - name: Suffix 21-91
        id: suffix_21
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.js' -print | sort)
          node --test --test-concurrency=1 "${files[@]:20}"

      - name: Suffix 31-91
        id: suffix_31
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.js' -print | sort)
          node --test --test-concurrency=1 "${files[@]:30}"

      - name: Full app suite
        id: full_suite
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.js' -print | sort)
          node --test --test-concurrency=1 "${files[@]}"

      - name: Diagnostic summary
        if: always()
        run: |
          echo "first-half=${{ steps.first_half.outcome }}"
          echo "second-half=${{ steps.second_half.outcome }}"
          echo "prefix-60=${{ steps.prefix_60.outcome }}"
          echo "prefix-70=${{ steps.prefix_70.outcome }}"
          echo "suffix-21=${{ steps.suffix_21.outcome }}"
          echo "suffix-31=${{ steps.suffix_31.outcome }}"
          echo "full=${{ steps.full_suite.outcome }}"
