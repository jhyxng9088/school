name: Verify quota optimization branch

on:
  push:
    branches:
      - fix/quota-roster-supabase-20260903

permissions:
  contents: read

concurrency:
  group: quota-branch-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Hide temporary verification workflow from repository-structure test
        run: mv .github/workflows/branch-verify.yml /tmp/branch-verify.yml

      - name: Test app
        run: npm test

      - name: Repeat app tests
        run: npm test

      - name: Build board sheet E2E harness
        run: npm run build -- --config vite.e2e.config.js

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Chromium and WebKit UI regression tests
        run: npx playwright test

      - name: Build production app
        run: npm run build

      - name: Install backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Test backend and capture output
        shell: bash
        run: |
          set +e
          cd push-backend-v2
          npm test 2>&1 | tee ../backend-test.log
          status=${PIPESTATUS[0]}
          echo "$status" > ../backend-test-status
          exit 0

      - name: Upload backend diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-diagnostics
          path: |
            backend-test.log
            backend-test-status

      - name: Enforce backend test result
        shell: bash
        run: test "$(cat backend-test-status)" = "0"
