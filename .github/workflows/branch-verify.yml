name: Verify quota optimization branch

on:
  push:
    branches:
      - fix/quota-roster-supabase-20260903

permissions:
  contents: read

concurrency:
  group: quota-branch-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Hide temporary verification workflow from repository-structure test
        run: mv .github/workflows/branch-verify.yml /tmp/branch-verify.yml

      - name: Test app
        run: npm test

      - name: Build board sheet E2E harness
        run: npm run build -- --config vite.e2e.config.js

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Chromium and WebKit UI regression tests
        run: npx playwright test

      - name: Build production app
        run: npm run build

      - name: Install backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Test new roster API contract
        working-directory: push-backend-v2
        run: node --test test/class-roster-v2-api.test.js

      - name: Test Supabase roster cache contract
        working-directory: push-backend-v2
        run: node --test test/supabase-roster-cache.test.js

      - name: Backend activity/admin group
        id: backend_activity_admin
        continue-on-error: true
        working-directory: push-backend-v2
        shell: bash
        run: |
          shopt -s nullglob
          files=(test/activity*.test.js test/admin*.test.js)
          ((${#files[@]} == 0)) || node --test "${files[@]}"

      - name: Backend class group
        id: backend_class
        continue-on-error: true
        working-directory: push-backend-v2
        shell: bash
        run: |
          shopt -s nullglob
          files=(test/class*.test.js)
          ((${#files[@]} == 0)) || node --test "${files[@]}"

      - name: Backend NEIS/preview group
        id: backend_neis_preview
        continue-on-error: true
        working-directory: push-backend-v2
        shell: bash
        run: |
          shopt -s nullglob
          files=(test/neis*.test.js test/preview*.test.js)
          ((${#files[@]} == 0)) || node --test "${files[@]}"

      - name: Backend reminder group
        id: backend_reminder
        continue-on-error: true
        working-directory: push-backend-v2
        shell: bash
        run: |
          shopt -s nullglob
          files=(test/reminder*.test.js)
          ((${#files[@]} == 0)) || node --test "${files[@]}"

      - name: Backend Supabase group
        id: backend_supabase
        continue-on-error: true
        working-directory: push-backend-v2
        shell: bash
        run: |
          shopt -s nullglob
          files=(test/supabase*.test.js)
          ((${#files[@]} == 0)) || node --test "${files[@]}"

      - name: Backend remaining group
        id: backend_remaining
        continue-on-error: true
        working-directory: push-backend-v2
        shell: bash
        run: |
          mapfile -t files < <(find test -maxdepth 1 -name '*.test.js' -print | sort | grep -Ev '/(activity|admin|class|neis|preview|reminder|supabase)')
          ((${#files[@]} == 0)) || node --test "${files[@]}"

      - name: Fail if any backend regression group failed
        if: always()
        shell: bash
        run: |
          failed=0
          [[ '${{ steps.backend_activity_admin.outcome }}' == 'failure' ]] && echo 'activity/admin failed' && failed=1
          [[ '${{ steps.backend_class.outcome }}' == 'failure' ]] && echo 'class failed' && failed=1
          [[ '${{ steps.backend_neis_preview.outcome }}' == 'failure' ]] && echo 'neis/preview failed' && failed=1
          [[ '${{ steps.backend_reminder.outcome }}' == 'failure' ]] && echo 'reminder failed' && failed=1
          [[ '${{ steps.backend_supabase.outcome }}' == 'failure' ]] && echo 'supabase failed' && failed=1
          [[ '${{ steps.backend_remaining.outcome }}' == 'failure' ]] && echo 'remaining failed' && failed=1
          exit $failed
