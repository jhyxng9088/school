name: Verify quota optimization branch

on:
  push:
    branches:
      - fix/quota-roster-supabase-20260903

permissions:
  contents: read

concurrency:
  group: quota-branch-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Hide temporary verification workflow from repository-structure test
        run: mv .github/workflows/branch-verify.yml /tmp/branch-verify.yml

      - name: Test app with failure annotations
        shell: bash
        run: |
          set +e
          node --test --test-concurrency=1 --test-reporter=tap tests/*.test.js 2>&1 | tee /tmp/app-tests.tap
          code=${PIPESTATUS[0]}
          if (( code != 0 )); then
            while IFS= read -r line; do
              safe=${line//'%'/'%25'}
              safe=${safe//$'\r'/'%0D'}
              safe=${safe//$'\n'/'%0A'}
              echo "::error title=App test failure::$safe"
            done < <(grep -E '^not ok [0-9]+ - ' /tmp/app-tests.tap || true)
          fi
          exit "$code"
