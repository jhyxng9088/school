name: Apply unified modal and reminder motion fix

on:
  push:
    paths:
      - '.github/workflows/apply-unified-ui-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/scripts/apply_unified_ui_fix.py
      - name: Verify diff
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit verified fix
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/todo-stage5-ai.jsx src/main.jsx src/academic-shared.jsx src/todo.jsx src/todo-stage5.css src/academic-shared.css
          git commit -m "Unify school modals and stabilize reminder motion"
          git push
