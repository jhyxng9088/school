name: Apply UI cleanup

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ui-cleanup.mjs'
      - '.github/workflows/apply-ui-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded cleanup
        run: node scripts/ui-cleanup.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Check removed files stay unreferenced
        run: |
          for name in reminder-date-final.css school-appcheck-debug.js school-meal.css school-meal.js school-pwa-appcheck-bridge.js meal.js todo-stage5-v2.jsx todo-stage5.jsx; do
            if grep -RIn --exclude-dir=.git --exclude='ui-cleanup.mjs' "$name" index.html src public 2>/dev/null; then
              echo "Unexpected reference: $name"
              exit 1
            fi
          done
      - name: Commit validated cleanup
        run: |
          git config user.name 'school-pwa-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix image viewer reentry and clean UI copy' || exit 0
          git push
