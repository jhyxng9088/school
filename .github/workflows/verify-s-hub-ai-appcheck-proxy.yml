name: Verify S-Hub AI App Check proxy

on:
  push:
    branches:
      - fix/s-hub-ai-final-route

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded App Check proxy patch
        run: python3 tools/apply_s_hub_ai_appcheck_proxy.py

      - name: Remove temporary patch machinery
        run: |
          rm .github/workflows/verify-s-hub-ai-appcheck-proxy.yml
          rm tools/apply_s_hub_ai_appcheck_proxy.py
          rmdir tools

      - name: Verify repository shape
        run: |
          git diff --check
          test ! -e .github/workflows/verify-s-hub-ai-appcheck-proxy.yml
          test ! -d tools
          test ! -e push-backend-v2/api/ai-probe.js
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          grep -q "getDirectFirebaseSecurityHeaders" src/firebase-ai-direct.js
          grep -q "X-Firebase-AppCheck" src/s-hub-ai-transport.js
          grep -q "x-firebase-appcheck" push-backend-v2/api/s-hub-ai.js
          grep -q "Authorization: \`Firebase" push-backend-v2/lib/s-hub-ai-service.js
          grep -q "2500" src/s-hub-ai-sheet.jsx
          grep -q "school-shell-v144" public/sw.js

      - name: Install app dependencies
        run: npm ci

      - name: Test app
        run: npm test

      - name: Build app
        run: npm run build

      - name: Install backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Test backend
        working-directory: push-backend-v2
        run: npm test

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Proxy S-Hub AI App Check through backend [skip ci]"
          git push origin HEAD:fix/s-hub-ai-final-route
