name: iPad academic compositor migration v3

on:
  push:
    branches:
      - stability/ipad-academic-compositor-fix-20260905-v3
    paths:
      - .github/workflows/ipad-academic-compositor-migrate-v3.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability/ipad-academic-compositor-fix-20260905-v3
          fetch-depth: 0

      - name: Apply guarded source migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/main.jsx",
              """const MOBILE_BROWSER_COMPAT = /iPhone|iPod|Android|SamsungBrowser/i.test(navigator.userAgent)
          const SAMSUNG_BROWSER = /SamsungBrowser/i.test(navigator.userAgent)
          if (MOBILE_BROWSER_COMPAT) document.documentElement.classList.add('school-mobile-compat')
          if (SAMSUNG_BROWSER) document.documentElement.classList.add('school-samsung')
          """,
              """const MOBILE_BROWSER_COMPAT = /iPhone|iPod|Android|SamsungBrowser/i.test(navigator.userAgent)
          const SAMSUNG_BROWSER = /SamsungBrowser/i.test(navigator.userAgent)
          const IPAD_BROWSER_COMPAT = /\\biPad\\b/i.test(navigator.userAgent)
            || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
          if (MOBILE_BROWSER_COMPAT) document.documentElement.classList.add('school-mobile-compat')
          if (IPAD_BROWSER_COMPAT) document.documentElement.classList.add('school-ipad')
          if (SAMSUNG_BROWSER) document.documentElement.classList.add('school-samsung')
          """,
          )

          replace_once(
              "src/styles.css",
              """/* On iPhone the same compositor conflict was isolated to the academic page. */
          html.school-mobile-compat:not(.school-samsung) .app-content.tab-academic {
            animation: school-mobile-opacity-in 560ms cubic-bezier(0.16, 1, 0.3, 1) both;
            transform: none !important;
          }
          """,
              """/* On iPhone the same compositor conflict was isolated to the academic page. */
          html.school-mobile-compat:not(.school-samsung) .app-content.tab-academic {
            animation: school-mobile-opacity-in 560ms cubic-bezier(0.16, 1, 0.3, 1) both;
            transform: none !important;
          }

          /* Keep iPad academic content off the transformed compositor layer without broad mobile overrides. */
          html.school-ipad .app-content.tab-academic {
            animation: school-mobile-opacity-in 560ms cubic-bezier(0.16, 1, 0.3, 1) both;
            transform: none !important;
          }
          """,
          )

          test_path = Path("tests/mobile-layout-fixes.test.js")
          tests = test_path.read_text()
          marker = "iPad academic content avoids the transformed compositor layer without broad mobile compatibility"
          if marker in tests:
              raise SystemExit("iPad regression test already exists")
          tests += r'''

          test('iPad academic content avoids the transformed compositor layer without broad mobile compatibility', () => {
            const source = read('src/main.jsx')
            const styles = read('src/styles.css')

            assert.match(source, /const MOBILE_BROWSER_COMPAT = \/iPhone\|iPod\|Android\|SamsungBrowser\/i\.test\(navigator\.userAgent\)/)
            assert.ok(source.includes("const IPAD_BROWSER_COMPAT = /\\biPad\\b/i.test(navigator.userAgent)"))
            assert.match(source, /navigator\.platform === 'MacIntel' && navigator\.maxTouchPoints > 1/)
            assert.match(source, /if \(IPAD_BROWSER_COMPAT\) document\.documentElement\.classList\.add\('school-ipad'\)/)
            assert.match(styles, /html\.school-ipad \.app-content\.tab-academic \{[\s\S]*?animation: school-mobile-opacity-in 560ms[\s\S]*?transform: none !important;[\s\S]*?\}/)
          })
          '''
          test_path.write_text(tests)
          PY

      - name: Remove temporary migration workflow
        run: git rm .github/workflows/ipad-academic-compositor-migrate-v3.yml

      - name: Verify exact candidate paths
        shell: bash
        run: |
          actual="$(git diff HEAD --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/ipad-academic-compositor-migrate-v3.yml' \
            'src/main.jsx' \
            'src/styles.css' \
            'tests/mobile-layout-fixes.test.js' | sort)"
          test "$actual" = "$expected"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Commit clean stability candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx src/styles.css tests/mobile-layout-fixes.test.js
          git commit -m 'fix: isolate iPad academic compositor transform'
          git push origin HEAD:stability/ipad-academic-compositor-fix-20260905-v3
