name: Verify S-Hub AI auth repair

on:
  push:
    branches: [fix/s-hub-ai-auth]

permissions:
  contents: write

concurrency:
  group: verify-s-hub-ai-auth
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded auth repair
        run: python3 tools/fix_s_hub_ai_auth.py

      - name: Remove temporary repair machinery
        run: |
          rm .github/workflows/verify-s-hub-ai-auth.yml
          rm tools/fix_s_hub_ai_auth.py
          rmdir tools

      - name: Verify repository shape and auth path
        run: |
          git diff --check
          test ! -e .github/workflows/verify-s-hub-ai-auth.yml
          test ! -d tools
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          grep -q "DIRECT_APP_NAME = 'school-sync'" src/firebase-ai-direct.js
          grep -q 'Authorization = `Firebase ${idToken}`' src/firebase-ai-direct.js
          grep -q "X-Firebase-AppCheck" src/firebase-ai-direct.js
          grep -q "runSdkStructuredModel" src/firebase-ai-direct.js
          grep -q "runStructuredModel" src/firebase-ai-direct.js
          grep -q "school-shell-v142" public/sw.js

      - name: Install app dependencies
        run: npm ci

      - name: Test app
        run: npm test

      - name: Build app
        run: npm run build

      - name: Install reminder backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Test reminder backend
        working-directory: push-backend-v2
        run: npm test

      - name: Commit verified auth repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix S-Hub AI Firebase authentication [skip ci]"
          git push
