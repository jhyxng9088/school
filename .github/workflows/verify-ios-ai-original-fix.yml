name: Verify iOS AI and original image fix

on:
  push:
    branches:
      - fix/ios-ai-and-original-stability

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded fixes
        run: |
          python3 tools/apply_ios_ai_original_fix.py
          python3 tools/fix_original_prefetch_hook_order.py

      - name: Remove temporary verification machinery
        run: |
          rm .github/workflows/verify-ios-ai-original-fix.yml
          rm tools/apply_ios_ai_original_fix.py
          rm tools/fix_original_prefetch_hook_order.py
          rmdir tools

      - name: Verify final repository shape
        run: |
          git diff --check
          test ! -d tools
          test ! -e push-backend-v2/api/ai-gateway-probe.js
          test ! -e push-backend-v2/api/firebase-ai-admin-probe.js
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          grep -q "adminAppCheckToken(FIREBASE_APP_ID)" push-backend-v2/api/s-hub-ai.js
          grep -q "Authorization: \`Bearer" push-backend-v2/lib/s-hub-ai-service.js
          ! grep -q "X-Firebase-AppCheck" src/s-hub-ai-transport.js
          ! grep -q "school-ai-backend-ruby.vercel.app" src/firebase-ai.js
          ! grep -q "firebase-ai-direct.js" src/firebase-ai.js
          grep -q "originalAttachmentMemoryCache" src/school-sync.js
          grep -q "prepareOriginal(originalEntries\[0\])" src/reminder-summary.jsx
          grep -q "school-shell-v145" public/sw.js

      - name: Install app dependencies
        run: npm ci

      - name: Test app
        run: npm test

      - name: Build app
        run: npm run build

      - name: Install backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Test backend
        working-directory: push-backend-v2
        run: npm test

      - name: Commit verified final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Stabilize iOS AI and original image loading [skip ci]"
          git push origin HEAD:fix/ios-ai-and-original-stability
