name: Verify S-Hub AI server route

on:
  push:
    branches:
      - fix/s-hub-ai-server-route

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded server-route patch
        run: python3 tools/apply_s_hub_ai_server_fix.py

      - name: Remove temporary patch machinery
        run: |
          rm .github/workflows/verify-s-hub-ai-server-route.yml
          rm tools/apply_s_hub_ai_server_fix.py
          rmdir tools

      - name: Verify repository shape
        run: |
          git diff --check
          test ! -e .github/workflows/verify-s-hub-ai-server-route.yml
          test ! -d tools
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          grep -q "school-reminder-backend.vercel.app/api/s-hub-ai" src/s-hub-ai-transport.js
          grep -q "generateSchoolStructured" src/s-hub-ai.js
          ! grep -q "generateDirectStructured" src/s-hub-ai.js
          grep -q "1800" src/s-hub-ai-sheet.jsx
          grep -q "school-shell-v143" public/sw.js
          test -f push-backend-v2/api/s-hub-ai.js
          test -f push-backend-v2/lib/s-hub-ai-service.js

      - name: Install app dependencies
        run: npm ci

      - name: Test app
        run: npm test

      - name: Build app
        run: npm run build

      - name: Install backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Test backend
        working-directory: push-backend-v2
        run: npm test

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix S-Hub AI server route and rotating hints [skip ci]"
          git push origin HEAD:fix/s-hub-ai-server-route
