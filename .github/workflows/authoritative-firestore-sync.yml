name: Authoritative Firestore sync

on:
  push:
    paths:
      - '.github/workflows/authoritative-firestore-sync.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Make Firestore authoritative
        run: |
          node <<'NODE'
          const fs = require('fs')

          function replaceOnce(text, before, after, label) {
            const count = text.split(before).length - 1
            if (count !== 1) throw new Error(`${label}: expected 1 match, got ${count}`)
            return text.replace(before, after)
          }

          let todo = fs.readFileSync('src/todo.jsx', 'utf8')
          todo = replaceOnce(todo, "  migrateLegacyTodos,\n", "", 'remove migration import')
          todo = replaceOnce(
            todo,
            "        await migrateLegacyTodos(profile, legacyTodosRef.current)\n        if (disposed) return\n\n",
            "        if (disposed) return\n\n",
            'disable legacy reminder re-upload',
          )
          fs.writeFileSync('src/todo.jsx', todo)

          let sync = fs.readFileSync('src/school-sync.js', 'utf8')
          const oldMissing = `            if (!snapshot.exists()) {\n              writeInitialTimetable(profile, {\n                weeklySchedule: initialWeeklyRef.current,\n                overrides: initialOverridesRef.current,\n              }).catch((error) => console.error('Initial timetable sync failed:', error))\n              return\n            }`
          const newMissing = `            if (!snapshot.exists()) {\n              // Firestore is authoritative once cloud sync is enabled.\n              // Never recreate data that an administrator intentionally removed.\n              const nextWeekly = normalizeWeeklySchedule(null)\n              const nextOverrides = {}\n              saveWeeklySchedule(nextWeekly)\n              saveOverrides(nextOverrides)\n              setWeeklySchedule(nextWeekly)\n              setOverrides(nextOverrides)\n              return\n            }`
          sync = replaceOnce(sync, oldMissing, newMissing, 'authoritative missing timetable')
          fs.writeFileSync('src/school-sync.js', sync)

          const verifyTodo = fs.readFileSync('src/todo.jsx', 'utf8')
          const verifySync = fs.readFileSync('src/school-sync.js', 'utf8')
          if (verifyTodo.includes('await migrateLegacyTodos(profile')) throw new Error('legacy migration call still active')
          if (verifySync.includes("console.error('Initial timetable sync failed:'")) throw new Error('timetable auto-restore still active')
          if (!verifySync.includes('Firestore is authoritative once cloud sync is enabled.')) throw new Error('authority guard missing')
          NODE
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/todo.jsx src/school-sync.js
          git diff --cached --quiet && exit 0
          git commit -m "Make Firestore the authoritative data source"
          git push
