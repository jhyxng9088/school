name: Guarded interaction cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/refactor_interactions.py'
      - '.github/workflows/refactor-interactions.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair duplicated save-catch selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/refactor_interactions.py')
          source = path.read_text()
          helper_anchor = "def regex_once(path, pattern, replacement, flags=0):\n"
          helper = "def replace_first(path, old, new):\n    content = read(path)\n    if old not in content:\n        raise SystemExit(f'{path}: expected at least one match: {old[:120]!r}')\n    write(path, content.replace(old, new, 1))\n\n\n"
          if helper not in source:
              if helper_anchor not in source:
                  raise SystemExit('regex helper anchor missing')
              source = source.replace(helper_anchor, helper + helper_anchor, 1)

          marker = "replace_once(\n    'src/todo-stage5-ai.jsx',\n    '''      console.error('Shared reminder save failed:', error)"
          replacement = "replace_first(\n    'src/todo-stage5-ai.jsx',\n    '''      console.error('Shared reminder save failed:', error)"
          if marker not in source:
              raise SystemExit('natural save catch marker missing')
          source = source.replace(marker, replacement, 1)
          path.write_text(source)
          PY

      - name: Apply guarded refactor
        run: python3 .github/scripts/refactor_interactions.py

      - name: Verify diff
        run: git diff --check

      - name: Install app dependencies
        run: npm ci

      - name: Run app regression tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Install reminder backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Run reminder backend tests
        working-directory: push-backend-v2
        run: npm test

      - name: Show final scope
        run: git status --short

      - name: Commit only after every check passes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden mobile interactions and clean repository"
          git push
