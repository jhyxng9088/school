name: Guarded interaction cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/refactor_interactions.py'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded refactor
        run: python3 .github/scripts/refactor_interactions.py

      - name: Verify diff
        run: git diff --check

      - name: Install app dependencies
        run: npm ci

      - name: Run app regression tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Install reminder backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Run reminder backend tests
        working-directory: push-backend-v2
        run: npm test

      - name: Show final scope
        run: git status --short

      - name: Commit only after every check passes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden mobile interactions and clean repository"
          git push
