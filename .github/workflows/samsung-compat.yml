name: Samsung compatibility
on:
  push:
    paths:
      - '.github/workflows/samsung-compat.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/samsung-compat.mjs
      - run: npm install
      - run: npm run build
      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/reminder-sheet.js public/school-sheet.js public/school-timetable-motion.js public/school-home-live.js src/todo-stage5-ai.jsx public/sw.js
          git commit -m 'Stabilize Samsung Internet interactions'
          git push
