name: Harden iOS title AI

on:
  push:
    paths:
      - '.github/workflows/harden_ios_title_ai.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply iOS title AI hardening
        run: python3 .github/scripts/harden_ios_title_ai.py
      - name: Verify diff
        run: git diff --check
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/firebase-ai-direct.js
          git commit -m "Harden title AI for iOS standalone PWA" || exit 0
          git push
