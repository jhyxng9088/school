name: Verify S-Hub AI orb v150

on:
  push:
    branches:
      - fix/s-hub-ai-orb-smooth-v150

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded orb refinement
        run: |
          python3 .github/scripts/fix_orb_v150_guard.py
          python3 .github/scripts/refine_orb_smooth_v150.py

      - name: Remove temporary verification machinery
        run: |
          rm .github/workflows/verify-s-hub-ai-orb-v150.yml
          rm .github/scripts/refine_orb_smooth_v150.py
          rm .github/scripts/fix_orb_v150_guard.py
          rmdir .github/scripts 2>/dev/null || true

      - name: Verify final repository shape and visual invariants
        run: |
          git diff --check
          test ! -e .github/workflows/verify-s-hub-ai-orb-v150.yml
          test ! -d .github/scripts
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          grep -q "<SHubAIOrb size={27}" src/main.jsx
          grep -q "<SHubAIOrb size={56} active" src/s-hub-ai-sheet.jsx
          grep -q "time - lastDraw < 16" src/s-hub-ai-orb.jsx
          grep -q "smootherstep" src/s-hub-ai-orb.jsx
          grep -q "scale(0.32)" src/s-hub-ai.css
          grep -q "s-hub-ai-result-reveal 560ms" src/s-hub-ai.css
          grep -q "school-shell-v150" public/sw.js

      - name: Install app dependencies
        run: npm ci

      - name: Test app
        run: npm test

      - name: Build app
        run: npm run build

      - name: Install backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Test backend
        working-directory: push-backend-v2
        run: npm test

      - name: Commit verified clean tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Smooth and brighten S-Hub AI orb [skip ci]"
          git push origin HEAD:fix/s-hub-ai-orb-smooth-v150
