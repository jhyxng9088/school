name: Verify notification prompt entry behavior

on:
  push:
    branches: [fix/push-prompt-every-entry-20260828]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/push-prompt-every-entry-20260828
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded patch
        run: python .github/patches/push-prompt-every-entry.py

      - name: Remove temporary verification files
        run: |
          rm .github/patches/push-prompt-every-entry.py
          rm .github/workflows/verify-push-prompt-every-entry.yml

      - name: Install app dependencies
        run: npm ci

      - name: Test app
        run: npm test

      - name: Build app
        run: npm run build

      - name: Commit verified tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Show notification permission prompt on every app entry [skip ci]'
          git push origin HEAD:fix/push-prompt-every-entry-20260828
