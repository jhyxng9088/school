name: Apply attachment summary

on:
  push:
    paths:
      - 'scripts/apply-attachment-summary.mjs'
      - 'scripts/apply-attachment-summary-trigger.txt'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: node scripts/apply-attachment-summary.mjs
      - run: npm install
      - run: npm run build
      - run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-school-sync "echo rules-ok"
      - name: Commit verified migration
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/todo.jsx src/school-sync.js src/todo-stage5-ai.jsx src/reminder-summary.jsx src/reminder-summary.css src/firebase-ai.js firestore.rules public/sw.js
          git commit -m "Add Gemini attachment summaries and expandable sheet"
          git push
