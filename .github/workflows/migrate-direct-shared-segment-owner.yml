name: Migrate direct shared segment owner

on:
  push:
    branches:
      - work/direct-shared-segment-owner-20260906

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: work/direct-shared-segment-owner-20260906
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate shared segment ownership upstream
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          path = Path('src/preview-class-top-segment-patch.js')
          text = path.read_text()
          helper = "\n\nconst SHARED_SEGMENT_IMPORT = \"import { useSHubSegmentSpring } from './s-hub-segment-spring.js'\"\n\nfunction ensureSharedSegmentImport(source) {\n  const current = String(source || '')\n  if (current.includes(SHARED_SEGMENT_IMPORT)) return current\n  if (!current.startsWith('import React')) throw new Error('Preview class top segment drift: React import must remain first')\n  const lineEnd = current.indexOf('\\n')\n  if (lineEnd < 0) throw new Error('Preview class top segment drift: React import line missing')\n  return `${current.slice(0, lineEnd + 1)}${SHARED_SEGMENT_IMPORT}\\n${current.slice(lineEnd + 1)}`\n}\n"
          text = one(text, "\n\nconst CLASS_TOP_SEGMENT_CSS = `", helper + "\nconst CLASS_TOP_SEGMENT_CSS = `", 'class import helper')
          start = text.find('function useClassTopSegmentSpring(activeIndex) {')
          end = text.find('\n\nfunction ClassTopSegment', start)
          if start < 0 or end < 0:
              raise SystemExit('class spring boundary missing')
          wrapper = "function useClassTopSegmentSpring(activeIndex) {\n  return useSHubSegmentSpring(activeIndex, {\n    paddingProperty: '--segment-padding',\n    shellScaleProperty: '--segment-shell-scale-x',\n    shellShiftProperty: '--segment-shell-shift-x',\n    fallbackPadding: 5,\n  })\n}"
          text = text[:start] + wrapper + text[end:]
          text = one(text, "          key={item.id}\n          type=\"button\"\n          className={'class-top-segment-button ' + (section === item.id ? 'is-active' : '')}", "          key={item.id}\n          type=\"button\"\n          data-unread-key={item.id}\n          className={'class-top-segment-button ' + (section === item.id ? 'is-active' : '')}", 'class unread key')
          text = one(text, "function patchMainSource(source) {\n  let next = String(source || '')", "function patchMainSource(source) {\n  let next = ensureSharedSegmentImport(String(source || ''))", 'class shared import')
          path.write_text(text)

          path = Path('src/preview-study-patch.js')
          text = path.read_text()
          text = one(text, "import { PREVIEW_CLASS_SEGMENT_PHYSICS } from './preview-class-top-segment-patch.js'\n\n", '', 'study physics import')
          helper = "const SHARED_SEGMENT_IMPORT = \"import { useSHubSegmentSpring } from './s-hub-segment-spring.js'\"\n\nfunction ensureSharedSegmentImport(source) {\n  const current = String(source || '')\n  if (current.includes(SHARED_SEGMENT_IMPORT)) return current\n  if (!current.startsWith('import React')) throw new Error('Preview study patch drift: React import must remain first')\n  const lineEnd = current.indexOf('\\n')\n  if (lineEnd < 0) throw new Error('Preview study patch drift: React import line missing')\n  return `${current.slice(0, lineEnd + 1)}${SHARED_SEGMENT_IMPORT}\\n${current.slice(lineEnd + 1)}`\n}\n\n"
          text = helper + text
          start = text.find('const STUDY_RANKING_SPRING_RUNTIME = String.raw`')
          end = text.find('const STUDY_RANKING_SPRING_CSS = String.raw`', start)
          if start < 0 or end < 0:
              raise SystemExit('study spring boundary missing')
          wrapper = "const STUDY_RANKING_SPRING_RUNTIME = String.raw`\nfunction useStudyRankingScopeSpring(activeIndex) {\n  return useSHubSegmentSpring(activeIndex, {\n    paddingProperty: '--study-ranking-padding',\n    shellScaleProperty: '--study-ranking-shell-scale-x',\n    shellShiftProperty: '--study-ranking-shell-shift-x',\n    fallbackPadding: 4,\n  })\n}\n\n`\n\n"
          text = text[:start] + wrapper + text[end:]
          text = one(text, "function patchStudyRankingPageSource(source) {\n  let next = String(source || '')\n  if (next.includes('function useStudyRankingScopeSpring(activeIndex)')) return next", "function patchStudyRankingPageSource(source) {\n  let next = ensureSharedSegmentImport(String(source || ''))\n  if (next.includes('function useStudyRankingScopeSpring(activeIndex)')) return next", 'study shared import')
          layout_block = "\n  next = replaceRequired(\n    next,\n    \"import React, { useCallback, useEffect, useMemo, useRef, useState } from 'react'\",\n    \"import React, { useCallback, useEffect, useLayoutEffect, useMemo, useRef, useState } from 'react'\",\n    'study ranking layout effect import',\n  )\n"
          text = one(text, layout_block, '', 'study layout effect injection')
          path.write_text(text)

          path = Path('vite.config.js')
          text = path.read_text()
          text = one(text, "import { patchSharedSegmentSpringOwnerSource } from './src/shared-segment-spring-owner-patch.js'\n", '', 'vite owner import')
          text = one(text, "  next = patchSharedSegmentSpringOwnerSource(next, cleanId)\n", '', 'vite owner call')
          text = one(text, "        || cleanId.endsWith('/shared-segment-spring-owner-patch.js')\n", '', 'vite polite exclusion')
          path.write_text(text)
          PY

          git rm src/shared-segment-spring-owner-patch.js
          git rm .github/workflows/migrate-direct-shared-segment-owner.yml

          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/migrate-direct-shared-segment-owner.yml',
              'src/preview-class-top-segment-patch.js',
              'src/preview-study-patch.js',
              'src/shared-segment-spring-owner-patch.js',
              'vite.config.js',
          }
          changed = set(subprocess.check_output(['git', 'diff', 'HEAD', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected migration paths: {sorted(changed)}')
          PY

      - name: Test production app
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Commit clean migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: remove final shared segment build owner'
          git push origin HEAD:work/direct-shared-segment-owner-20260906
