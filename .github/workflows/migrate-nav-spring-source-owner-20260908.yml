name: Migrate nav spring source owner 20260908

on:
  push:
    branches:
      - work/nav-spring-source-owner-20260908

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: work/nav-spring-source-owner-20260908
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Capture current production build
        run: |
          npm run build
          rm -rf /tmp/s-hub-nav-spring-before
          cp -a dist /tmp/s-hub-nav-spring-before

      - name: Source-own nav spring behavior
        run: |
          node scripts/migrate-nav-spring-source-owner-20260908.mjs
          node scripts/retarget-nav-spring-tests-20260908.mjs

      - name: Remove retired and temporary owners
        run: |
          rm src/preview-nav-spring-patch.js
          rm scripts/migrate-nav-spring-source-owner-20260908.mjs
          rm scripts/retarget-nav-spring-tests-20260908.mjs
          rm .github/workflows/migrate-nav-spring-source-owner-20260908.yml

      - name: Verify changed-file boundary
        run: |
          git diff --check
          git diff --name-only | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          .github/workflows/migrate-nav-spring-source-owner-20260908.yml
          scripts/migrate-nav-spring-source-owner-20260908.mjs
          scripts/retarget-nav-spring-tests-20260908.mjs
          src/main.jsx
          src/preview-nav-spring-patch.js
          src/styles.css
          tests/build-patch-effect.test.js
          tests/preview-board.test.js
          tests/preview-class-top-segment.test.js
          tests/preview-nav-responsiveness.test.js
          tests/preview-nested-geometry-coupling.test.js
          tests/preview-physical-class-coupling.test.js
          tests/preview-unified-station-physics.test.js
          vite.config.js
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Verify complete production build equivalence
        run: |
          rm -rf dist
          npm run build
          diff -qr /tmp/s-hub-nav-spring-before dist

      - name: Test production app
        run: npm test

      - name: Test production backend
        run: |
          npm --prefix server ci
          npm --prefix server test

      - name: Commit clean migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: source-own nav spring behavior"
          git push origin HEAD:work/nav-spring-source-owner-20260908
