name: Identity Source Migration Bootstrap

on:
  push:
    branches:
      - work/student-identity-source-owner-20260905
    paths:
      - .github/workflows/identity-source-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/student-identity-source-owner-20260905
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Move identity recovery into source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          def replace_once_in_range(text, start_marker, end_marker, old, new, label):
              if text.count(start_marker) != 1:
                  raise SystemExit(f'{label}: expected one range start, found {text.count(start_marker)}')
              start = text.index(start_marker)
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'{label}: range end not found after start')
              segment = text[start:end]
              segment = replace_once(segment, old, new, label)
              return text[:start] + segment + text[end:]

          sync_path = Path('src/school-sync.js')
          sync = sync_path.read_text()

          sync = replace_once(
              sync,
              """let authPromise = null
          const identitySyncPromises = new Map()""",
              """let authPromise = null
          const identitySyncPromises = new Map()
          const STUDENT_IDENTITY_SYNC_KEY = 'school.studentIdentitySync.v1'

          function identitySyncMarkerMatches(cacheKey) {
            try {
              return localStorage.getItem(STUDENT_IDENTITY_SYNC_KEY) === cacheKey
            } catch {
              return false
            }
          }

          function rememberIdentitySync(cacheKey) {
            try {
              localStorage.setItem(STUDENT_IDENTITY_SYNC_KEY, cacheKey)
            } catch {
              // The in-memory promise still prevents duplicate checks for this session.
            }
          }

          function transientIdentityReadError(error) {
            const rawCode = String(error?.code || '')
            const code = rawCode.startsWith('firestore/') ? rawCode.slice('firestore/'.length) : rawCode
            return code === 'resource-exhausted' || code === 'unavailable' || code === 'deadline-exceeded'
          }""",
              'identity helpers',
          )

          sync = replace_once(
              sync,
              """  const cacheKey = `${user.uid}|${signature}`
            if (!identitySyncPromises.has(cacheKey)) {""",
              """  const cacheKey = `${user.uid}|${signature}`
            if (identitySyncMarkerMatches(cacheKey)) return user

            if (!identitySyncPromises.has(cacheKey)) {""",
              'persistent identity marker check',
          )

          sync = replace_once(
              sync,
              """      const identity = doc(db, 'users', user.uid)
                const snapshot = await getDoc(identity)""",
              """      const identity = doc(db, 'users', user.uid)
                let snapshot
                try {
                  snapshot = await getDoc(identity)
                } catch (error) {
                  if (transientIdentityReadError(error)) {
                    console.warn('Student identity verification temporarily unavailable; continuing with existing auth session.', error)
                    return user
                  }
                  throw error
                }""",
              'transient identity lookup fallback',
          )

          sync = replace_once_in_range(
              sync,
              "      if (!snapshot.exists()) {",
              "      const existing = snapshot.data() || {}",
              "        })\n        return user",
              "        })\n        rememberIdentitySync(cacheKey)\n        return user",
              'identity create marker',
          )

          sync = replace_once_in_range(
              sync,
              "      const existing = snapshot.data() || {}",
              "    })().catch((error) => {",
              "      }\n      return user",
              "      }\n      rememberIdentitySync(cacheKey)\n      return user",
              'identity verified marker',
          )
          sync_path.write_text(sync)

          recovery_path = Path('src/production-recovery-patch.js')
          recovery = recovery_path.read_text()

          replace_start = 'function replaceExact(source, marker, replacement, label) {'
          replace_end = 'function patchTodoSectionSubmit(source) {'
          if recovery.count(replace_start) != 1 or recovery.count(replace_end) != 1:
              raise SystemExit('replaceExact retirement markers drifted')
          start = recovery.index(replace_start)
          end = recovery.index(replace_end)
          recovery = recovery[:start] + recovery[end:]

          identity_start = 'function patchStudentIdentitySync(source) {'
          identity_end = 'export function patchProductionRecoverySource(source, id) {'
          if recovery.count(identity_start) != 1 or recovery.count(identity_end) != 1:
              raise SystemExit('student identity recovery retirement markers drifted')
          start = recovery.index(identity_start)
          end = recovery.index(identity_end)
          recovery = recovery[:start] + recovery[end:]

          recovery = replace_once(
              recovery,
              "  if (cleanId.endsWith('/src/school-sync.js')) return patchStudentIdentitySync(source)\n",
              '',
              'school-sync recovery route',
          )
          recovery_path.write_text(recovery)

          test_path = Path('tests/production-recovery-regression.test.js')
          tests = test_path.read_text()
          tests = replace_once(
              tests,
              '  assert.match(recovery, /patchStudentIdentitySync/)\n',
              '  assert.doesNotMatch(recovery, /patchStudentIdentitySync/)\n',
              'stale home-presence recovery assertion',
          )

          identity_test_start = "test('student identity sync survives transient Firestore outages without weakening hard identity mismatches', () => {"
          if tests.count(identity_test_start) != 1:
              raise SystemExit(f'identity test marker: expected 1 occurrence, found {tests.count(identity_test_start)}')
          start = tests.index(identity_test_start)
          canonical_test = r"""test('student identity sync is source-owned and recovery no longer rewrites school-sync', () => {
            const raw = read('src/school-sync.js')
            const source = recover('src/school-sync.js')
            const recovery = read('src/production-recovery-patch.js')
            assert.equal(source, raw)
            assert.match(raw, /STUDENT_IDENTITY_SYNC_KEY = 'school\.studentIdentitySync\.v1'/)
            assert.match(raw, /identitySyncMarkerMatches\(cacheKey\)/)
            assert.match(raw, /code === 'resource-exhausted' \|\| code === 'unavailable' \|\| code === 'deadline-exceeded'/)
            assert.match(raw, /if \(transientIdentityReadError\(error\)\) \{[\s\S]*?return user/)
            assert.match(raw, /rememberIdentitySync\(cacheKey\)/)
            assert.match(raw, /저장된 학생 정보와 로그인 정보가 달라/)
            assert.doesNotMatch(raw.slice(raw.indexOf('function transientIdentityReadError'), raw.indexOf('async function ensureStoredProfileIdentity')), /permission-denied/)
            assert.doesNotMatch(recovery, /patchStudentIdentitySync/)
            assert.doesNotMatch(recovery, /endsWith\('\/src\/school-sync\.js'\)/)
            assert.match(recovery, /patchTodoSectionSubmit/)
          })
          """
          tests = tests[:start] + canonical_test
          test_path.write_text(tests)
          PY

      - name: Verify candidate before commit
        shell: bash
        run: |
          git diff --check
          npm ci
          npm test

      - name: Commit migrated source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/school-sync.js src/production-recovery-patch.js tests/production-recovery-regression.test.js
          git diff --cached --quiet && exit 1
          git commit -m 'refactor: make student identity sync source-owned'
          git push origin HEAD:work/student-identity-source-owner-20260905
