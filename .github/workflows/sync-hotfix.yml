name: Apply realtime sync fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-hotfix.mjs'
      - '.github/workflows/sync-hotfix.yml'

permissions:
  contents: write

concurrency:
  group: school-sync-hotfix
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded sync patch
        run: node scripts/sync-hotfix.mjs

      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Verify sync contract
        run: |
          grep -q 'LOCAL_TODO_STATE_VERSION' src/todo.jsx
          ! grep -q 'listenStudentTodoState' src/todo.jsx
          ! grep -q 'writeStudentTodoState(profile' src/todo.jsx
          grep -q 'await writeSharedTodo(profile, todo)' src/todo.jsx
          grep -q 'await writeWeeklyScheduleCloud(profile, normalized)' src/school-sync.js
          grep -q 'await writeOverridesCloud(profile, normalized)' src/school-sync.js
          grep -q 'school-shell-v94' public/sw.js

      - name: Remove temporary patch helpers
        run: |
          rm -f scripts/sync-hotfix.mjs
          rm -f .github/workflows/sync-hotfix.yml
          rm -f scripts/final-polish.mjs
          rm -f .github/workflows/final-polish.yml

      - name: Commit validated changes
        run: |
          git config user.name 'school-pwa-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix realtime school data synchronization' || exit 0
          git push
