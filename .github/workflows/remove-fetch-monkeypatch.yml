name: Remove global fetch monkeypatch
on:
  push:
    paths: ['.github/workflows/remove-fetch-monkeypatch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Patch
        run: |
          node <<'NODE'
          const fs=require('fs')
          function once(s,a,b,n){const c=s.split(a).length-1;if(c!==1)throw new Error(n+': '+c);return s.replace(a,b)}
          let s=fs.readFileSync('src/stage3-core.js','utf8')
          s=once(s,"const WEEKDAY_LABELS = ['일', '월', '화', '수', '목', '금', '토']\n",`const WEEKDAY_LABELS = ['일', '월', '화', '수', '목', '금', '토']\nconst MOCK_EXAMS = [\n  { rawDate: '20260324', name: '3월 전국연합학력평가', content: '고2 · 서울특별시교육청 주관' },\n  { rawDate: '20260604', name: '6월 전국연합학력평가', content: '고2 · 부산광역시교육청 주관' },\n  { rawDate: '20260902', name: '9월 전국연합학력평가', content: '고2 · 인천광역시교육청 주관' },\n  { rawDate: '20261020', name: '10월 전국연합학력평가', content: '고2 · 경기도교육청 주관' },\n]\n`,'mock const')
          s=once(s,"  if (!normalized.length) throw new Error('2학년 학사일정을 찾지 못했어.')\n  return normalized\n",`  const fromRaw = rawDate(fromDate)\n  const toRaw = rawDate(toDate)\n  for (const exam of MOCK_EXAMS) {\n    if (exam.rawDate < fromRaw || exam.rawDate > toRaw) continue\n    const duplicate = normalized.some((event) => event.rawDate === exam.rawDate && /전국연합|학력평가|모의고사/.test(event.name))\n    if (!duplicate) normalized.push({ ...exam, date: dateFromRaw(exam.rawDate), dayOffType: '해당없음', relevantToSecondGrade: true })\n  }\n  normalized.sort((a, b) => a.rawDate.localeCompare(b.rawDate) || a.name.localeCompare(b.name))\n  if (!normalized.length) throw new Error('2학년 학사일정을 찾지 못했어.')\n  return normalized\n`,'merge mocks')
          fs.writeFileSync('src/stage3-core.js',s)
          let h=fs.readFileSync('index.html','utf8')
          h=once(h,'    <script src="./school-academic-supplement.js"></script>\n','', 'remove script')
          fs.writeFileSync('index.html',h)
          let sw=fs.readFileSync('public/sw.js','utf8')
          sw=sw.replace("'./school-academic-supplement.js', ",'').replace("school-shell-v90","school-shell-v91")
          if(sw.includes('school-academic-supplement.js')) throw new Error('supplement still cached')
          fs.writeFileSync('public/sw.js',sw)
          NODE
      - run: npm install
      - run: npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm public/school-academic-supplement.js
          git add src/stage3-core.js index.html public/sw.js
          git commit -m 'Remove global fetch monkeypatch and harden browser compatibility'
          git push