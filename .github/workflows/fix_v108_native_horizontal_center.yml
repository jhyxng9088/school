name: Fix v108 native horizontal centering

on:
  push:
    paths:
      - '.github/workflows/fix_v108_native_horizontal_center.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patch
        run: python3 .github/scripts/fix_v108_native_horizontal_center.py
      - name: Verify diff
        run: git diff --check
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Verify required markers
        run: |
          grep -q 'todo-native-control-value' src/todo-stage5-ai.jsx
          grep -q 'timetable-native-date-value' src/main.jsx
          grep -q 'opacity: 0' src/todo.css
          grep -q 'opacity: 0 !important' src/timetable.css
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/todo-stage5-ai.jsx src/todo.css src/main.jsx src/timetable.css
          git commit -m "Center native date and time values reliably" || exit 0
          git push
