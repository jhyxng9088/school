name: Apply final hardening

on:
  push:
    paths:
      - 'scripts/apply-final-hardening.mjs'
      - 'scripts/apply-final-hardening-trigger.txt'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: node scripts/apply-final-hardening.mjs
      - run: npm install
      - run: npm run build
      - run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-school-sync "echo rules-ok"
      - name: Commit verified hardening
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/school-sync.js src/firebase-ai.js src/reminder-summary.css firestore.rules public/sw.js
          git commit -m "Harden class presence and iPhone attachment handling"
          git push
