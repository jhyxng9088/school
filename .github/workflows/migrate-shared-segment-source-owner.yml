name: Migrate shared segment source owner

on:
  push:
    branches:
      - work/shared-segment-source-owner-20260905

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: work/shared-segment-source-owner-20260905
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate shared segment ownership upstream
        run: python scripts/migrate-shared-segment-source-owner.py

      - name: Remove temporary migration files
        run: |
          git rm src/shared-segment-spring-owner-patch.js
          git rm scripts/migrate-shared-segment-source-owner.py
          git rm .github/workflows/migrate-shared-segment-source-owner.yml

      - name: Verify exact migration scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/migrate-shared-segment-source-owner.yml',
              'scripts/migrate-shared-segment-source-owner.py',
              'src/preview-class-top-segment-patch.js',
              'src/preview-study-patch.js',
              'src/shared-segment-spring-owner-patch.js',
              'tests/shared-segment-spring-owner.test.js',
              'vite.config.js',
          }
          changed = set(subprocess.check_output(['git', 'diff', 'HEAD', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected migration paths: {sorted(changed)}')
          PY

      - name: Test production app
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Commit clean migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: retire final shared segment patch owner'
          git push origin HEAD:work/shared-segment-source-owner-20260905
