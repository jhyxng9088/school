name: Migrate shared segment source owner

on:
  push:
    branches:
      - work/shared-segment-source-owner-20260905

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: work/shared-segment-source-owner-20260905
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate shared segment ownership upstream
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          class_path = Path('src/preview-class-top-segment-patch.js')
          class_source = class_path.read_text()
          func_start = class_source.index('function useClassTopSegmentSpring(activeIndex) {', class_source.index('const CLASS_SEGMENT_COMPONENT'))
          func_end = class_source.index('\nfunction ClassTopSegment({ section, onSectionChange }) {', func_start)
          class_wrapper = '''function useClassTopSegmentSpring(activeIndex) {
  return useSHubSegmentSpring(activeIndex, {
    paddingProperty: '--segment-padding',
    shellScaleProperty: '--segment-shell-scale-x',
    shellShiftProperty: '--segment-shell-shift-x',
    fallbackPadding: 5,
  })
}
'''
          class_source = class_source[:func_start] + class_wrapper + class_source[func_end:]
          class_source = replace_once(
              class_source,
              '''          key={item.id}\n          type="button"\n          className={'class-top-segment-button ' + (section === item.id ? 'is-active' : '')}''',
              '''          key={item.id}\n          type="button"\n          data-unread-key={item.id}\n          className={'class-top-segment-button ' + (section === item.id ? 'is-active' : '')}''',
              'class unread key',
          )
          patch_main_marker = "function patchMainSource(source) {\n  let next = String(source || '')\n"
          patch_main_replacement = patch_main_marker + '''
  if (!next.includes("from './s-hub-segment-spring.js'")) {
    next = replaceRequired(
      next,
      "import { SHubIcon } from './s-hub-icon.jsx'\\n",
      "import { SHubIcon } from './s-hub-icon.jsx'\\nimport { useSHubSegmentSpring } from './s-hub-segment-spring.js'\\n",
      'shared segment spring import',
    )
  }
'''
          class_source = replace_once(class_source, patch_main_marker, patch_main_replacement, 'class shared spring import')
          class_path.write_text(class_source)

          study_path = Path('src/preview-study-patch.js')
          study = study_path.read_text()
          study = replace_once(
              study,
              "import { PREVIEW_CLASS_SEGMENT_PHYSICS } from './preview-class-top-segment-patch.js'\n\n",
              '',
              'study duplicated physics import',
          )
          runtime_start = study.index('const STUDY_RANKING_SPRING_RUNTIME = String.raw`')
          runtime_end = study.index('const STUDY_RANKING_SPRING_CSS = String.raw`', runtime_start)
          study_runtime = '''const STUDY_RANKING_SPRING_RUNTIME = String.raw`
function useStudyRankingScopeSpring(activeIndex) {
  return useSHubSegmentSpring(activeIndex, {
    paddingProperty: '--study-ranking-padding',
    shellScaleProperty: '--study-ranking-shell-scale-x',
    shellShiftProperty: '--study-ranking-shell-shift-x',
    fallbackPadding: 4,
  })
}

`

'''
          study = study[:runtime_start] + study_runtime + study[runtime_end:]
          old_import_patch = '''  next = replaceRequired(
    next,
    "import React, { useCallback, useEffect, useMemo, useRef, useState } from 'react'",
    "import React, { useCallback, useEffect, useLayoutEffect, useMemo, useRef, useState } from 'react'",
    'study ranking layout effect import',
  )
'''
          new_import_patch = '''  if (!next.includes("from './s-hub-segment-spring.js'")) {
    next = replaceRequired(
      next,
      "import React, { useCallback, useEffect, useMemo, useRef, useState } from 'react'",
      "import React, { useCallback, useEffect, useMemo, useRef, useState } from 'react'\\nimport { useSHubSegmentSpring } from './s-hub-segment-spring.js'",
      'study ranking shared spring import',
    )
  }
'''
          study = replace_once(study, old_import_patch, new_import_patch, 'study shared spring import')
          study_path.write_text(study)

          vite_path = Path('vite.config.js')
          vite = vite_path.read_text()
          vite = replace_once(vite, "import { patchSharedSegmentSpringOwnerSource } from './src/shared-segment-spring-owner-patch.js'\n", '', 'vite shared segment import')
          vite = replace_once(vite, '  next = patchSharedSegmentSpringOwnerSource(next, cleanId)\n', '', 'vite shared segment call')
          vite = replace_once(vite, "        || cleanId.endsWith('/shared-segment-spring-owner-patch.js')\n", '', 'vite shared segment exclusion')
          vite_path.write_text(vite)

          test_path = Path('tests/shared-segment-spring-owner.test.js')
          test_path.write_text('''import fs from 'node:fs'\nimport test from 'node:test'\nimport assert from 'node:assert/strict'\nimport { PREVIEW_CLASS_SEGMENT_PHYSICS } from '../src/preview-class-top-segment-patch.js'\nimport { S_HUB_SEGMENT_SPRING_PHYSICS } from '../src/s-hub-segment-spring.js'\n\nconst read = (path) => fs.readFileSync(new URL(`../${path}`, import.meta.url), 'utf8')\n\ntest('shared segment spring preserves the existing class physics values', () => {\n  assert.deepEqual(S_HUB_SEGMENT_SPRING_PHYSICS, PREVIEW_CLASS_SEGMENT_PHYSICS)\n})\n\ntest('class segment generator directly emits the shared spring wrapper and unread key', () => {\n  const source = read('src/preview-class-top-segment-patch.js')\n  assert.match(source, /useSHubSegmentSpring\\(activeIndex, \\{/)\n  assert.match(source, /paddingProperty: '--segment-padding'/)\n  assert.match(source, /fallbackPadding: 5/)\n  assert.match(source, /data-unread-key=\\{item\\.id\\}/)\n  assert.match(source, /import \\{ useSHubSegmentSpring \\} from '\\.\\/s-hub-segment-spring\\.js'/)\n  assert.doesNotMatch(source, /physicsRef = useRef/)\n})\n\ntest('study ranking generator directly emits the same shared spring wrapper', () => {\n  const source = read('src/preview-study-patch.js')\n  assert.match(source, /useSHubSegmentSpring\\(activeIndex, \\{/)\n  assert.match(source, /paddingProperty: '--study-ranking-padding'/)\n  assert.match(source, /fallbackPadding: 4/)\n  assert.match(source, /useSHubSegmentSpring \\} from '\\.\\/s-hub-segment-spring\\.js'/)\n  assert.doesNotMatch(source, /PREVIEW_CLASS_SEGMENT_PHYSICS/)\n  assert.doesNotMatch(source, /physicsRef = useRef/)\n})\n\ntest('schedule continues to reuse the class segment spring wrapper', () => {\n  const schedulePatch = read('src/preview-schedule-top-segment-patch.js')\n  assert.match(schedulePatch, /const spring = useClassTopSegmentSpring\\(activeIndex\\)/)\n  assert.doesNotMatch(schedulePatch, /function useScheduleTopSegmentSpring/)\n})\n\ntest('the retired final shared segment owner is absent from the Vite chain', () => {\n  const vite = read('vite.config.js')\n  assert.doesNotMatch(vite, /patchSharedSegmentSpringOwnerSource/)\n  assert.doesNotMatch(vite, /shared-segment-spring-owner-patch\\.js/)\n  assert.equal(fs.existsSync(new URL('../src/shared-segment-spring-owner-patch.js', import.meta.url)), false)\n})\n''')
          PY

          git rm src/shared-segment-spring-owner-patch.js
          git rm .github/workflows/migrate-shared-segment-source-owner.yml

          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/migrate-shared-segment-source-owner.yml',
              'src/preview-class-top-segment-patch.js',
              'src/preview-study-patch.js',
              'src/shared-segment-spring-owner-patch.js',
              'tests/shared-segment-spring-owner.test.js',
              'vite.config.js',
          }
          changed = set(subprocess.check_output(['git', 'diff', 'HEAD', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected migration paths: {sorted(changed)}')
          PY

      - name: Test production app
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Commit clean migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: retire final shared segment patch owner'
          git push origin HEAD:work/shared-segment-source-owner-20260905
