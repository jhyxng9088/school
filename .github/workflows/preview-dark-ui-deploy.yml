name: Deploy Dark UI Preview

on:
  push:
    branches:
      - preview/s-hub-v2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: school-dark-ui-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-source

      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/s-hub-v2
          path: preview-source

      - name: Capture production baseline
        run: echo "PRODUCTION_BASELINE_SHA=$(git -C production-source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            production-source/package-lock.json
            preview-source/package-lock.json

      - name: Install, test, and build production baseline
        working-directory: production-source
        run: |
          npm ci
          npm test
          npm run build

      - name: Confirm preview application source matches main
        run: |
          set -euo pipefail
          diff -qr \
            --exclude=.git \
            --exclude=.github \
            production-source preview-source
          cmp production-source/package-lock.json preview-source/package-lock.json
          rm -rf preview-source/node_modules
          cp -a production-source/node_modules preview-source/node_modules

      - name: Generate preview-only dark UI layer
        working-directory: preview-source
        run: |
          cat > public/preview-dark-ui.css <<'CSS'
          /*
           * S-Hub dark UI preview experiment.
           * Generated only in the preview deployment workspace; production main never contains this file.
           */

          @media (prefers-color-scheme: dark) {
            .week-corner { color: #98989d; }

            .week-day-head,
            .week-period-label { color: #b5b5ba; }

            .week-day-head span,
            .week-period-label span,
            .week-legend { color: #98989d; }

            .week-cell .subject {
              color: #f2f2f7;
              font-weight: 670;
            }

            .week-cell.empty .subject { color: #8e8e93; }

            .week-cell-attribution {
              color: #a8a8ad;
              opacity: .9;
            }

            .period-item.is-past { opacity: .68; }

            .timetable-action,
            .editor-button,
            .change-submit-row button,
            .remove-change {
              border-color: rgba(255, 255, 255, .12);
              background: rgba(255, 255, 255, .055);
              color: #b5b5ba;
            }

            .timetable-action.primary {
              background: rgba(255, 255, 255, .1);
              color: #f2f2f7;
            }

            .preview-home-signal { padding: 16px 16px 15px; }
            .preview-home-signal-head { margin-bottom: 9px; }
            .preview-home-signal-head span { color: #aaaab0; }

            .preview-home-signal p {
              margin-top: 6px;
              color: #98989e;
            }

            .preview-board-card {
              gap: 11px;
              padding: 18px 18px 17px;
            }

            .preview-board-card-body { color: #b3b3b8; }

            .preview-board-card-meta,
            .preview-board-time,
            .preview-board-toolbar { color: #98989e; }

            .preview-board-refresh {
              border: 1px solid rgba(255, 255, 255, .1);
              background: rgba(255, 255, 255, .055);
              color: #b8b8bd;
            }

            .preview-board-refresh:active { background: rgba(255, 255, 255, .1); }

            .preview-board-badge {
              border: 1px solid rgba(255, 255, 255, .07);
              background: rgba(255, 255, 255, .06);
              color: #aaaab0;
            }

            .preview-board-badge.is-question {
              border-color: rgba(124, 131, 255, .2);
              background: rgba(124, 131, 255, .13);
              color: #d7d9ff;
            }

            .todo-item.is-completed .todo-check { opacity: .72; }
            .todo-item.is-completed .todo-item-main { opacity: 1; }
            .todo-item.is-completed .todo-item-main strong { color: #8e8e93; }

            .todo-item.is-completed .todo-item-main .todo-kind,
            .todo-item.is-completed .todo-item-main small { color: #8e8e93; }

            .academic-focus-card > span,
            .academic-list-head span,
            .academic-list-date span { color: #98989e; }

            .academic-list-item {
              min-height: 72px;
              padding: 12px 15px;
            }

            .academic-list-copy h3 { font-weight: 700; }

            .academic-list-copy p {
              margin-top: 5px;
              color: #a8a8ad;
              font-size: 11px;
              line-height: 1.42;
            }

            .activity-attribution {
              color: #9c9ca2;
              opacity: .9;
            }

            .academic-item-actions button,
            .academic-edit-button,
            .academic-delete-button {
              border-color: rgba(255, 255, 255, .1);
              background: rgba(255, 255, 255, .055);
            }

            .preview-study-card-heading p,
            .preview-study-live-row,
            .preview-study-today-summary span,
            .preview-study-date { color: #aaaab0; }

            .s-hub-ai-page-title p:last-child,
            .s-hub-ai-page-capability-copy span,
            .s-hub-ai-item-summary > p,
            .s-hub-ai-item-summary-section > p { color: #aaaab0; }

            .s-hub-ai-page-capability-icon {
              background: rgba(255, 255, 255, .065);
              color: #b5b5ba;
            }

            .s-hub-ai-page > .s-hub-ai-content { border-color: rgba(255, 255, 255, .1); }

            .stage3-week-nav > button,
            .stage3-day-button:not(.is-selected) { border-color: rgba(255, 255, 255, .1); }

            .stage3-week-nav > button {
              background: rgba(255, 255, 255, .05);
              color: #b0b0b5;
            }
          }

          @media (prefers-color-scheme: dark) and (max-width: 360px) {
            .preview-home-signal { padding: 14px; }
            .preview-board-card { padding: 16px; }
            .academic-list-item { padding-inline: 12px; }
          }
          CSS

      - name: Isolate preview runtime from production data and caches
        working-directory: preview-source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for root in (Path('src'), Path('public')):
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.js', '.jsx', '.mjs'}:
                      continue
                  text = path.read_text()
                  next_text = text.replace("'school.", "'school.preview.").replace('"school.', '"school.preview.')
                  next_text = next_text.replace("'school-sync'", "'school-sync-preview'").replace('"school-sync"', '"school-sync-preview"')
                  if next_text != text:
                      path.write_text(next_text)

          sync = Path('src/school-sync.js')
          text = sync.read_text()
          old_identity = "return `${normalized.classNumber}|${normalized.studentNumber}|${compactName}`"
          new_identity = "return `preview|${normalized.classNumber}|${normalized.studentNumber}|${compactName}`"
          old_class = "return normalized ? `class-${normalized.classNumber}` : ''"
          new_class = "return normalized ? `preview-class-${normalized.classNumber}` : ''"
          if text.count(old_identity) != 1 or text.count(old_class) != 1:
              raise SystemExit('preview Firebase identity markers changed unexpectedly')
          text = text.replace(old_identity, new_identity, 1).replace(old_class, new_class, 1)
          sync.write_text(text)

          sw = Path('public/sw.js')
          text = sw.read_text()
          cache_line = next((line for line in text.splitlines() if line.startswith("const CACHE_NAME = 'school-shell-")), None)
          notification_line = "const NOTIFICATION_PROFILE_CACHE = 'school-notification-profile-v1'"
          cleanup = ".filter((key) => ![CACHE_NAME, NOTIFICATION_PROFILE_CACHE].includes(key))"
          if not cache_line or notification_line not in text or cleanup not in text:
              raise SystemExit('preview service-worker isolation markers changed unexpectedly')
          text = text.replace(cache_line, "const CACHE_NAME = 'school-preview-shell-dark-ui-v5'", 1)
          text = text.replace(notification_line, "const NOTIFICATION_PROFILE_CACHE = 'school-preview-notification-profile-dark-ui-v5'", 1)
          text = text.replace(cleanup, ".filter((key) => key.startsWith('school-preview-') && ![CACHE_NAME, NOTIFICATION_PROFILE_CACHE].includes(key))", 1)
          sw.write_text(text)
          PY

      - name: Patch preview base path
        working-directory: preview-source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('vite.config.js')
          text = path.read_text()
          old = "base: '/school/',"
          new = "base: '/school/preview-v2/',"
          if text.count(old) != 1:
              raise SystemExit('production Vite base marker changed unexpectedly')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build isolated preview
        working-directory: preview-source
        run: npm run build

      - name: Inject preview-only visual layer
        working-directory: preview-source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path('dist/index.html')
          text = path.read_text()
          if text.count('</head>') != 1:
              raise SystemExit('unexpected built index head marker')

          injection = (
              f'<meta name="s-hub-preview-baseline" content="{os.environ["PRODUCTION_BASELINE_SHA"]}" />'
              '<!-- Preview-only cascade layer. Production main never loads this file. -->'
              '<link rel="stylesheet" href="./preview-dark-ui.css?v=5" />'
          )
          path.write_text(text.replace('</head>', injection + '</head>', 1))
          PY

      - name: Verify preview isolation and visual layer
        working-directory: preview-source
        run: |
          set -euo pipefail
          bundle="$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' | head -n 1)"
          test -n "${bundle}"
          grep -Fq 'school-sync-preview' "${bundle}"
          grep -Fq 'preview-class-' "${bundle}"
          grep -Fq 'preview|' "${bundle}"
          grep -Fq 'school.preview.studentProfile.v1' "${bundle}"
          grep -Fq "s-hub-preview-baseline\" content=\"${PRODUCTION_BASELINE_SHA}" dist/index.html
          grep -Fq 'preview-dark-ui.css?v=5' dist/index.html
          grep -Fq 'S-Hub dark UI preview experiment' dist/preview-dark-ui.css
          python3 - <<'PY'
          from pathlib import Path
          text = Path('dist/index.html').read_text()
          preview_link = '<link rel="stylesheet" href="./preview-dark-ui.css?v=5" />'
          if text.rfind('<link') != text.find(preview_link):
              raise SystemExit('preview stylesheet is not the final stylesheet link in built HTML')
          if text.find(preview_link) > text.find('</head>'):
              raise SystemExit('preview stylesheet was injected outside head')
          PY
          grep -Fq "const CACHE_NAME = 'school-preview-shell-dark-ui-v5'" dist/sw.js
          grep -Fq "const NOTIFICATION_PROFILE_CACHE = 'school-preview-notification-profile-dark-ui-v5'" dist/sw.js
          grep -Fq "key.startsWith('school-preview-')" dist/sw.js
          ! grep -Fq "const CACHE_NAME = 'school-shell-" dist/sw.js

      - name: Compose production root plus isolated preview
        run: |
          rm -rf site
          mkdir -p site/preview-v2
          cp -R production-source/dist/. site/
          cp -R preview-source/dist/. site/preview-v2/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=/school/preview-v2/"><title>S-Hub preview</title>' > site/preview.html

      - name: Verify production root excludes preview experiment
        run: |
          set -euo pipefail
          ! grep -Fq 's-hub-preview-baseline' site/index.html
          ! grep -Fq 'preview-dark-ui.css' site/index.html
          test ! -e site/preview-dark-ui.css
          grep -Fq "const CACHE_NAME = 'school-shell-" site/sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed production and preview
        run: |
          set -euo pipefail
          preview='https://jhyxng9088.github.io/school/preview-v2/'
          production='https://jhyxng9088.github.io/school/'
          for attempt in $(seq 1 45); do
            html="$(curl -fsSL --retry 2 --retry-delay 1 "${preview}?sha=${GITHUB_SHA}&attempt=${attempt}" || true)"
            css="$(curl -fsSL --retry 2 --retry-delay 1 "${preview}preview-dark-ui.css?sha=${GITHUB_SHA}&attempt=${attempt}" || true)"
            sw="$(curl -fsSL --retry 2 --retry-delay 1 "${preview}sw.js?sha=${GITHUB_SHA}&attempt=${attempt}" || true)"
            prod_html="$(curl -fsSL --retry 2 --retry-delay 1 "${production}?preview-check=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if printf '%s' "${html}" | grep -Fq 's-hub-preview-baseline' \
              && printf '%s' "${html}" | grep -Fq 'preview-dark-ui.css?v=5' \
              && printf '%s' "${css}" | grep -Fq 'S-Hub dark UI preview experiment' \
              && printf '%s' "${sw}" | grep -Fq "school-preview-shell-dark-ui-v5" \
              && printf '%s' "${sw}" | grep -Fq "key.startsWith('school-preview-')" \
              && ! printf '%s' "${prod_html}" | grep -Fq 's-hub-preview-baseline' \
              && ! printf '%s' "${prod_html}" | grep -Fq 'preview-dark-ui.css'; then
              echo "Production/preview smoke test passed for ${GITHUB_SHA}"
              exit 0
            fi
            sleep 4
          done
          echo 'Production/preview smoke test failed after deployment.'
          exit 1