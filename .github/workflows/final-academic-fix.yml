name: Final academic fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/final-academic-fix.mjs'
      - '.github/workflows/final-academic-fix.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patch
        run: node scripts/final-academic-fix.mjs
      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Remove temporary validation files
        run: |
          rm -f scripts/final-academic-fix.mjs
          rm -f .github/workflows/final-academic-fix.yml
      - name: Commit validated changes
        run: |
          git config user.name 'school-pwa-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix academic editor and reminder example' || exit 0
          git push
