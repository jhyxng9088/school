name: Apply timetable weekend and cache fix

on:
  push:
    paths:
      - '.github/workflows/apply-timetable-weekend-cache-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused timetable patch
        run: python .github/scripts/fix-timetable-weekend-cache.py
      - name: Remove one-time files
        run: |
          rm .github/workflows/apply-timetable-weekend-cache-fix.yml
          rm .github/scripts/fix-timetable-weekend-cache.py
          rmdir .github/scripts 2>/dev/null || true
      - name: Install app dependencies
        run: npm ci
      - name: Run app tests including timetable regressions
        run: npm test
      - name: Build app
        run: npm run build
      - name: Validate reminder backend
        run: |
          cd push-backend-v2
          npm ci
          npm test
      - name: Commit only validated result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'Fix temporary timetable week and personal cache'
          git push origin main
