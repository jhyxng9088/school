name: S-Hub scheduled push backup

on:
  schedule:
    # Independent backup schedule, staggered from the primary workflow.
    # The backend owns KST due-time checks and deduplicates notification sends.
    - cron: '2,5,8 9-12 * * 1-5'
      timezone: 'Asia/Seoul'
    - cron: '2,5,8 13 * * 1-5'
      timezone: 'Asia/Seoul'
    - cron: '52,55,58 13-15 * * 1-5'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/push-scheduler-backup.yml'

permissions:
  contents: read

concurrency:
  group: s-hub-scheduled-push-backup
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger scheduled push dispatcher
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 25 \
            --header 'Accept: application/json' \
            'https://school-push-backend.vercel.app/api/push-scheduled'
