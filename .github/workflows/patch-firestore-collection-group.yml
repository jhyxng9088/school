name: Patch Firestore collection-group rule

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-firestore-collection-group.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch only pushSubscriptions collection-group read rule
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('firestore.rules')
          text = path.read_text()
          needle = "    match /classes/{classId}/pushSubscriptions/{subscriptionId} {\n"
          replacement = (
              "    // Allow the scheduled backend's collectionGroup('pushSubscriptions') read.\n"
              "    // Write permissions remain restricted by the class-scoped rule below.\n"
              "    match /{path=**}/pushSubscriptions/{subscriptionId} {\n"
              "      allow read: if signedIn();\n"
              "    }\n\n"
              + needle
          )

          if text.count(needle) != 1:
              raise SystemExit(f'Expected exactly one pushSubscriptions rule, found {text.count(needle)}')
          if "match /{path=**}/pushSubscriptions/{subscriptionId}" in text:
              raise SystemExit('Collection-group rule already exists; refusing duplicate patch')

          path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/patch-firestore-collection-group.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firestore.rules
          git diff --cached --check
          git commit -m 'Allow scheduled push subscription collection-group reads'
          git push
