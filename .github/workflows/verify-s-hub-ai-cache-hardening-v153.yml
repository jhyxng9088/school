name: Verify S-Hub AI cache hardening v153

on:
  push:
    branches:
      - fix/s-hub-ai-cache-hardening-v153

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove temporary workflow
        run: rm .github/workflows/verify-s-hub-ai-cache-hardening-v153.yml

      - name: Verify repository shape
        run: |
          git diff --check
          test ! -e .github/workflows/verify-s-hub-ai-cache-hardening-v153.yml
          test ! -d tools
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          grep -q "classId" push-backend-v2/api/s-hub-ai.js
          grep -q "pruneExpiredSchoolQuestionCache" push-backend-v2/api/s-hub-ai.js
          grep -q "school-shell-v153" public/sw.js

      - name: Install app dependencies
        run: npm ci

      - name: Test app
        run: npm test

      - name: Build app
        run: npm run build

      - name: Install backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Test backend
        working-directory: push-backend-v2
        run: npm test

      - name: Commit verified clean tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden S-Hub shared AI cache scope and cleanup [skip ci]"
          git push origin HEAD:fix/s-hub-ai-cache-hardening-v153
