name: Expire reminders at due time

on:
  push:
    paths:
      - '.github/workflows/expire_reminders_at_midnight.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded reminder due-time patch
        run: python3 .github/scripts/expire_reminders_at_midnight.py
      - name: Verify diff
        run: git diff --check
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Verify exact scope
        run: |
          grep -Fq "const dueTime = String(todo?.dueTime || '').trim()" src/todo.jsx
          grep -Fq "const expiryTime = /^([01]\\d|2[0-3]):[0-5]\\d$/.test(dueTime)" src/todo.jsx
          grep -Fq '? `${dueTime}:00.000`' src/todo.jsx
          grep -Fq ": '23:59:59.000'" src/todo.jsx
      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/todo.jsx
          git commit -m "Expire reminders at their due time" || exit 0
          git push
