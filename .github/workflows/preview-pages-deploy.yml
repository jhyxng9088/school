name: Deploy Preview Verification

on:
  push:
    branches:
      - preview/s-hub-v2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-source

      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/s-hub-v2
          path: preview-source

      - name: Remove temporary workflow from preview test workspace
        run: rm -f preview-source/.github/workflows/preview-pages-deploy.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install production dependencies
        run: npm ci
        working-directory: production-source

      - name: Test production app
        run: npm test
        working-directory: production-source

      - name: Build production app
        run: npm run build
        working-directory: production-source

      - name: Install preview dependencies
        run: npm ci
        working-directory: preview-source

      - name: Test preview app
        run: npm test
        working-directory: preview-source

      - name: Patch preview base path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('preview-source/vite.config.js')
          text = path.read_text()
          old = "base: '/school/',"
          new = "base: '/school/preview-v2/',"
          if text.count(old) != 1:
              raise SystemExit('production Vite base marker changed unexpectedly')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build preview app
        run: npm run build
        working-directory: preview-source

      - name: Verify preview data isolation
        run: node scripts/verify-preview-isolation.mjs
        working-directory: preview-source

      - name: Compose site
        run: |
          rm -rf site
          mkdir -p site/preview-v2
          cp -R production-source/dist/. site/
          cp -R preview-source/dist/. site/preview-v2/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=/school/preview-v2/"><title>Preview moved</title>' > site/preview.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed preview
        run: |
          set -euo pipefail
          PREVIEW_URL='https://jhyxng9088.github.io/school/preview-v2/'
          PREVIEW_SW_URL='https://jhyxng9088.github.io/school/preview-v2/sw.js'
          EXPECTED_SHA='${{ github.sha }}'
          for attempt in {1..45}; do
            html="$(curl -fsSL --retry 2 --retry-delay 1 "${PREVIEW_URL}?sha=${EXPECTED_SHA}&attempt=${attempt}" || true)"
            sw="$(curl -fsSL --retry 2 --retry-delay 1 "${PREVIEW_SW_URL}?sha=${EXPECTED_SHA}&attempt=${attempt}" || true)"
            if printf '%s' "${html}" | grep -Fq 'id="root"' \
              && printf '%s' "${sw}" | grep -Fq "const CACHE_NAME = 'school-preview-shell-" \
              && printf '%s' "${sw}" | grep -Fq "const NOTIFICATION_PROFILE_CACHE = 'school-preview-notification-profile-" \
              && ! printf '%s' "${sw}" | grep -Fq "const CACHE_NAME = 'school-shell-"; then
              echo "Preview smoke test passed for ${EXPECTED_SHA}"
              exit 0
            fi
            sleep 4
          done
          echo 'Preview smoke test failed after deployment.'
          exit 1
