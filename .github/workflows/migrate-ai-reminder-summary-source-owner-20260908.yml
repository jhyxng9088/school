name: Migrate AI reminder summary source owner 20260908

on:
  push:
    branches:
      - work/ai-reminder-summary-source-owner-20260908

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: work/ai-reminder-summary-source-owner-20260908
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Capture current production build
        run: |
          npm run build
          rm -rf /tmp/s-hub-ai-summary-before
          cp -a dist /tmp/s-hub-ai-summary-before

      - name: Source-own AI reminder summary behavior
        run: node scripts/migrate-ai-reminder-summary-source-owner-20260908.mjs

      - name: Remove retired and temporary owners
        run: |
          rm src/preview-ai-reminder-summary-patch.js
          rm scripts/migrate-ai-reminder-summary-source-owner-20260908.mjs
          rm .github/workflows/migrate-ai-reminder-summary-source-owner-20260908.yml

      - name: Verify changed-file boundary
        run: |
          git diff --check
          git diff --name-only | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          .github/workflows/migrate-ai-reminder-summary-source-owner-20260908.yml
          scripts/migrate-ai-reminder-summary-source-owner-20260908.mjs
          src/main.jsx
          src/preview-ai-reminder-summary-patch.js
          src/reminder-summary.jsx
          tests/build-patch-effect.test.js
          tests/home-signal-navigation.test.js
          tests/preview-reminder-summary-viewport.test.js
          tests/preview-ui-regressions.test.js
          tests/reminder-original-download.test.js
          tests/s-hub-ai-presave-summary.test.js
          tests/s-hub-ai-reminder-summary-import.test.js
          vite.config.js
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Verify complete production build equivalence
        run: |
          rm -rf dist
          npm run build
          diff -qr /tmp/s-hub-ai-summary-before dist

      - name: Test production app
        run: npm test

      - name: Install production backend dependencies
        working-directory: push-backend-v2
        run: npm ci

      - name: Test production backend
        working-directory: push-backend-v2
        run: npm test

      - name: Commit clean migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: source-own AI reminder summary behavior"
          git push origin HEAD:work/ai-reminder-summary-source-owner-20260908
