name: Patch notification onboarding UI

on:
  push:
    paths:
      - .github/workflows/patch-notification-onboarding.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch push prompt only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/push-client.js')
          text = path.read_text()
          replacements = {
            '      left: max(16px, env(safe-area-inset-left));\n      right: max(16px, env(safe-area-inset-right));\n      bottom: calc(86px + env(safe-area-inset-bottom));\n      display: flex;\n      align-items: center;\n      gap: 12px;\n      padding: 13px 13px 13px 15px;': '      left: 50%;\n      bottom: calc(96px + env(safe-area-inset-bottom));\n      width: min(420px, calc(100vw - 32px));\n      display: grid;\n      grid-template-columns: 1fr;\n      gap: 10px;\n      padding: 20px;',
            '      border-radius: 20px;\n      background: rgba(250, 250, 252, .94);': '      border-radius: 24px;\n      background: rgba(250, 250, 252, .97);',
            '      box-shadow: 0 12px 38px rgba(0, 0, 0, .12);': '      box-shadow: 0 18px 54px rgba(0, 0, 0, .18);',
            '      transform: translate3d(0, 10px, 0) scale(.985);': '      transform: translate3d(-50%, 14px, 0) scale(.985);',
            '.school-push-prompt.is-open { opacity: 1; transform: translate3d(0,0,0) scale(1); }': '.school-push-prompt.is-open { opacity: 1; transform: translate3d(-50%,0,0) scale(1); }',
            '.school-push-prompt-copy { min-width: 0; flex: 1; }': '.school-push-prompt-copy { min-width: 0; }',
            '.school-push-prompt-copy strong { display: block; font-size: 14px; line-height: 1.25; letter-spacing: -.02em; }': '.school-push-prompt-copy strong { display: block; font-size: 18px; line-height: 1.25; letter-spacing: -.025em; }',
            '.school-push-prompt-copy span { display: block; margin-top: 3px; font-size: 12px; line-height: 1.35; opacity: .62; }': '.school-push-prompt-copy span { display: block; margin-top: 7px; font-size: 13px; line-height: 1.45; opacity: .65; }',
            '      flex: none;\n      border: 0;\n      border-radius: 14px;\n      padding: 9px 12px;': '      width: 100%;\n      border: 0;\n      border-radius: 14px;\n      padding: 12px 14px;',
            '      font-size: 13px;\n      font-weight: 650;': '      font-size: 14px;\n      font-weight: 700;',
            '      flex: none;\n      width: 30px;\n      height: 30px;\n      border: 0;\n      padding: 0;\n      border-radius: 50%;\n      background: rgba(0, 0, 0, .06);\n      color: inherit;\n      font: inherit;\n      font-size: 17px;\n      line-height: 30px;\n      opacity: .62;': '      width: 100%;\n      border: 0;\n      border-radius: 14px;\n      padding: 12px 14px;\n      background: rgba(0, 0, 0, .055);\n      color: inherit;\n      font: inherit;\n      font-size: 14px;\n      font-weight: 700;\n      opacity: .72;',
            'background: rgba(27,27,30,.94);': 'background: rgba(27,27,30,.97);',
            '<strong>알림 켜기</strong>': "<strong>${permissionDenied ? 'S-Hub 알림이 꺼져 있어' : 'S-Hub 알림을 켜둘까?'}</strong>",
            "<span>${permissionDenied ? '기기 설정에서 S-Hub 알림을 허용해줘.' : '시간표 변경 · 다음 수업 · 급식을 알려줄게.'}</span>": "<span>${permissionDenied ? '기기 설정에서 S-Hub 알림을 허용하면 중요한 학교 소식을 놓치지 않을 수 있어.' : '새 리마인더와 시간표 변경 같은 중요한 학교 소식을 바로 알려줄게.'}</span>",
            "<button class=\"school-push-enable\" type=\"button\">${permissionDenied ? '확인' : '켜기'}</button>": "<button class=\"school-push-enable\" type=\"button\">${permissionDenied ? '확인' : '알림 켜기'}</button>",
            '<button class="school-push-close" type="button" aria-label="나중에">×</button>': '<button class="school-push-close" type="button">나중에</button>',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit('missing push prompt anchor: ' + old[:60])
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Validate build
        run: npm ci && npm run build
      - name: Commit push prompt only
        shell: bash
        run: |
          git config user.name jhyxng9088
          git config user.email j.hyxng9088@gmail.com
          git add src/push-client.js
          git diff --cached --quiet && exit 0
          git commit -m 'Strengthen notification opt-in prompt'
          git push
