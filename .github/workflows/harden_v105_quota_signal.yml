name: Harden v105 adaptive quota signal

on:
  push:
    paths:
      - '.github/workflows/harden_v105_quota_signal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply quota signal hardening
        run: python3 .github/scripts/harden_v105_quota_signal.py
      - name: Verify diff
        run: git diff --check
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/firebase-ai-direct.js
          git commit -m "Preserve quota signals for adaptive AI fallback" || exit 0
          git push
