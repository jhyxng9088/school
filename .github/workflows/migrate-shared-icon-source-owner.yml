name: Migrate shared icon source owner

on:
  push:
    branches:
      - work/shared-icon-source-owner-20260905-v5

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: work/shared-icon-source-owner-20260905-v5
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate icon ownership into source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          main_path = Path('src/main.jsx')
          main = main_path.read_text()
          main = replace_once(
              main,
              "import { SHubAIOrb } from './s-hub-ai-orb.jsx'\n",
              "import { SHubAIOrb } from './s-hub-ai-orb.jsx'\nimport { SHubIcon } from './s-hub-icon.jsx'\n",
              'main SHubIcon import',
          )
          icon_start = 'function Icon({ type, size = 22 }) {'
          icon_end = '\n\nfunction InstallGuide({ onDone, standalone }) {'
          start = main.find(icon_start)
          end = main.find(icon_end, start + len(icon_start))
          if start < 0 or end < 0:
              raise SystemExit('main Icon function boundary missing')
          icon_wrapper = "function Icon({ type, size = 22 }) {\n  return <SHubIcon name={type} size={size} />\n}"
          main = main[:start] + icon_wrapper + main[end:]
          main_path.write_text(main)

          station_path = Path('src/preview-station-nav-patch.js')
          station = station_path.read_text()
          station_start = "  next = replaceRequired(\n    next,\n    `  if (type === 'todo') {"
          station_end = "    'station icons',\n  )\n\n"
          start = station.find(station_start)
          end = station.find(station_end, start + len(station_start))
          if start < 0 or end < 0:
              raise SystemExit('station icon generation block missing')
          end += len(station_end)
          station = station[:start] + station[end:]
          station_path.write_text(station)

          visual_path = Path('src/study-visual-polish-patch.js')
          visual = visual_path.read_text()
          visual_start = 'function patchStudyNavIcon(source) {'
          visual_end = 'function patchStudyHeader(source) {'
          start = visual.find(visual_start)
          end = visual.find(visual_end, start + len(visual_start))
          if start < 0 or end < 0:
              raise SystemExit('study nav icon patch boundary missing')
          visual = visual[:start] + visual[end:]
          visual = replace_once(
              visual,
              "  if (cleanId.endsWith('/src/main.jsx')) return patchStudyNavIcon(source)\n",
              '',
              'study visual main icon dispatch',
          )
          visual_path.write_text(visual)

          vite_path = Path('vite.config.js')
          vite = vite_path.read_text()
          vite = replace_once(
              vite,
              "import { patchSharedIconOwnerSource } from './src/shared-icon-owner-patch.js'",
              "import { patchSharedSegmentSpringOwnerSource } from './src/shared-segment-spring-owner-patch.js'",
              'vite shared owner import',
          )
          vite = replace_once(
              vite,
              '  next = patchSharedIconOwnerSource(next, cleanId)',
              '  next = patchSharedSegmentSpringOwnerSource(next, cleanId)',
              'vite shared owner call',
          )
          vite = replace_once(
              vite,
              "        || cleanId.endsWith('/shared-icon-owner-patch.js')",
              "        || cleanId.endsWith('/shared-segment-spring-owner-patch.js')",
              'vite polite copy exclusion',
          )
          vite_path.write_text(vite)

          shared_icon_test = '''import fs from 'node:fs'\nimport test from 'node:test'\nimport assert from 'node:assert/strict'\nimport { patchPreviewStationNavSource } from '../src/preview-station-nav-patch.js'\nimport { patchStudyVisualPolishSource } from '../src/study-visual-polish-patch.js'\nimport { patchSharedSegmentSpringOwnerSource } from '../src/shared-segment-spring-owner-patch.js'\n\nconst read = (path) => fs.readFileSync(new URL(`../${path}`, import.meta.url), 'utf8')\n\ntest('shared S-Hub icon registry preserves every app icon and the polished study book', () => {\n  const source = read('src/s-hub-icon.jsx')\n  for (const name of ['home', 'class', 'ai', 'study', 'schedule', 'board', 'todo', 'timetable', 'meal', 'academic', 'search', 'clock']) {\n    assert.match(source, new RegExp(`name === '${name}'`))\n  }\n  assert.match(source, /M2\\.8 5\\.2c3\\.6-\\.9 6\\.7\\.1 9\\.2 2\\.8/)\n  assert.match(source, /M21\\.2 5\\.2c-3\\.6-\\.9-6\\.7\\.1-9\\.2 2\\.8/)\n  assert.match(source, /M12 8v11\\.2/)\n})\n\ntest('main source directly owns the shared icon wrapper before any Vite transform', () => {\n  const source = read('src/main.jsx')\n  assert.match(source, /import \\{ SHubIcon \\} from '\\.\\/s-hub-icon\\.jsx'/)\n  assert.match(source, /function Icon\\(\\{ type, size = 22 \\}\\) \\{\\n  return <SHubIcon name=\\{type\\} size=\\{size\\} \\/>\\n\\}/)\n\n  const start = source.indexOf('function Icon({ type, size = 22 }) {')\n  const end = source.indexOf('function InstallGuide', start)\n  assert.ok(start >= 0 && end > start)\n  const iconBlock = source.slice(start, end)\n  assert.doesNotMatch(iconBlock, /<svg/)\n  assert.doesNotMatch(iconBlock, /M2\\.8 5\\.2/)\n})\n\ntest('station and study transforms preserve the source-owned icon wrapper', () => {\n  const id = '/workspace/src/main.jsx'\n  let source = read('src/main.jsx')\n  source = patchPreviewStationNavSource(source, id)\n  source = patchStudyVisualPolishSource(source, id)\n  source = patchSharedSegmentSpringOwnerSource(source, id)\n\n  assert.match(source, /function Icon\\(\\{ type, size = 22 \\}\\) \\{\\n  return <SHubIcon name=\\{type\\} size=\\{size\\} \\/>\\n\\}/)\n  const start = source.indexOf('function Icon({ type, size = 22 }) {')\n  const end = source.indexOf('function InstallGuide', start)\n  const iconBlock = source.slice(start, end)\n  assert.doesNotMatch(iconBlock, /<svg/)\n  assert.doesNotMatch(source, /M4\\.2 5\\.1h5\\.5/)\n})\n\ntest('Vite calls the shared segment spring owner directly after visual polish', () => {\n  const vite = read('vite.config.js')\n  const visual = vite.indexOf('patchStudyVisualPolishSource(next, cleanId)')\n  const shared = vite.indexOf('patchSharedSegmentSpringOwnerSource(next, cleanId)')\n  assert.ok(visual >= 0)\n  assert.ok(shared > visual)\n  assert.doesNotMatch(vite, /patchSharedIconOwnerSource/)\n  assert.doesNotMatch(vite, /shared-icon-owner-patch\\.js/)\n  assert.equal(fs.existsSync(new URL('../src/shared-icon-owner-patch.js', import.meta.url)), false)\n})\n'''
          Path('tests/shared-icon-owner.test.js').write_text(shared_icon_test)

          segment_test_path = Path('tests/shared-segment-spring-owner.test.js')
          segment_test = segment_test_path.read_text()
          old_tail = "test('the existing final ownership transform delegates segment spring migration without adding another Vite transform', () => {"
          start = segment_test.find(old_tail)
          if start < 0:
              raise SystemExit('shared segment legacy ownership test missing')
          new_tail = '''test('Vite calls shared segment spring ownership directly after icon source migration', () => {\n  const vite = read('vite.config.js')\n  assert.equal((vite.match(/patchSharedSegmentSpringOwnerSource\\(next, cleanId\\)/g) || []).length, 1)\n  assert.doesNotMatch(vite, /patchSharedIconOwnerSource/)\n  assert.doesNotMatch(vite, /shared-icon-owner-patch\\.js/)\n  assert.equal(fs.existsSync(new URL('../src/shared-icon-owner-patch.js', import.meta.url)), false)\n})\n'''
          segment_test = segment_test[:start] + new_tail
          segment_test_path.write_text(segment_test)

          study_test_path = Path('tests/study-visual-polish.test.js')
          study_test = study_test_path.read_text()
          first_start = "test('study bottom navigation uses an unmistakable minimal open-book icon', () => {"
          second_start = "test('study ranking client sends today/all period without changing the existing endpoint', () => {"
          start = study_test.find(first_start)
          end = study_test.find(second_start, start + len(first_start))
          if start < 0 or end < 0:
              raise SystemExit('study icon test boundary missing')
          replacement = '''test('study bottom navigation uses the source-owned shared minimal open-book icon', () => {\n  const main = read('src/main.jsx')\n  const registry = read('src/s-hub-icon.jsx')\n\n  assert.match(main, /return <SHubIcon name=\\{type\\} size=\\{size\\} \\/>/)\n  assert.match(registry, /M2\\.8 5\\.2c3\\.6-\\.9 6\\.7\\.1 9\\.2 2\\.8/)\n  assert.match(registry, /M21\\.2 5\\.2c-3\\.6-\\.9-6\\.7\\.1-9\\.2 2\\.8/)\n  assert.match(registry, /M12 8v11\\.2/)\n  assert.doesNotMatch(main, /M4\\.2 5\\.1h5\\.5/)\n})\n\n'''
          study_test = study_test[:start] + replacement + study_test[end:]
          study_test_path.write_text(study_test)
          PY

          git rm src/shared-icon-owner-patch.js
          git rm .github/workflows/migrate-shared-icon-source-owner.yml

          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/migrate-shared-icon-source-owner.yml',
              'src/main.jsx',
              'src/preview-station-nav-patch.js',
              'src/shared-icon-owner-patch.js',
              'src/study-visual-polish-patch.js',
              'tests/shared-icon-owner.test.js',
              'tests/shared-segment-spring-owner.test.js',
              'tests/study-visual-polish.test.js',
              'vite.config.js',
          }
          changed = set(subprocess.check_output(['git', 'diff', 'HEAD', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected migration paths: {sorted(changed)}')
          PY

      - name: Test production app
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Commit clean migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: make shared icons source-owned'
          git push origin HEAD:work/shared-icon-source-owner-20260905-v5
