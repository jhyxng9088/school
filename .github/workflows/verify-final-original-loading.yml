name: Verify final original loading

on:
  push:
    branches:
      - fix/ios-ai-and-original-stability

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final loader optimization
        run: python3 tools/finalize_original_loading.py
      - name: Remove temporary files
        run: |
          rm .github/workflows/verify-final-original-loading.yml
          rm tools/finalize_original_loading.py
          rmdir tools
      - name: Verify repository shape
        run: |
          git diff --check
          test ! -d tools
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          grep -q "getDocs(collection(originalAttachmentRef(profile, safeId), 'chunks'))" src/school-sync.js
          ! grep -q "Array.from({ length: chunkCount }" src/school-sync.js
      - name: Install app dependencies
        run: npm ci
      - name: Test app
        run: npm test
      - name: Build app
        run: npm run build
      - name: Install backend dependencies
        working-directory: push-backend-v2
        run: npm ci
      - name: Test backend
        working-directory: push-backend-v2
        run: npm test
      - name: Commit verified tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Optimize original reminder loading [skip ci]"
          git push origin HEAD:fix/ios-ai-and-original-stability
