name: Apply UI compatibility finalizer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ui-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final compatibility patch
        run: python3 scripts/ui-finalizer.py

      - name: Verify
        run: |
          grep -q -- "--indicator-x" src/main.jsx
          grep -q -- "var(--indicator-x" src/styles.css
          grep -q "Unified academic handle placement" src/academic-shared.css
          git diff --check

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

      - name: Commit verified finalizer
        shell: bash
        run: |
          rm .github/workflows/ui-finalizer.yml scripts/ui-finalizer.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/styles.css src/academic-shared.css .github/workflows/ui-finalizer.yml scripts/ui-finalizer.py
          git commit -m "Finalize mobile nav and sheet compatibility"
          git push
