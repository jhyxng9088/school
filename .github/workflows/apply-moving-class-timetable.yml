name: Apply moving class timetable split

on:
  push:
    paths:
      - .github/workflows/apply-moving-class-timetable.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped timetable changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'anchor missing: {path}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1))

          sync = Path('src/school-sync.js')
          replace_once(sync,
          "import { useCallback, useEffect, useState } from 'react'",
          "import { useCallback, useEffect, useState } from 'react'")
          replace_once(sync,
          "const ORIGINAL_ATTACHMENT_SERVER_TIMEOUT_MS = 14_000\n",
          "const ORIGINAL_ATTACHMENT_SERVER_TIMEOUT_MS = 14_000\nconst PERSONAL_TIMETABLE_API_URL = 'https://school-reminder-backend.vercel.app/api/personal-timetable'\n")
          replace_once(sync,
          "async function writeInitialTimetable(profile, value) {",
          """function movingClassEnabled(profile) {
            const classNumber = Number(profile?.classNumber)
            return Number.isInteger(classNumber) && classNumber >= 7 && classNumber <= 15
          }

          function mergeWeeklyTimetables(sharedSchedule, personalSchedule) {
            const shared = normalizeWeeklySchedule(sharedSchedule)
            const personal = normalizeWeeklySchedule(personalSchedule)
            const merged = normalizeWeeklySchedule(shared)
            for (const [dayId, periods] of Object.entries(personal)) {
              for (const [period, subject] of Object.entries(periods)) {
                if (String(subject || '').trim()) merged[dayId][period] = subject
              }
            }
            return merged
          }

          function mergeTimetableOverrides(sharedOverrides, personalOverrides, now = new Date()) {
            const shared = pruneExpiredOverrides(normalizeOverrides(sharedOverrides), now)
            const personal = pruneExpiredOverrides(normalizeOverrides(personalOverrides), now)
            const merged = { ...shared }
            for (const [date, periods] of Object.entries(personal)) {
              merged[date] = { ...(merged[date] || {}), ...periods }
            }
            return merged
          }

          async function requestPersonalTimetable(profile, payload) {
            if (!movingClassEnabled(profile)) return null
            const user = await ensureSignedIn()
            const idToken = String(await user.getIdToken()).trim()
            const response = await fetch(PERSONAL_TIMETABLE_API_URL, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${idToken}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify(payload),
            })
            const body = await response.json().catch(() => ({}))
            if (!response.ok || body?.ok !== true) throw new Error(body?.error || 'personal_timetable_failed')
            return body.data || {}
          }

          async function writeInitialTimetable(profile, value) {""")
          replace_once(sync,
          "  const signature = profileSignature(profile)\n\n  useEffect(() => {",
          """  const [personalWeeklySchedule, setPersonalWeeklySchedule] = useState(() => normalizeWeeklySchedule(null))
            const [personalOverrides, setPersonalOverrides] = useState({})
            const signature = profileSignature(profile)
            const movingClass = movingClassEnabled(profile)

            useEffect(() => {""")
          replace_once(sync,
          "  const commitWeeklySchedule = useCallback(async (nextSchedule) => {",
          """  useEffect(() => {
            if (!signature || !movingClass) {
              setPersonalWeeklySchedule(normalizeWeeklySchedule(null))
              setPersonalOverrides({})
              return undefined
            }
            let stopped = false
            const refresh = async () => {
              try {
                const data = await requestPersonalTimetable(profile, { action: 'load' })
                if (stopped) return
                setPersonalWeeklySchedule(normalizeWeeklySchedule(data?.weeklySchedule))
                setPersonalOverrides(pruneExpiredOverrides(normalizeOverrides(data?.overrides), new Date()))
              } catch (error) {
                if (!stopped) console.error('Personal timetable load failed:', error)
              }
            }
            refresh()
            const removeRevalidation = installServerRevalidation(refresh)
            return () => {
              stopped = true
              removeRevalidation()
            }
          }, [signature, movingClass])

            const commitWeeklySchedule = useCallback(async (nextSchedule) => {""")
          replace_once(sync,
          "  return {\n    weeklySchedule,\n    overrides,\n    commitWeeklySchedule,\n    commitOverrides,\n  }\n}",
          """  const commitPersonalWeeklySchedule = useCallback(async (nextSchedule) => {
            if (!movingClass) return false
            const normalized = normalizeWeeklySchedule(nextSchedule)
            try {
              await requestPersonalTimetable(profile, { action: 'saveWeekly', weeklySchedule: normalized })
              setPersonalWeeklySchedule(normalized)
              return true
            } catch (error) {
              console.error('Personal timetable save failed:', error)
              return false
            }
          }, [signature, movingClass])

            const commitPersonalOverrides = useCallback(async (nextOverrides) => {
              if (!movingClass) return false
              const normalized = pruneExpiredOverrides(nextOverrides, now)
              try {
                await requestPersonalTimetable(profile, { action: 'saveOverrides', overrides: normalized })
                setPersonalOverrides(normalized)
                return true
              } catch (error) {
                console.error('Personal timetable override save failed:', error)
                return false
              }
            }, [signature, movingClass, now])

            const effectiveWeeklySchedule = movingClass
              ? mergeWeeklyTimetables(weeklySchedule, personalWeeklySchedule)
              : weeklySchedule
            const effectiveOverrides = movingClass
              ? mergeTimetableOverrides(overrides, personalOverrides, now)
              : overrides

            return {
              weeklySchedule: effectiveWeeklySchedule,
              overrides: effectiveOverrides,
              sharedWeeklySchedule: weeklySchedule,
              sharedOverrides: overrides,
              personalWeeklySchedule,
              personalOverrides,
              commitWeeklySchedule,
              commitOverrides,
              commitPersonalWeeklySchedule,
              commitPersonalOverrides,
            }
          }""")

          main = Path('src/main.jsx')
          replace_once(main,
          "function TimetablePage({ now, weeklySchedule, overrides, onSaveWeekly, onSaveOverrides, activity, profile, requireOnline = () => true }) {\n  const [editing, setEditing] = useState(false)",
          """function TimetablePage({
            now,
            weeklySchedule,
            overrides,
            sharedWeeklySchedule,
            sharedOverrides,
            personalWeeklySchedule,
            personalOverrides,
            onSaveWeekly,
            onSaveOverrides,
            onSavePersonalWeekly,
            onSavePersonalOverrides,
            activity,
            profile,
            requireOnline = () => true,
          }) {
            const movingClass = Number(profile?.classNumber) >= 7 && Number(profile?.classNumber) <= 15
            const [editing, setEditing] = useState(false)
            const [editScope, setEditScope] = useState('shared')
            const [changeScope, setChangeScope] = useState('shared')""")
          replace_once(main,
          "  const baseSubject = selectedDay ? weeklySchedule?.[selectedDay.id]?.[changePeriod] || '' : ''",
          """  const changeBaseSchedule = movingClass && changeScope === 'shared'
              ? sharedWeeklySchedule
              : weeklySchedule
            const baseSubject = selectedDay ? changeBaseSchedule?.[selectedDay.id]?.[changePeriod] || '' : ''""")
          replace_once(main,
          "  function startEditing() {\n    if (!requireOnline('시간표를 수정')) return\n    setDraft(cloneWeeklySchedule(weeklySchedule))\n    setChangeOpen(false)\n    setEditing(true)\n  }",
          """  function startEditing(scope = 'shared') {
            if (!requireOnline('시간표를 수정')) return
            const nextScope = movingClass ? scope : 'shared'
            const source = nextScope === 'personal' ? personalWeeklySchedule : (sharedWeeklySchedule || weeklySchedule)
            setEditScope(nextScope)
            setDraft(cloneWeeklySchedule(source))
            setChangeOpen(false)
            setEditing(true)
          }

            function openChange(scope = 'shared') {
              if (!requireOnline('시간표를 수정')) return
              const initialDate = currentState.kind === 'done'
                ? new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 12, 0, 0, 0)
                : now
              setChangeScope(movingClass ? scope : 'shared')
              setChangeDate(dateKey(initialDate))
              setChangeSubject('')
              setChangeOpen(true)
            }""")
          replace_once(main,
          "    const changedCells = WEEKDAYS.flatMap((day) =>\n      PERIODS\n        .filter((period) => period.number <= day.regularPeriodCount)\n        .filter((period) => String(weeklySchedule?.[day.id]?.[period.number] || '').trim() !== String(draft?.[day.id]?.[period.number] || '').trim())",
          """    const sourceSchedule = movingClass && editScope === 'personal'
              ? personalWeeklySchedule
              : (sharedWeeklySchedule || weeklySchedule)
            const changedCells = WEEKDAYS.flatMap((day) =>
              PERIODS
                .filter((period) => period.number <= day.regularPeriodCount)
                .filter((period) => String(sourceSchedule?.[day.id]?.[period.number] || '').trim() !== String(draft?.[day.id]?.[period.number] || '').trim())""")
          replace_once(main,
          "    const saved = await onSaveWeekly(draft)\n    if (!saved) return\n    recordClassActivities(profile, [",
          """    const saved = movingClass && editScope === 'personal'
              ? await onSavePersonalWeekly(draft)
              : await onSaveWeekly(draft)
            if (!saved) return
            if (!(movingClass && editScope === 'personal')) recordClassActivities(profile, [""")
          replace_once(main,
          "    ]).catch((error) => console.error('Timetable attribution save failed:', error))\n    setEditing(false)",
          """    ]).catch((error) => console.error('Timetable attribution save failed:', error))
            setEditing(false)""")
          # Close the conditional class-activity call inserted above.
          replace_once(main,
          "    ]).catch((error) => console.error('Timetable attribution save failed:', error))\n            setEditing(false)",
          """    ]).catch((error) => console.error('Timetable attribution save failed:', error))
            setEditing(false)""")
          # Replace saveChange body scope sources and destination.
          replace_once(main,
          "    const activityAction = overrides?.[changeDate]?.[changePeriod] ? 'edited' : 'added'\n\n    const next = { ...overrides }",
          """    const sourceOverrides = movingClass && changeScope === 'personal'
              ? personalOverrides
              : (sharedOverrides || overrides)
            const activityAction = sourceOverrides?.[changeDate]?.[changePeriod] ? 'edited' : 'added'

            const next = { ...sourceOverrides }""")
          replace_once(main,
          "    const saved = await onSaveOverrides(next)\n    if (!saved) return\n    recordClassActivities(profile, [{",
          """    const saved = movingClass && changeScope === 'personal'
              ? await onSavePersonalOverrides(next)
              : await onSaveOverrides(next)
            if (!saved) return
            if (!(movingClass && changeScope === 'personal')) recordClassActivities(profile, [{""")
          replace_once(main,
          "    }]).catch((error) => console.error('Timetable change attribution save failed:', error))\n    setChangeSubject('')",
          """    }]).catch((error) => console.error('Timetable change attribution save failed:', error))
            setChangeSubject('')""")
          replace_once(main,
          "  async function removeChange(targetDate, period) {\n    if (!requireOnline('시간표를 수정')) return\n    const key = dateKey(targetDate)\n    const next = { ...overrides }",
          """  async function removeChange(targetDate, period, scope = 'shared') {
            if (!requireOnline('시간표를 수정')) return
            const key = dateKey(targetDate)
            const source = movingClass && scope === 'personal' ? personalOverrides : (sharedOverrides || overrides)
            const next = { ...source }""")
          replace_once(main,
          "    await onSaveOverrides(next)\n  }\n\n  async function clearAllChanges()",
          """    if (movingClass && scope === 'personal') await onSavePersonalOverrides(next)
            else await onSaveOverrides(next)
          }

            async function clearAllChanges()""")
          # Add source scope to week changes.
          replace_once(main,
          "        activity: activity?.[activityKey('timetable', `${dateKey(date)}-${period.number}`)] || null,\n      })),",
          """        activity: activity?.[activityKey('timetable', `${dateKey(date)}-${period.number}`)] || null,
              scope: movingClass && Object.prototype.hasOwnProperty.call(personalOverrides?.[dateKey(date)] || {}, period.number)
                ? 'personal'
                : 'shared',
            })),""")
          # Replace header/actions block.
          old_actions = """      <header className=\"timetable-header\">
        <div>
          <p className=\"date-label\">{editing ? '기본 시간표' : '이번 주'}</p>
          <h1>시간표</h1>
        </div>
        {!editing ? (
          <div className=\"timetable-actions\">
            <button className=\"timetable-action\" onClick={startEditing}>기본 수정</button>
            <button
              className=\"timetable-action primary\"
              onClick={() => {
                if (!requireOnline('시간표를 수정')) return
                const initialDate = currentState.kind === 'done'
                  ? new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 12, 0, 0, 0)
                  : now
                setChangeDate(dateKey(initialDate))
                setChangeSubject('')
                setChangeOpen(true)
              }}
            >
              변경 추가
            </button>
          </div>
        ) : null}
      </header>"""
          new_actions = """      <header className={`timetable-header ${movingClass ? 'has-moving-actions' : ''}`}>
        <div>
          <p className=\"date-label\">{editing ? `${editScope === 'personal' ? '개인' : '공동'} 기본 시간표` : '이번 주'}</p>
          <h1>시간표</h1>
        </div>
        {!editing ? (
          movingClass ? (
            <div className=\"timetable-actions timetable-actions-moving\" aria-label=\"시간표 변경 종류\">
              <button className=\"timetable-action\" onClick={() => startEditing('shared')}><span>공동 기본</span><small>시간표 변경</small></button>
              <button className=\"timetable-action primary\" onClick={() => openChange('shared')}><span>공동</span><small>시간표 변경</small></button>
              <button className=\"timetable-action\" onClick={() => startEditing('personal')}><span>개인 기본</span><small>시간표 변경</small></button>
              <button className=\"timetable-action primary\" onClick={() => openChange('personal')}><span>개인</span><small>시간표 변경</small></button>
            </div>
          ) : (
            <div className=\"timetable-actions\">
              <button className=\"timetable-action\" onClick={() => startEditing('shared')}>기본 수정</button>
              <button className=\"timetable-action primary\" onClick={() => openChange('shared')}>변경 추가</button>
            </div>
          )
        ) : null}
      </header>"""
          replace_once(main, old_actions, new_actions)
          replace_once(main,
          "        <strong>{editing ? '월–금 기본 시간표' : formatWeekRange(weekDates)}</strong>",
          """        <strong>{editing ? `${editScope === 'personal' ? '개인' : '공동'} · 월–금 기본 시간표` : formatWeekRange(weekDates)}</strong>""")
          replace_once(main,
          "                        placeholder=\"—\"",
          """                        placeholder={movingClass && editScope === 'personal'
                          ? (sharedWeeklySchedule?.[day.id]?.[period.number] || '—')
                          : '—'}""")
          replace_once(main,
          "        title=\"변경 시간표 추가\"\n        subtitle=\"기본 시간표는 그대로 두고 선택한 날짜에만 적용돼.\"\n        ariaLabel=\"변경 시간표 추가\"",
          """        title={movingClass ? `${changeScope === 'personal' ? '개인' : '공동'} 시간표 변경` : '변경 시간표 추가'}
        subtitle=\"기본 시간표는 그대로 두고 선택한 날짜에만 적용돼. 지나면 자동으로 기본 시간표로 돌아와.\"
        ariaLabel={movingClass ? `${changeScope === 'personal' ? '개인' : '공동'} 시간표 변경` : '변경 시간표 추가'}""")
          replace_once(main,
          "            <button className=\"clear-changes\" onClick={clearAllChanges}>변경 모두 지우기</button>",
          """            {!movingClass ? <button className=\"clear-changes\" onClick={clearAllChanges}>변경 모두 지우기</button> : null}""")
          replace_once(main,
          "                  <strong>{change.date.getMonth() + 1}/{change.date.getDate()} {change.dayLabel} · {change.number}교시</strong>",
          """                  <strong>{change.date.getMonth() + 1}/{change.date.getDate()} {change.dayLabel} · {change.number}교시{movingClass ? ` · ${change.scope === 'personal' ? '개인' : '공동'}` : ''}</strong>""")
          replace_once(main,
          "                <button className=\"remove-change\" onClick={() => removeChange(change.date, change.number)}>되돌리기</button>",
          """                <button className=\"remove-change\" onClick={() => removeChange(change.date, change.number, change.scope)}>되돌리기</button>""")
          # AppShell receives effective + scoped schedules.
          replace_once(main,
          "    commitWeeklySchedule,\n    commitOverrides,\n  } = useSharedTimetable(profile, now)",
          """    commitWeeklySchedule,
            commitOverrides,
            sharedWeeklySchedule,
            sharedOverrides,
            personalWeeklySchedule,
            personalOverrides,
            commitPersonalWeeklySchedule,
            commitPersonalOverrides,
          } = useSharedTimetable(profile, now)""")
          replace_once(main,
          "        onSaveWeekly={commitWeeklySchedule}\n        onSaveOverrides={commitOverrides}\n        activity={activity}",
          """        sharedWeeklySchedule={sharedWeeklySchedule}
                sharedOverrides={sharedOverrides}
                personalWeeklySchedule={personalWeeklySchedule}
                personalOverrides={personalOverrides}
                onSaveWeekly={commitWeeklySchedule}
                onSaveOverrides={commitOverrides}
                onSavePersonalWeekly={commitPersonalWeeklySchedule}
                onSavePersonalOverrides={commitPersonalOverrides}
                activity={activity}""")

          css = Path('src/timetable.css')
          text = css.read_text()
          text += """

          /* Moving-class timetable actions: only used for classes 7–15. */
          .timetable-actions-moving {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            width: min(248px, 64vw);
            gap: 7px;
          }

          .timetable-actions-moving .timetable-action {
            min-width: 0;
            min-height: 44px;
            padding: 6px 8px;
            line-height: 1.05;
          }

          .timetable-actions-moving .timetable-action span,
          .timetable-actions-moving .timetable-action small {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .timetable-actions-moving .timetable-action span {
            font-size: 11.5px;
            font-weight: 700;
          }

          .timetable-actions-moving .timetable-action small {
            margin-top: 3px;
            color: var(--text-tertiary);
            font-size: 9.5px;
            font-weight: 600;
          }

          @media (max-width: 380px) {
            .timetable-header.has-moving-actions {
              align-items: stretch;
              flex-direction: column;
            }

            .timetable-actions-moving {
              width: 100%;
            }
          }
          """
          css.write_text(text)
          PY
      - name: Validate app
        run: |
          npm ci
          npm test
          npm run build
      - name: Validate backend
        working-directory: push-backend-v2
        run: |
          npm ci
          npm test
          node --check api/personal-timetable.js
      - name: Commit scoped files only
        run: |
          git config user.name jhyxng9088
          git config user.email j.hyxng9088@gmail.com
          git add src/school-sync.js src/main.jsx src/timetable.css
          git diff --cached --check
          git commit -m 'Split moving-class shared and personal timetables'
          git push
