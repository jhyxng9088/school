name: Migrate direct shared segment spring

on:
  push:
    branches:
      - work/direct-shared-segment-spring-20260905

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: work/direct-shared-segment-spring-20260905
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate segment spring ownership upstream
        run: python .github/migrate-direct-shared-segment-spring.py

      - name: Test production app
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Commit clean migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: generate shared segment spring directly'
          git push origin HEAD:work/direct-shared-segment-spring-20260905
