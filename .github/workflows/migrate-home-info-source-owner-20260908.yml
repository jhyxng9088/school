name: Diagnose home info source owner 20260908

on:
  push:
    branches:
      - work/home-info-source-owner-20260908
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-home-info-source-owner-20260908
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: work/home-info-source-owner-20260908

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Trace first home-info ordering divergence
        run: node scripts/diagnose-home-info-order-20260908.mjs
