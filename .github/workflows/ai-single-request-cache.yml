name: Optimize AI requests once

on:
  push:
    branches: [ai-single-request-cache]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-single-request-cache
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded AI-only patch
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          ai_path = Path('src/firebase-ai.js')
          ai = ai_path.read_text()
          ai = replace_once(
              ai,
              "const TYPE_SET = new Set(['task', 'performance', 'exam', 'material'])\n",
              "const TYPE_SET = new Set(['task', 'performance', 'exam', 'material'])\n"
              "const ATTACHMENT_ANALYSIS_CACHE_KEY = 'school.ai.attachmentAnalysisCache.v1'\n"
              "const ATTACHMENT_ANALYSIS_CACHE_TTL_MS = 7 * 24 * 60 * 60 * 1000\n"
              "const ATTACHMENT_ANALYSIS_CACHE_MAX = 12\n",
              'cache constants',
          )

          helpers = r'''async function sha256Hex(value) {
            if (!globalThis.crypto?.subtle) return ''
            const bytes = value instanceof Blob
              ? new Uint8Array(await value.arrayBuffer())
              : new TextEncoder().encode(String(value || ''))
            const digest = await globalThis.crypto.subtle.digest('SHA-256', bytes)
            return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, '0')).join('')
          }

          function localDayKey(now) {
            const pad = (number) => String(number).padStart(2, '0')
            return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`
          }

          async function attachmentAnalysisCacheId(input, now, files) {
            if (!globalThis.crypto?.subtle || !files.length) return ''
            try {
              const fileHashes = await Promise.all(files.map((file) => sha256Hex(file)))
              if (fileHashes.some((hash) => !hash)) return ''
              return sha256Hex([
                localDayKey(now),
                String(input || '').trim().slice(0, 140),
                ...fileHashes,
              ].join('\n'))
            } catch {
              return ''
            }
          }

          function readAttachmentAnalysisCache() {
            try {
              const stored = JSON.parse(localStorage.getItem(ATTACHMENT_ANALYSIS_CACHE_KEY) || '[]')
              if (!Array.isArray(stored)) return []
              const cutoff = Date.now() - ATTACHMENT_ANALYSIS_CACHE_TTL_MS
              return stored
                .filter((entry) => entry && typeof entry === 'object' && Number(entry.savedAt || 0) >= cutoff)
                .slice(0, ATTACHMENT_ANALYSIS_CACHE_MAX)
            } catch {
              return []
            }
          }

          function cachedAttachmentAnalysis(cacheId) {
            if (!cacheId) return null
            const entry = readAttachmentAnalysisCache().find((item) => item.key === cacheId)
            if (!entry?.result) return null
            const base = normalizeResult(entry.result)
            const summary = normalizeSummary(entry.result.summary)
            if (!base || !summary) return null
            const attachment = normalizeAttachment(entry.result.attachment)
            const attachments = Array.isArray(entry.result.attachments)
              ? entry.result.attachments.map(normalizeAttachment).filter(Boolean)
              : []
            return {
              ...base,
              summary,
              ...(attachment ? { attachment } : {}),
              ...(attachments.length ? { attachments } : {}),
              modelName: String(entry.result.modelName || ''),
            }
          }

          function cacheAttachmentAnalysis(cacheId, result) {
            if (!cacheId || !result?.summary) return
            try {
              const entries = readAttachmentAnalysisCache().filter((entry) => entry.key !== cacheId)
              entries.unshift({ key: cacheId, savedAt: Date.now(), result })
              localStorage.setItem(
                ATTACHMENT_ANALYSIS_CACHE_KEY,
                JSON.stringify(entries.slice(0, ATTACHMENT_ANALYSIS_CACHE_MAX)),
              )
            } catch {
              // Cache is only an optimization. AI analysis still works without local storage.
            }
          }

          '''
          ai = replace_once(
              ai,
              'function normalizeResult(value, attachmentMeta = null) {',
              helpers + 'function normalizeResult(value, attachmentMeta = null) {',
              'cache helpers',
          )

          new_parse = r'''export async function parseReminderWithAI(input, now = new Date(), attachmentInput = null) {
            const files = Array.isArray(attachmentInput)
              ? attachmentInput.filter((file) => file instanceof Blob).slice(0, 4)
              : attachmentInput instanceof Blob ? [attachmentInput] : []

            if (!files.length) {
              try {
                return await parseReminderWithAISingle(input, now, null)
              } catch (error) {
                if (!shouldUseDirectRecovery(error)) throw error
                return directReminderResult(input, now, [], { titleOnly: true, smartRecovery: true })
              }
            }

            const cacheId = await attachmentAnalysisCacheId(input, now, files)
            const cached = cachedAttachmentAnalysis(cacheId)
            if (cached) return cached

            const result = await directReminderResult(input, now, files, { titleOnly: false, smartRecovery: false })
            const attachments = files.map((file) => normalizeAttachment({
              name: String(file.name || '첨부파일').slice(0, 120),
              mimeType: inferredAttachmentType(file),
              size: Number(file.size || 0),
            })).filter(Boolean)
            const enriched = {
              ...result,
              attachment: attachments[0] || null,
              attachments,
            }
            cacheAttachmentAnalysis(cacheId, enriched)
            return enriched
          }
          '''
          pattern = r'export async function parseReminderWithAI\(input, now = new Date\(\), attachmentInput = null\) \{.*\Z'
          ai, count = re.subn(pattern, new_parse, ai, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'single request parser: expected 1 match, found {count}')
          ai_path.write_text(ai)

          todo_path = Path('src/todo-stage5-ai.jsx')
          todo = todo_path.read_text()
          effect_start = '      parseReminderTitleWithAI(text, requestNow, files)'
          effect_end = '    }, hasAttachment ? 220 : 550)'
          if todo.count(effect_start) != 1 or todo.count(effect_end) != 1:
              raise SystemExit('AI effect anchors are not unique')
          start = todo.index(effect_start)
          end = todo.index(effect_end, start)
          new_effect = r'''      if (hasAttachment) {
                setSummaryState('loading')
                const promise = parseReminderWithAI(text, requestNow, files)
                summaryPromiseRef.current = { requestId, promise }
                promise
                  .then((parsed) => {
                    if (aiRequestRef.current !== requestId) return
                    if (parsed) setAiResult(parsed)
                    if (parsed?.summary) setSummaryResult(parsed)
                    setAiError(null)
                    setSummaryError(null)
                    setAiState(parsed?.title && parsed?.dueDate ? 'ready' : 'error')
                    setSummaryState(parsed?.summary ? 'ready' : 'error')
                  })
                  .catch((error) => {
                    if (aiRequestRef.current !== requestId) return
                    console.error('Reminder attachment AI failed:', error)
                    const details = {
                      name: error?.name || null,
                      code: error?.code || null,
                      message: error?.message || null,
                      status: error?.status || null,
                      customData: error?.customData ? JSON.stringify(error.customData) : null,
                    }
                    setAiError(details)
                    setSummaryError(details)
                    setAiState('error')
                    setSummaryState('error')
                  })
                return
              }

              parseReminderTitleWithAI(text, requestNow, null)
                .then((parsed) => {
                  if (aiRequestRef.current !== requestId) return
                  if (parsed) setAiResult(parsed)
                  setAiError(null)
                  setAiState(parsed ? 'ready' : 'error')
                })
                .catch((error) => {
                  if (aiRequestRef.current !== requestId) return
                  console.error('Reminder title AI failed:', error)
                  setAiError({
                    name: error?.name || null,
                    code: error?.code || null,
                    message: error?.message || null,
                    status: error?.status || null,
                    customData: error?.customData ? JSON.stringify(error.customData) : null,
                  })
                  setAiState('error')
                })
          '''
          todo = todo[:start] + new_effect + todo[end:]

          switch_start = '  function switchToManual() {'
          switch_end = '\n\n  async function finishReminderEnrichment'
          if todo.count(switch_start) != 1 or todo.count(switch_end) != 1:
              raise SystemExit('manual switch anchors are not unique')
          start = todo.index(switch_start)
          end = todo.index(switch_end, start)
          new_switch = r'''  function switchToManual() {
            const readyAttachmentSummary = attachmentFiles.length && summaryResult?.summary
              ? withAttachmentManifest(summaryResult.summary, attachmentFiles)
              : null
            setDraft(naturalResult ? {
              id: '',
              type: naturalResult.type,
              title: naturalResult.title,
              dueDate: naturalResult.dueDate,
              dueTime: naturalResult.dueTime || '',
              summary: attachmentFiles.length
                ? (readyAttachmentSummary || createPendingReminderSummary(attachmentFiles))
                : naturalResult.summary || null,
              attachment: summaryResult?.attachment || naturalResult.attachment || null,
            } : emptyDraft(now))
            resetAI()
            setSheetMode('manual')
            syncPickerDisplays()
          }'''
          todo = todo[:start] + new_switch + todo[end:]

          old_manual = (
              "    const files = attachmentFiles.slice()\n"
              "    const draftToSave = createId && files.length\n"
              "      ? { ...draft, summary: createPendingReminderSummary(files), attachment: null }\n"
              "      : draft\n"
          )
          new_manual = (
              "    const files = attachmentFiles.slice()\n"
              "    const hasReadyAttachmentSummary = Boolean(files.length && draft.summary && !isReminderSummaryPending(draft.summary))\n"
              "    const draftToSave = createId && files.length\n"
              "      ? {\n"
              "          ...draft,\n"
              "          summary: hasReadyAttachmentSummary ? draft.summary : createPendingReminderSummary(files),\n"
              "          attachment: hasReadyAttachmentSummary ? draft.attachment || null : null,\n"
              "        }\n"
              "      : draft\n"
          )
          todo = replace_once(todo, old_manual, new_manual, 'manual summary preservation')

          old_finish = (
              "      pendingCreateIdRef.current = ''\n"
              "      if (createId && files.length) void finishReminderEnrichment(savedId, draft.title.trim(), files, null)\n"
          )
          new_finish = (
              "      pendingCreateIdRef.current = ''\n"
              "      if (createId && files.length) {\n"
              "        const existingSummaryPromise = hasReadyAttachmentSummary\n"
              "          ? Promise.resolve({\n"
              "              type: draft.type,\n"
              "              title: draft.title,\n"
              "              dueDate: draft.dueDate,\n"
              "              dueTime: draft.dueTime || '',\n"
              "              summary: draft.summary,\n"
              "              attachment: draft.attachment || null,\n"
              "            })\n"
              "          : null\n"
              "        void finishReminderEnrichment(savedId, draft.title.trim(), files, existingSummaryPromise)\n"
              "      }\n"
          )
          todo = replace_once(todo, old_finish, new_finish, 'manual enrichment reuse')
          todo_path.write_text(todo)
          PY
      - name: Verify only intended source files changed
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'src/firebase-ai.js\nsrc/todo-stage5-ai.jsx'
      - name: Build
        run: |
          npm install
          npm run build
      - name: Commit tested patch and remove temporary workflow
        run: |
          rm .github/workflows/ai-single-request-cache.yml
          git config user.name "jhyxng9088"
          git config user.email "j.hyxng9088@gmail.com"
          git add src/firebase-ai.js src/todo-stage5-ai.jsx .github/workflows/ai-single-request-cache.yml
          git commit -m "Reduce reminder AI requests and cache attachment analysis"
          git push origin HEAD:ai-single-request-cache
