name: Fix fallback and timetable overlap

on:
  push:
    paths:
      - '.github/workflows/fix_fallback_and_timetable_overlap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patch
        run: python3 .github/scripts/fix_fallback_and_timetable_overlap.py
      - name: Verify diff
        run: git diff --check
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/firebase-ai-direct.js src/timetable.css
          git commit -m "Fix AI fallback order and timetable field overlap" || exit 0
          git push
