name: Hide timetable cell attribution

on:
  push:
    paths:
      - '.github/workflows/hide_timetable_cell_attribution.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patch
        run: python3 .github/scripts/hide_timetable_cell_attribution.py
      - name: Verify diff
        run: git diff --check
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Verify exact scope
        run: |
          ! grep -q 'week-cell-attribution' src/main.jsx
          grep -q 'timetable-attribution' src/main.jsx
          grep -q 'recordClassActivities(profile' src/main.jsx
      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git commit -m "Hide timetable cell attribution labels" || exit 0
          git push
